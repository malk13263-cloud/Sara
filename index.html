<title>سارة — رفيقة التدريب</title>
<style>
:root{
  --ivory:#FAF6EF;
  --cream:#F2EAE0;
  --cream-2:#EAE0D3;
  --taupe:#B4A28F;
  --taupe-2:#8E7F70;
  --charcoal:#2A2522;
  --ink:#191614;
  --burgundy:#6E2233;
  --burgundy-2:#8A2E42;
  --burgundy-deep:#43121D;
  --burgundy-wash:rgba(110,34,51,.07);
  --olive:#6C7358;
  --line:rgba(42,37,34,.12);
  --line-2:rgba(42,37,34,.06);
  --shadow:0 1px 2px rgba(42,37,34,.05), 0 8px 24px rgba(42,37,34,.06);
  --r:18px;
  --r-s:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --ar:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro","Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
  --lat:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--ar);
  background:var(--ivory);
  color:var(--charcoal);
  font-size:16px;
  line-height:1.7;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;padding:0;}
input,textarea{outline:none;}
a{color:inherit;}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--lat);letter-spacing:.01em;}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}

/* ---------- shell ---------- */
#app{max-width:540px;margin:0 auto;min-height:100vh;position:relative;}
.screen{display:none;padding:calc(var(--safe-t) + 18px) 20px calc(96px + var(--safe-b));animation:fade .45s ease both;}
.screen.on{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;}}

/* ---------- typography ---------- */
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--taupe-2);text-transform:uppercase;margin:0 0 6px;}
h1{font-size:27px;line-height:1.35;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;}
h2{font-size:19px;font-weight:600;margin:0 0 10px;}
h3{font-size:16px;font-weight:600;margin:0 0 6px;}
.muted{color:var(--taupe-2);font-size:14px;}
.tiny{font-size:12.5px;color:var(--taupe-2);line-height:1.6;}
.sect{margin:30px 0 0;}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;}
.sect-h .eyebrow{margin:0;}

/* hand-drawn divider */
.rule{height:10px;margin:26px 0;opacity:.5;}
.rule svg{width:100%;height:10px;display:block;}

/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);}
.card+.card{margin-top:12px;}
.card-flat{background:var(--cream);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;box-shadow:none;}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;background:var(--burgundy);color:#fff;font-size:17px;font-weight:600;letter-spacing:.01em;transition:transform .12s ease,background .2s;}
.btn:active{transform:scale(.985);background:var(--burgundy-deep);}
.btn.ghost{background:transparent;color:var(--burgundy);border:1px solid rgba(110,34,51,.3);}
.btn.ghost:active{background:var(--burgundy-wash);}
.btn.quiet{background:var(--cream);color:var(--charcoal);border:1px solid var(--line);}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px;}
.btn[disabled]{opacity:.4;pointer-events:none;}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:999px;background:var(--cream);border:1px solid var(--line-2);font-size:14px;font-weight:500;transition:.18s;}
.chip.on{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}

/* ---------- today ---------- */
.greet{margin:6px 0 2px;font-size:15px;color:var(--taupe-2);}
.day-hero{position:relative;background:#fff;border:1px solid var(--line-2);border-radius:22px;padding:22px 20px 20px;box-shadow:var(--shadow);overflow:hidden;}
.day-hero .mark{position:absolute;inset-inline-start:-30px;top:-40px;opacity:.06;pointer-events:none;}
.day-name{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--burgundy);}
.day-type{font-size:15px;letter-spacing:.14em;color:var(--taupe-2);margin-top:2px;}
.day-meta{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;}
.meta-i{display:flex;flex-direction:column;gap:1px;}
.meta-i b{font-size:19px;font-weight:600;}
.meta-i span{font-size:11.5px;letter-spacing:.1em;color:var(--taupe-2);}

/* ---------- constellation ---------- */
.constel{width:100%;max-width:330px;margin:0 auto;display:block;}
.node-c{transition:.5s;}
.node-lbl{font-size:11px;fill:var(--taupe-2);font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;}
.node-lbl.done{fill:var(--burgundy);font-weight:600;}

/* ---------- canvas ---------- */
.canvas-wrap{background:linear-gradient(160deg,#FFFDF9,#F3EBE0);border:1px solid var(--line-2);border-radius:var(--r);padding:8px;box-shadow:var(--shadow);}
.canvas-wrap svg{display:block;width:100%;height:auto;border-radius:12px;}
.draw{stroke-dasharray:var(--len,900);stroke-dashoffset:var(--len,900);animation:draw 1.6s cubic-bezier(.3,.7,.3,1) forwards;}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- week list ---------- */
.dayrow{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:14px 16px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);margin-bottom:10px;box-shadow:0 1px 2px rgba(42,37,34,.04);transition:.15s;}
.dayrow:active{transform:scale(.99);}
.dayrow.today{border-color:rgba(110,34,51,.35);background:linear-gradient(180deg,#fff,rgba(110,34,51,.03));}
.dayrow.rest{background:var(--cream);}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--taupe);flex:none;}
.dot.done{background:var(--burgundy);border-color:var(--burgundy);}
.dayrow .nm{font-weight:600;font-size:16.5px;}
.dayrow .tp{font-size:12.5px;color:var(--taupe-2);letter-spacing:.08em;}
.dayrow .rt{margin-inline-start:auto;font-size:12.5px;color:var(--taupe-2);text-align:end;}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:var(--ivory);z-index:60;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.overlay.on{display:flex;}
.ov-head{position:sticky;top:0;background:rgba(250,246,239,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-2);padding:calc(var(--safe-t) + 12px) 18px 12px;display:flex;align-items:center;gap:12px;z-index:2;}
.ov-body{padding:18px 20px calc(40px + var(--safe-b));max-width:540px;width:100%;margin:0 auto;flex:1;}
.x{width:38px;height:38px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--taupe-2);flex:none;}
.ov-title{font-weight:600;font-size:16px;}
.ov-sub{font-size:12px;color:var(--taupe-2);letter-spacing:.08em;}
.prog-bar{height:3px;background:var(--cream-2);border-radius:2px;overflow:hidden;margin-top:10px;}
.prog-bar i{display:block;height:100%;background:var(--burgundy);border-radius:2px;transition:width .4s ease;}

/* ---------- workout ---------- */
.ex-name{font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.01em;}
.ex-en{font-size:14px;color:var(--taupe-2);margin-top:2px;}
.setline{display:flex;align-items:baseline;gap:8px;margin-top:14px;}
.setline b{font-size:32px;font-weight:600;color:var(--burgundy);}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.pill{background:var(--cream);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--charcoal);}
.pill.b{background:var(--burgundy-wash);color:var(--burgundy);}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.field{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 8px 12px;text-align:center;}
.field label{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--taupe-2);margin-bottom:4px;}
.stepper{display:flex;align-items:center;justify-content:center;gap:6px;}
.stepper button{width:40px;height:40px;border-radius:11px;background:var(--cream);font-size:21px;line-height:1;color:var(--burgundy);flex:none;display:flex;align-items:center;justify-content:center;}
.stepper button:active{background:var(--cream-2);}
.stepper input{width:70px;text-align:center;font-size:25px;font-weight:600;border:none;background:transparent;padding:4px 0;direction:ltr;font-variant-numeric:tabular-nums;}
.setgrid{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
.setbox{flex:1;min-width:56px;border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;color:var(--taupe-2);background:#fff;}
.setbox.done{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
.setbox.cur{border-color:var(--burgundy);border-width:1.5px;color:var(--burgundy);}
.setbox b{display:block;font-size:14px;font-weight:600;direction:ltr;}
.checkrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:start;padding:13px 14px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff;margin-bottom:9px;}
.checkrow .bx{width:23px;height:23px;border-radius:7px;border:1.5px solid var(--taupe);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;margin-top:2px;}
.checkrow.on .bx{background:var(--burgundy);border-color:var(--burgundy);}
.checkrow.on{background:var(--burgundy-wash);border-color:rgba(110,34,51,.18);}
.note-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;resize:none;line-height:1.6;font-size:15px;min-height:70px;}

/* rule banner */
.banner{border-inline-start:3px solid var(--burgundy);background:var(--burgundy-wash);border-radius:10px;padding:13px 15px;font-size:14.5px;line-height:1.75;}
.banner.olive{border-color:var(--olive);background:rgba(108,115,88,.08);}
.clue{background:var(--charcoal);color:#F5EFE7;border-radius:var(--r);padding:17px 18px;}
.clue .k{font-size:11px;letter-spacing:.24em;color:var(--taupe);text-transform:uppercase;}
.clue .t{font-size:16.5px;margin-top:7px;line-height:1.75;}
.word{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow);}
.word .w{font-family:var(--lat);font-size:26px;direction:ltr;color:var(--burgundy);line-height:1.1;}

/* rest timer */
#rest{position:fixed;inset:0;z-index:80;background:linear-gradient(170deg,#2A2522,#43121D);color:#F5EFE7;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px calc(30px + var(--safe-b));}
#rest.on{display:flex;}
#rest .lbl{font-size:12px;letter-spacing:.3em;color:rgba(245,239,231,.55);}
#rest .clock{font-size:78px;font-weight:300;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 2px;letter-spacing:-.02em;}
#rest .nx{font-size:15px;color:rgba(245,239,231,.7);text-align:center;margin-bottom:26px;}
#rest .ctrls{display:flex;gap:10px;width:100%;max-width:340px;}
#rest .ctrls button{flex:1;min-height:50px;border-radius:13px;background:rgba(255,255,255,.11);color:#F5EFE7;font-size:15px;font-weight:500;}
#rest .quick{display:flex;gap:8px;margin-bottom:18px;}
#rest .quick button{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.09);color:rgba(245,239,231,.8);font-size:14px;}
#rest .quick button.on{background:#F5EFE7;color:var(--burgundy-deep);font-weight:600;}
.ringwrap{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg);}
.ringwrap .inner{position:relative;text-align:center;}

/* rpe */
.rpe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px;}
.rpe-b{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 6px;text-align:center;transition:.15s;}
.rpe-b b{display:block;font-size:19px;font-weight:600;direction:ltr;}
.rpe-b span{font-size:11.5px;color:var(--taupe-2);}
.rpe-b:active,.rpe-b.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
.rpe-b.on span,.rpe-b:active span{color:rgba(255,255,255,.75);}
.rpe-b.wide{grid-column:span 3;padding:11px;}

/* history */
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:13px 15px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);margin-bottom:8px;}
.hrow .arrow{margin-inline-start:auto;color:var(--taupe);font-size:16px;}
table.hist{width:100%;border-collapse:collapse;font-size:14px;}
table.hist th{font-size:11px;letter-spacing:.12em;color:var(--taupe-2);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;}
table.hist td{padding:10px 6px;border-bottom:1px solid var(--line-2);}
table.hist td.n{direction:ltr;font-variant-numeric:tabular-nums;}

/* nav */
#nav{position:fixed;bottom:0;inset-inline:0;z-index:40;background:rgba(250,246,239,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-2);padding:8px 6px calc(6px + var(--safe-b));display:none;}
#nav.on{display:block;}
#nav .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--taupe-2);font-size:11px;border-radius:12px;}
#nav button.on{color:var(--burgundy);font-weight:600;}
#nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}

/* onboarding */
#onb{position:fixed;inset:0;z-index:100;background:var(--ivory);display:none;align-items:center;justify-content:center;padding:40px 28px calc(40px + var(--safe-b));}
#onb.on{display:flex;}
.onb-s{display:none;text-align:center;max-width:400px;width:100%;animation:fade .7s ease both;}
.onb-s.on{display:block;}
.onb-s h2{font-size:26px;font-weight:600;line-height:1.5;}
.onb-dots{position:absolute;bottom:calc(26px + var(--safe-b));inset-inline:0;display:flex;gap:7px;justify-content:center;}
.onb-dots i{width:6px;height:6px;border-radius:50%;background:var(--taupe);opacity:.35;transition:.3s;}
.onb-dots i.on{opacity:1;background:var(--burgundy);width:20px;border-radius:3px;}

/* modal */
#modal{position:fixed;inset:0;z-index:120;background:rgba(25,22,20,.4);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
#modal.on{display:flex;}
#modal .box{background:var(--ivory);border-radius:22px 22px 0 0;padding:24px 22px calc(24px + var(--safe-b));width:100%;max-width:540px;animation:up .3s ease both;}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#modal h3{font-size:19px;}
#modal .acts{display:flex;flex-direction:column;gap:9px;margin-top:18px;}

/* toast */
#toast{position:fixed;bottom:calc(92px + var(--safe-b));inset-inline:0;display:flex;justify-content:center;z-index:200;pointer-events:none;}
#toast div{background:var(--charcoal);color:var(--ivory);padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transform:translateY(10px);transition:.3s;max-width:88%;text-align:center;}
#toast div.on{opacity:1;transform:none;}

/* misc */
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:15px;}
.kv:last-child{border-bottom:none;}
.kv b{font-weight:600;direction:ltr;unicode-bidi:isolate;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);padding:14px;box-shadow:0 1px 2px rgba(42,37,34,.04);}
.stat b{display:block;font-size:25px;font-weight:600;color:var(--burgundy);direction:ltr;line-height:1.2;}
.stat span{font-size:12px;color:var(--taupe-2);}
.empty{text-align:center;padding:34px 18px;color:var(--taupe-2);font-size:14.5px;line-height:1.8;}
.sig{font-family:var(--lat);font-style:italic;color:var(--burgundy);}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.gallery .g{background:linear-gradient(160deg,#FFFDF9,#F3EBE0);border:1px solid var(--line-2);border-radius:14px;padding:6px;}
.gallery .g svg{width:100%;height:auto;display:block;}
.gallery .g p{margin:5px 4px 2px;font-size:11.5px;color:var(--taupe-2);text-align:center;}
/* rehabilitation phase — calm olive accent, same design language */
.rehab-panel{border-inline-start:3px solid var(--olive);background:rgba(108,115,88,.07);border-radius:10px;padding:13px 15px;font-size:14.5px;line-height:1.75;}
.journey .jstep{display:flex;gap:12px;align-items:flex-start;}
.journey .jnum{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--taupe);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;color:var(--taupe-2);margin-top:2px;}
.journey .jnum.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
.journey .jnum.half{border-color:var(--olive);color:var(--olive);border-style:dashed;}
.journey .jline{width:1.5px;height:20px;background:var(--line);margin-inline-start:12px;}
.journey .jt{font-weight:600;font-size:15.5px;}
.journey .js{font-size:12.5px;color:var(--taupe-2);}
.journey .jok{margin-inline-start:auto;font-size:13px;color:var(--burgundy);}
.bars{margin:14px 0 4px;}
.bars .brow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--taupe-2);margin-top:9px;}
.bars .bar{height:5px;background:var(--cream-2);border-radius:3px;overflow:hidden;margin-top:4px;}
.bars .bar i{display:block;height:100%;background:var(--burgundy);border-radius:3px;transition:width .4s ease;}
.bars .bar.rehab i{background:var(--olive);}
.mark2{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--taupe-2);}
.mark2 b{font-weight:600;}
:focus-visible{outline:2px solid var(--burgundy);outline-offset:2px;border-radius:6px;}
.hidden{display:none!important;}
</style>
</head>

/* =========================================================
   2) STORAGE — IndexedDB only, fully local
   ========================================================= */
const DB_NAME = "sara_training";
const DB_STORE = "state";
const DB_KEY = "app";
const LS_KEY = "sara_training_state_v1";
let _db = null, _idbOK = false, _lsOK = false;

function openDB(){
  return new Promise(function(resolve){
    let req;
    try{ req = indexedDB.open(DB_NAME, 1); }
    catch(e){ return resolve(null); }
    let settled = false;
    const done = function(v){ if(!settled){ settled = true; resolve(v); } };
    req.onupgradeneeded = function(){ const d = req.result; if(!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE); };
    req.onsuccess = function(){ _db = req.result; _idbOK = true; done(_db); };
    req.onerror = function(){ done(null); };
    req.onblocked = function(){ done(null); };
    setTimeout(function(){ done(null); }, 3000);
  });
}
function dbGet(){
  return new Promise(function(resolve){
    if(!_db) return resolve(null);
    try{
      const tx = _db.transaction(DB_STORE,"readonly");
      const r = tx.objectStore(DB_STORE).get(DB_KEY);
      r.onsuccess = function(){ resolve(r.result || null); };
      r.onerror = function(){ resolve(null); };
    }catch(e){ resolve(null); }
  });
}
function dbPut(val){
  return new Promise(function(resolve){
    if(!_db) return resolve(false);
    try{
      const tx = _db.transaction(DB_STORE,"readwrite");
      tx.objectStore(DB_STORE).put(val, DB_KEY);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ resolve(false); };
      tx.onabort = function(){ resolve(false); };
    }catch(e){ resolve(false); }
  });
}
/* second, independent copy — survives in browsers where IndexedDB is cleared or blocked */
function lsGet(){
  try{ const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; }
}
function lsPut(val){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(val)); _lsOK = true; return true; }
  catch(e){ _lsOK = false; return false; }
}
function storageMode(){
  if(_idbOK && _lsOK) return "idb+ls";
  if(_idbOK) return "idb";
  if(_lsOK) return "ls";
  return "none";
}
/* writes, then reads back, and reports what actually happened */
function storageTest(){
  const stamp = Date.now();
  state.savedAt = stamp;
  const snap = JSON.parse(JSON.stringify(state));
  let lsMsg;
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(snap));
    const back = lsGet();
    _lsOK = !!(back && back.savedAt === stamp);
    lsMsg = _lsOK ? "يعمل ✓" : "الكتابة تمت لكن القراءة رجعت فارغة";
  }catch(e){ _lsOK = false; lsMsg = "محجوب — " + (e && e.name ? e.name : "خطأ"); }

  dbPut(snap).then(function(ok){
    if(!ok) return null;
    return dbGet();
  }).then(function(back){
    const idbOk = !!(back && back.savedAt === stamp);
    _idbOK = idbOk;
    const where = (location.protocol === "file:") ? "ملف محلي (file://)"
                : (location.protocol === "http:" || location.protocol === "https:") ? (location.host || location.protocol)
                : (location.protocol + " — معاينة داخل تطبيق");
    let h = '<h3>اختبار الحفظ</h3>';
    h += '<div class="kv"><span>مكان التشغيل</span><b style="direction:ltr;font-size:12.5px">'+esc(where)+'</b></div>';
    h += '<div class="kv"><span>IndexedDB</span><b style="direction:rtl;font-size:13px">'+(idbOk?"يعمل ✓":"غير متاح")+'</b></div>';
    h += '<div class="kv"><span>التخزين المحلي</span><b style="direction:rtl;font-size:13px">'+esc(lsMsg)+'</b></div>';
    if(idbOk || _lsOK){
      h += '<div class="banner olive" style="margin-top:12px">الحفظ يعمل هنا. إذا فُقد التقدّم رغم ذلك، فالسبب غالبًا فتح نسخة ملف مختلفة عن التي حُفظ فيها.</div>';
    } else {
      h += '<div class="banner" style="margin-top:12px">هذا المتصفح لا يسمح بالتخزين في هذا المكان. الأسباب المعتادة: فتح الملف مباشرة من «الملفات»، أو معاينة داخل تطبيق، أو تصفّح خاص.<br><span class="tiny">الحل: تشغيل التطبيق من رابط ويب ثابت وإضافته إلى الشاشة الرئيسية، أو الاعتماد على التصدير والاستيراد.</span></div>';
    }
    h += '<div class="acts"><button class="btn quiet sm" data-act="export">تصدير نسخة الآن</button><button class="btn quiet sm" data-act="modal-close">إغلاق</button></div>';
    modal(h);
    render();
  });
}
function storageLabel(){
  const m = storageMode();
  if(m==="idb+ls") return "IndexedDB + نسخة محلية احتياطية";
  if(m==="idb") return "IndexedDB";
  if(m==="ls") return "التخزين المحلي للمتصفح";
  return "غير متاح — لن يُحفظ التقدّم";
}

   ========================================================= */
function defaultState(){
  return {
    version:1,
    onboarded:false,
    startedAt:null,
    currentWeek:1,
    sessions:[],                 /* completed main workouts */
    rehabSessions:[],            /* completed rehabilitation phases */
    notes:{},                    /* exerciseId -> [{week,date,text}] */
    reflections:{},              /* week -> {a,b,c} */
    restPrefs:{},                /* exerciseId -> [secs...] */
    deload:{ weeks:[], lastDeloadWeek:0, postponed:false },
    settings:{ cardioMachine:"bike", cardioMinutes:20, flexRest:75 },
    lastCanvasSeen:0,
    savedAt:null
  };
}
let state = defaultState();
let saveTimer = null;
function snapshot(){
  state.savedAt = Date.now();
  return JSON.parse(JSON.stringify(state));
}
/* every save is written to BOTH stores, so one of them surviving is enough */
function persistAll(){
  const snap = snapshot();
  lsPut(snap);
  return dbPut(snap).then(function(ok){ return ok || _lsOK; });
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ persistAll(); }, 120);
}
function flushSave(){ clearTimeout(saveTimer); persistAll(); }
function saveNow(){ clearTimeout(saveTimer); return persistAll(); }

const $ = function(s,r){ return (r||document).querySelector(s); };
const $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function en(s){ return '<span class="en">'+esc(s)+'</span>'; }

function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return ""; const p=String(iso).split("-"); return p[2]+"/"+p[1]; }
function mmss(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function pick(arr,seed){ return arr[Math.abs(Math.floor(seed))%arr.length]; }
function rng(seed){ let t = seed>>>0; return function(){ t += 0x6D2B79F5; let x = Math.imul(t ^ (t>>>15), 1|t); x ^= x + Math.imul(x ^ (x>>>7), 61|x); return ((x ^ (x>>>14))>>>0)/4294967296; }; }
function toast(msg){
  const t = $("#toast-t"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2400);
}

/* ---- program helpers ---- */
function setsFor(exercise, week){
  if(isDeload(week)) return Math.max(3, Math.round(exercise.sets*0.75));
  return exercise.sets;
}
function isDeload(week){ return state.deload.weeks.indexOf(week==null?state.currentWeek:week) !== -1; }
function restSeconds(exercise){ return exercise.rest === "flex" ? (state.settings.flexRest||75) : exercise.rest; }
function restLabel(exercise){ return exercise.rest === "flex" ? "60–90 ث" : "دقيقتان"; }
function totalSets(day, week){
  const d = workoutProgram[day];
  if(d.kind!=="strength") return 0;
  return d.exercises.reduce(function(a,e){ return a + setsFor(e, week); },0);
}
function estMinutes(day, week){
  const d = workoutProgram[day];
  if(d.kind==="cardio") return state.settings.cardioMinutes + 6;
  if(d.kind!=="strength") return 0;
  let s = 0;
  d.exercises.forEach(function(e){ const n = setsFor(e, week); s += n*45 + (n-1)*restSeconds(e) + 30; });
  return Math.round((s/60) + 9);
}
function sessionsOfWeek(w){ return state.sessions.filter(function(s){ return s.week===w; }); }
/* --- rehabilitation phase (phase 1) --- */
function isRehabDone(day, w){
  w = (w==null)? state.currentWeek : w;
  return state.rehabSessions.some(function(r){ return r.week===w && r.day===day; });
}
function recordRehab(day, w, kind){
  if(isRehabDone(day,w)) return;
  state.rehabSessions.push({ week:w, day:day, kind:kind, date:todayISO() });
  saveNow();
}
/* a day counts as complete only when both required phases are done */
function isDayFull(day, w){
  w = (w==null)? state.currentWeek : w;
  if(day===7) return isRehabDone(7,w);
  return isRehabDone(day,w) && isDayDone(day,w);
}
/* 0 = nothing, 1 = rehabilitation only, 2 = both phases */
function dayState(day, w){
  w = (w==null)? state.currentWeek : w;
  if(isDayFull(day,w)) return 2;
  if(isRehabDone(day,w) || isDayDone(day,w)) return 1;
  return 0;
}
function isDayDone(day, w){ return sessionsOfWeek(w==null?state.currentWeek:w).some(function(s){ return s.day===day; }); }
function weekDoneCount(w){ let c=0; for(let i=1;i<=6;i++) if(isDayFull(i,w)) c++; return c; }
function weekComplete(w){ return weekDoneCount(w==null?state.currentWeek:w)===6; }
function nextDay(){
  for(let i=1;i<=6;i++) if(!isDayFull(i)) return i;
  return 7;
}
function exerciseById(id){
  for(const k in workoutProgram){
    const d = workoutProgram[k];
    if(d.exercises) for(let i=0;i<d.exercises.length;i++) if(d.exercises[i].id===id) return d.exercises[i];
  }
  return null;
}
function dayOfExercise(id){
  for(const k in workoutProgram){
    const d = workoutProgram[k];
    if(d.exercises && d.exercises.some(function(e){return e.id===id;})) return d;
  }
  return null;
}
/* history for one exercise: [{week,date,sets:[{w,r,rpe}]}] newest last */
function historyOf(id){
  const out = [];
  state.sessions.forEach(function(s){
    if(!s.entries) return;
    const e = s.entries.filter(function(x){ return x.ex===id; });
    if(e.length) out.push({ week:s.week, date:s.date, sets:e.map(function(x){ return {w:x.weight, r:x.reps, rpe:x.rpe}; }) });
  });
  return out;
}
function lastPerf(id){ const h = historyOf(id); return h.length? h[h.length-1] : null; }
function avgRpeOf(sets){
  const v = sets.map(function(s){return s.rpe;}).filter(function(x){ return typeof x==="number"; });
  if(!v.length) return null;
  return Math.round((v.reduce(function(a,b){return a+b;},0)/v.length)*10)/10;
}
function lastNote(id){ const n = state.notes[id]; return (n&&n.length)? n[n.length-1] : null; }

/* =========================================================
   5) INTELLIGENCE — restrained, data-backed only
   ========================================================= */
/* Progression: only when top of range is repeatedly reached at RPE <= 7 */
function progressionHint(id){
  const exd = exerciseById(id); if(!exd) return null;
  const h = historyOf(id);
  if(h.length < 2) return null;
  const recent = h.slice(-2);
  const ok = recent.every(function(s){
    const reps = s.sets.map(function(x){return x.r;}).filter(function(x){return typeof x==="number";});
    if(reps.length < 3) return false;
    const allTop = reps.every(function(r){ return r >= exd.hi; });
    const ar = avgRpeOf(s.sets);
    return allTop && (ar===null || ar <= 7);
  });
  if(!ok) return null;
  return "الأداء صار مريحًا نسبيًا. في الجلسة القادمة يمكنك التفكير بزيادة بسيطة جدًا في الوزن إذا كان ذلك مناسبًا.";
}
/* Observations from stored data only */
function observations(id){
  const out = [];
  const h = historyOf(id);
  const exd = exerciseById(id);
  if(!exd) return out;

  if(h.length >= 2){
    const a = avgRpeOf(h[h.length-1].sets), b = avgRpeOf(h[h.length-2].sets);
    if(a!==null && b!==null && a>=7.5 && b>=7.5)
      out.push("آخر جلستين كان هذا التمرين أقرب لـ RPE 8. لا نستعجل زيادة الوزن.");
  }
  if(h.length >= 3){
    const avgR = function(s){ const r=s.sets.map(function(x){return x.r;}).filter(function(x){return typeof x==="number";}); return r.length? r.reduce(function(x,y){return x+y;},0)/r.length : null; };
    const older = avgR(h[h.length-3]), now = avgR(h[h.length-1]);
    if(older!==null && now!==null && now - older >= 1.5)
      out.push("قبل أسبوعين كان متوسطك "+Math.round(older)+" تكرارات. الآن "+Math.round(now)+".");
    const wOld = Math.max.apply(null, h[h.length-3].sets.map(function(x){return x.w||0;}));
    const wNow = Math.max.apply(null, h[h.length-1].sets.map(function(x){return x.w||0;}));
    if(wNow > wOld) out.push("الوزن ارتفع من "+wOld+" إلى "+wNow+" كجم منذ أسبوعين.");
  }
  if(exd.rest === "flex"){
    const p = state.restPrefs[id] || [];
    if(p.length >= 3){
      const counts = {};
      p.slice(-6).forEach(function(v){ counts[v]=(counts[v]||0)+1; });
      let best=null, bc=0;
      for(const k in counts) if(counts[k]>bc){ bc=counts[k]; best=k; }
      if(bc >= 3) out.push("غالبًا ترتاحين "+best+" ثانية هنا.");
    }
  }
  return out;
}
function weekObservations(){
  const out = [];
  const done = state.sessions.length;
  if(done >= 3){
    const strength = state.sessions.filter(function(s){return s.type==="strength";});
    if(strength.length >= 3){
      const rp = strength.map(function(s){return s.avgRpe;}).filter(function(x){return typeof x==="number";});
      if(rp.length>=3){
        const last = rp.slice(-3).reduce(function(a,b){return a+b;},0)/3;
        out.push("متوسط جهدك في آخر ثلاث جلسات قوة: "+ (Math.round(last*10)/10) + " RPE.");
      }
    }
  }
  const weeksDone = [];
  for(let w=1; w<=state.currentWeek; w++) if(weekComplete(w)) weeksDone.push(w);
  if(weeksDone.length >= 2) out.push("أكملتِ "+weeksDone.length+" أسابيع كاملة حتى الآن.");
  return out;
}
/* Deload */
function weeksSinceDeload(){ return state.currentWeek - (state.deload.lastDeloadWeek || 0); }
function deloadDue(){ return weeksSinceDeload() >= 6 && !isDeload(state.currentWeek); }
function deloadUrgent(){ return weeksSinceDeload() >= 8 && !isDeload(state.currentWeek); }

/* =========================================================
   6) SARA'S CANVAS — one mark per completed day
   ========================================================= */
/* Each family day contributes a distinct mark. Seeded by week so
   every week's painting differs, but stays composed, never random. */
function canvasSVG(week, opts){
  opts = opts || {};
  const animate = !!opts.animate;
  /* 2 = both phases done (finished stroke), 1 = rehabilitation only (outline) */
  const st2 = {};
  for(let i=1;i<=6;i++) st2[i] = dayState(i, week);
  const done = {};
  for(let i=1;i<=6;i++) done[i] = st2[i]===2;
  const restDone = !!(state.reflections[week] && state.reflections[week].saved);
  const R = rng(week*7919 + 13);
  const j = function(m){ return (R()-.5)*2*m; };
  const B = "#6E2233", B2 = "#8A2E42", T = "#B4A28F", O = "#6C7358";
  let p = '';
  const A = function(sel){ return animate && done[sel] ? ' class="draw"' : ''; };
  const st = function(len){ return animate ? ' style="--len:'+len+'px;animation-delay:'+(R()*.4).toFixed(2)+'s"' : ''; };
  /* rehabilitation draws the outline; the main workout completes the stroke */
  const wOf = function(i,full){ return st2[i]===2 ? full : Math.max(1, full*0.45); };
  const oOf = function(i,full){ return st2[i]===2 ? full : "0.22"; };
  const dOf = function(i){ return st2[i]===2 ? '' : ' stroke-dasharray="5 7"'; };

  /* base paper grain: faint guide lines, always present */
  p += '<g opacity=".16" stroke="'+T+'" stroke-width="1" fill="none">';
  p += '<path d="M40 '+(300+j(10))+' C 120 '+(250+j(20))+', 280 '+(330+j(20))+', 360 '+(280+j(10))+'"/>';
  p += '<circle cx="200" cy="205" r="'+(150+j(6))+'"/>';
  p += '</g>';

  /* 1 — فاطمة / Lower A : broad curved burgundy stroke */
  if(st2[1]) p += '<path'+A(1)+st(430)+dOf(1)+' d="M52 '+(322+j(8))+' C 110 '+(232+j(14))+', 176 '+(214+j(14))+', 238 '+(268+j(12))+'" fill="none" stroke="'+B+'" stroke-width="'+wOf(1,9)+'" stroke-linecap="round" opacity="'+oOf(1,".92")+'"/>';
  /* 2 — أفراح / Upper A : fine flowing line */
  if(st2[2]) p += '<path'+A(2)+st(520)+dOf(2)+' d="M66 '+(126+j(10))+' C 138 '+(72+j(12))+', 226 '+(150+j(14))+', 300 '+(96+j(10))+' S 356 '+(140+j(10))+', 352 '+(176+j(8))+'" fill="none" stroke="'+B2+'" stroke-width="'+wOf(2,2)+'" stroke-linecap="round" opacity="'+oOf(2,".9")+'"/>';
  /* 3 — تهاني / Cardio : soft circular motion */
  if(st2[3]) p += '<circle'+A(3)+st(560)+dOf(3)+' cx="'+(268+j(8))+'" cy="'+(148+j(8))+'" r="'+(62+j(6))+'" fill="none" stroke="'+O+'" stroke-width="'+wOf(3,3)+'" opacity="'+oOf(3,".65")+'"/>';
  /* 4 — نايف / Lower B : structured element */
  if(st2[4]){
    const x = 96+j(6), y = 196+j(6);
    p += '<g'+A(4)+st(360)+dOf(4)+' stroke="'+B+'" stroke-width="'+wOf(4,2.4)+'" fill="none" opacity="'+oOf(4,".85")+'">';
    p += '<path d="M'+x+' '+y+' h96 v72 h-96 z" transform="rotate('+(-9+j(4)).toFixed(1)+' '+(x+48)+' '+(y+36)+')"/>';
    p += '<path d="M'+(x+24)+' '+(y+72)+' v-72" transform="rotate('+(-9+j(4)).toFixed(1)+' '+(x+48)+' '+(y+36)+')"/>';
    p += '</g>';
  }
  /* 5 — مالك / Upper B : balanced geometric stroke */
  if(st2[5]) p += '<path'+A(5)+st(400)+dOf(5)+' d="M132 '+(342+j(8))+' L '+(206+j(6))+' '+(228+j(8))+' L '+(282+j(6))+' '+(342+j(8))+'" fill="none" stroke="'+B2+'" stroke-width="'+wOf(5,4)+'" stroke-linecap="round" stroke-linejoin="round" opacity="'+oOf(5,".9")+'"/>';
  /* 6 — عبدالرحمن / Cardio : finishing outer curve */
  if(st2[6]) p += '<path'+A(6)+st(600)+dOf(6)+' d="M356 '+(96+j(8))+' C 392 '+(190+j(10))+', 356 '+(316+j(12))+', 246 '+(360+j(8))+'" fill="none" stroke="'+O+'" stroke-width="'+wOf(6,5)+'" stroke-linecap="round" opacity="'+oOf(6,".7")+'"/>';

  /* 7 — Sara : signature mark, only after the six are complete */
  if(weekComplete(week)){
    p += '<g'+ (animate?' class="draw"':'') + st(260) + ' stroke="'+B+'" stroke-width="2" fill="none" opacity=".95">';
    p += '<path d="M170 '+(300+j(4))+' c 16 -22, 40 -22, 46 -2 c 5 17, -18 22, -20 38 c -2 15, 20 18, 34 6"/>';
    p += '</g>';
    p += '<circle cx="'+(232+j(3))+'" cy="'+(292+j(3))+'" r="3.4" fill="'+B+'" opacity="'+(restDone?".95":".45")+'"/>';
  }
  return '<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="لوحة الأسبوع">'+p+'</svg>';
}
function canvasCount(week){ let c=0; for(let i=1;i<=6;i++) if(isDayFull(i,week)) c++; return c; }

/* =========================================================
   7) SIX + ONE CONSTELLATION
   ========================================================= */
function constellationSVG(week, opts){
  opts = opts || {};
  const w = week==null? state.currentWeek : week;
  const cx=165, cy=155, r=100;
  let s = '<svg class="constel" viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">';
  const complete = weekComplete(w);
  /* connecting ring */
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(42,37,34,.12)" stroke-width="1" stroke-dasharray="3 5"/>';
  const pts = [];
  for(let i=0;i<6;i++){
    const a = (-90 + i*60) * Math.PI/180;
    pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
  }
  /* spokes for completed days */
  for(let i=0;i<6;i++){
    if(isDayFull(i+1,w))
      s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+pts[i][0].toFixed(1)+'" y2="'+pts[i][1].toFixed(1)+'" stroke="rgba(110,34,51,.28)" stroke-width="1.2"/>';
  }
  /* center — Sara */
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(complete?30:26)+'" fill="'+(complete?"#6E2233":"#F2EAE0")+'" stroke="'+(complete?"#6E2233":"rgba(42,37,34,.16)")+'" stroke-width="1.4"/>';
  s += '<text class="node-lbl" x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" font-size="15" font-weight="600" fill="'+(complete?"#FAF6EF":"#8E7F70")+'">سارة</text>';
  /* nodes */
  for(let i=0;i<6;i++){
    const ds = dayState(i+1,w);
    const d = ds===2;
    const x = pts[i][0], y = pts[i][1];
    /* partial: rehabilitation done, main workout still open */
    s += '<circle class="node-c" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(d?13:(ds===1?11:9))+'" fill="'+(d?"#6E2233":"#FFFFFF")+'" stroke="'+(d||ds===1?"#6E2233":"rgba(42,37,34,.22)")+'" stroke-width="'+(ds===1?"1.8":"1.4")+'"'+(ds===1?' stroke-dasharray="3 3"':'')+'/>';
    if(ds===1) s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="#6E2233" opacity=".5"/>';
    const ly = y + (y<cy? -20 : 26);
    s += '<text class="node-lbl'+(d?" done":"")+'" x="'+x.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle">'+workoutProgram[i+1].family+'</text>';
  }
  s += '</svg>';
  return s;
}

function rehabFrac(){
  if(!W) return 0;
  const items = rehabOf(W.day).items;
  const total = items.reduce(function(a,i){ return a+i.sets; },0);
  let done = 0;
  items.forEach(function(i){ done += Math.min(i.sets, W.rehabLog[i.id]||0); });
  return total? done/total : 0;
}
function mainFrac(){
  if(!W) return 0;
  const d = workoutProgram[W.day];
  if(!d.exercises) return 0;
  if(W.phase==="cooldown"||W.phase==="done") return 1;
  if(W.phase==="rehab"||W.phase==="rehab-done"||W.phase==="warmup") return 0;
  const total = totalSets(W.day, W.week);
  let done = 0;
  d.exercises.forEach(function(e,i){
    if(i < W.exIdx) done += setsFor(e, W.week);
    else if(i === W.exIdx) done += W.setIdx;
  });
  return total? done/total : 0;
}

    h += '<div style="margin-top:16px"><button class="btn" data-act="start" data-day="'+day+'">'+(rDone && !mDone ? "أكملي التمرين الأساسي" : "ابدئي جلسة اليوم")+'</button></div>';

  const lastSess = state.sessions.filter(function(s){ return s.day===day; }).slice(-1)[0];
  if(lastSess){
    h += sketchRule();
    h += '<div class="sect-h"><p class="eyebrow">آخر مرة</p><span class="tiny">'+esc(fmtDate(lastSess.date))+' — الأسبوع '+nm(lastSess.week)+'</span></div>';
    h += '<div class="card-flat">';

      h += '<div class="kv"><span>مجموعات مكتملة</span><b>'+esc(lastSess.setsDone)+'</b></div>';

      if(top){
        const e0 = exerciseById(top.ex);
        h += '<div class="kv"><span>'+esc(e0?e0.ar:top.ex)+'</span><b>'+esc(top.weight)+' كجم × '+esc(top.reps)+'</b></div>';
      }
    } else if(lastSess.type==="cardio"){
      h += '<div class="kv"><span>'+esc(lastSess.machineAr||"كارديو")+'</span><b>'+esc(lastSess.minutes)+' د</b></div>';
      if(lastSess.avgRpe) h += '<div class="kv"><span>الجهد</span><b>RPE '+esc(lastSess.avgRpe)+'</b></div>';
    }
    h += '</div>';
  }

  /* canvas */
  h += sketchRule();
  h += '<div class="sect-h"><p class="eyebrow">لوحة سارة — الأسبوع '+nm(w)+'</p><span class="tiny">'+nm(canvasCount(w))+'/6</span></div>';

  h += '<p class="tiny" style="text-align:center;margin-top:8px">كل يوم مكتمل يضيف أثره إلى اللوحة.</p>';

  /* this week */
  h += sketchRule();
  h += '<div class="sect-h"><p class="eyebrow">هذا الأسبوع</p><span class="tiny">'+nm(weekDoneCount(w))+' من 6</span></div>';
  h += constellationSVG(w);
  if(weekComplete(w)){
    h += '<div class="card" style="margin-top:12px;text-align:center"><h3>الأسبوع اكتمل</h3><p class="tiny">ستة أيام بأسمائهم. واليوم لكِ.</p><button class="btn ghost sm" data-act="open-sara-day" style="margin-top:12px">يوم سارة</button></div>';
  }

  /* today's english word */
  const wordObj = pick(englishWords, seedOfDay(day)+w);
  h += sketchRule();
  h += '<p class="eyebrow">Today\u2019s Word</p>';
  h += '<div class="word"><div class="w">'+esc(wordObj.w)+'</div><div><div style="font-weight:600">'+esc(wordObj.ar)+'</div><div class="tiny en" style="direction:ltr">'+esc(wordObj.line)+'</div></div></div>';

  h += '<p class="tiny" style="margin-top:26px;text-align:center;opacity:.75">'+esc(PAIN_NOTE)+'</p>';
  $("#s-today").innerHTML = h;
}

/* -------- الأسبوع -------- */
function renderWeek(){
  const w = state.currentWeek;
  let h = '<p class="eyebrow">البرنامج الأسبوعي</p><h1>ستة أيام بأسمائهم<br><span style="color:var(--taupe-2);font-weight:500">واليوم السابع لكِ</span></h1>';
  if(isDeload(w)) h += '<div class="banner" style="margin:14px 0">وضع التخفيف مفعّل هذا الأسبوع: نفس التمارين، مجموعات أقل، وجهد مستهدف RPE 5–6.</div>';
  h += '<div style="margin-top:18px">';
  for(let i=1;i<=7;i++){
    const d = workoutProgram[i];
    const ds = i<7 ? dayState(i,w) : (isRehabDone(7,w)?2:0);
    const done = ds===2;
    const isToday = i===nextDay();
    const rDone = isRehabDone(i,w);
    const mDone = i<7 ? isDayDone(i,w) : !!(state.reflections[w] && state.reflections[w].saved);
    const rLabel = i===7 ? "تنفّس" : (rehabByDay[i]==="PT" ? "علاج طبيعي" : "تأهيل "+rehabByDay[i]);
    const mLabel = i===7 ? "راحة" : d.type;
    h += '<button class="dayrow'+(isToday?" today":"")+(i===7?" rest":"")+'" data-act="day-detail" data-day="'+i+'">';
    h += '<span class="dot'+(done?" done":"")+'"'+(ds===1?' style="background:var(--olive);border-color:var(--olive);opacity:.55"':'')+'></span>';
    h += '<span><span class="nm">'+esc(d.family)+'</span><br><span class="tp">'+en(d.type)+'</span></span>';
    h += '<span class="rt"><span class="mark2">'+(rDone?"✓":"○")+' '+esc(rLabel)+'</span><br><span class="mark2">'+(mDone?"✓":"○")+' <span class="en">'+esc(mLabel)+'</span></span></span>';

  h += '</div>';
  h += sketchRule();
  h += '<div class="card-flat"><h3>لا يتغيّر البرنامج</h3><p class="tiny">التمارين والمجموعات والتكرارات ثابتة كما وُصفت. التنويع يأتي من التتبّع والتقدّم واللوحة، لا من تغيير الحركات.</p></div>';

/* -------- سجلي -------- */
function renderHistory(){
  let h = '<p class="eyebrow">سجل التمارين</p><h1>سجلي</h1><p class="muted">كل تمرين يحتفظ بتاريخه: الأوزان، التكرارات، الجهد، والملاحظات.</p>';

      h += '<span><span style="font-weight:600">'+esc(e.ar)+'</span><br><span class="tiny en">'+esc(e.en)+'</span><br><span class="tiny">'+(last? (nm(last.sets.map(function(s){return s.r;}).join(" / "))+' · '+nm(last.sets[0].w)+' كجم') : "لا توجد بيانات بعد")+'</span></span>';
      h += '<span class="arrow">‹</span></button>';
    });
    h += '</div>';
  });
  h += '<div class="sect"><div class="sect-h"><p class="eyebrow">تهاني وعبدالرحمن — '+en("Cardio")+'</p></div>';

  if(!cs.length) h += '<div class="empty">لم تُسجَّل جلسات كارديو بعد.</div>';
  else {
    h += '<div class="card"><table class="hist"><tr><th>التاريخ</th><th>الجهاز</th><th>الدقائق</th><th>الجهد</th></tr>';
    cs.slice().reverse().slice(0,12).forEach(function(s){
      h += '<tr><td class="n">'+esc(fmtDate(s.date))+'</td><td>'+esc(s.machineAr||"")+'</td><td class="n">'+esc(s.minutes)+'</td><td class="n">'+(s.avgRpe? "RPE "+s.avgRpe : "—")+'</td></tr>';

/* -------- سارة -------- */
function renderSara(){
  const w = state.currentWeek;
  const strength = state.sessions.filter(function(s){return s.type==="strength";});
  const cardio = state.sessions.filter(function(s){return s.type==="cardio";});
  const allSets = strength.reduce(function(a,s){return a+(s.setsDone||0);},0);
  const minutes = state.sessions.reduce(function(a,s){return a+(s.minutes||0);},0);
  const rpes = state.sessions.map(function(s){return s.avgRpe;}).filter(function(x){return typeof x==="number";});
  const avgRpe = rpes.length? Math.round((rpes.reduce(function(a,b){return a+b;},0)/rpes.length)*10)/10 : null;
  let weeksDone=0; for(let i=1;i<=w;i++) if(weekComplete(i)) weeksDone++;

  let h = '<p class="eyebrow">'+en("Sara Alshugairan")+'</p><h1>سارة</h1>';
  h += '<p class="muted">رحلة تدريب واحدة، تُبنى أسبوعًا بعد أسبوع.</p>';

  h += '<div class="sect"><div class="sect-h"><p class="eyebrow">التزامي</p></div><div class="stat-grid">';
  h += '<div class="stat"><b>'+weeksDone+'</b><span>أسابيع كاملة</span></div>';
  h += '<div class="stat"><b>'+strength.length+'</b><span>جلسات قوة</span></div>';
  h += '<div class="stat"><b>'+cardio.length+'</b><span>جلسات كارديو</span></div>';
  h += '<div class="stat"><b>'+allSets+'</b><span>مجموعات عمل</span></div>';
  h += '</div></div>';

  h += '<div class="sect"><div class="sect-h"><p class="eyebrow">جهدي</p></div><div class="card">';
  h += '<div class="kv"><span>متوسط الجهد</span><b>'+(avgRpe? "RPE "+avgRpe : "—")+'</b></div>';
  h += '<div class="kv"><span>دقائق التدريب</span><b>'+minutes+'</b></div>';
  h += '<div class="kv"><span>الأسبوع الحالي</span><b>'+w+(isDeload(w)?" — تخفيف":"")+'</b></div>';
  h += '</div>';
  const obs = weekObservations();
  if(obs.length) h += '<div class="banner" style="margin-top:12px">'+obs.map(esc).join('<br>')+'</div>';
  h += '</div>';

  /* deload */
  h += '<div class="sect"><div class="sect-h"><p class="eyebrow">أسبوع التخفيف</p></div><div class="card">';
  h += '<p class="tiny" style="margin-top:0">البرنامج ينصّ على تخفيف كل 6–8 أسابيع تقريبًا. مرّ '+weeksSinceDeload()+' أسبوع منذ آخر تخفيف.</p>';
  if(isDeload(w)){
    h += '<div class="banner" style="margin-bottom:12px">هذا الأسبوع في وضع التخفيف.</div>';
    h += '<button class="btn quiet sm" data-act="deload-cancel">إلغاء وضع التخفيف لهذا الأسبوع</button>';
  } else {
    h += '<button class="btn '+(deloadDue()?"":"quiet")+' sm" data-act="deload-open">بدء أسبوع التخفيف</button>';
  }
  h += '</div></div>';

  /* journey */
  h += '<div class="sect"><div class="sect-h"><p class="eyebrow">رحلتي</p></div><div class="card">';
  if(!state.sessions.length) h += '<p class="tiny" style="margin:0">تبدأ الرحلة مع أول جلسة مسجّلة.</p>';
  else{
    for(let i=1;i<=w;i++){
      const c = canvasCount(i);
      h += '<div class="kv"><span>الأسبوع '+i+(isDeload(i)?' <span class="tiny">(تخفيف)</span>':'')+'</span><b>'+c+'/6</b></div>';
    }
  }
  h += '</div>';
  if(weekComplete(w)) h += '<button class="btn ghost sm" data-act="new-week" style="margin-top:12px">ابدئي الأسبوع '+(w+1)+'</button>';
  h += '</div>';

  /* settings */
  h += '<div class="sect"><div class="sect-h"><p class="eyebrow">الإعدادات</p></div><div class="card">';
  h += '<p class="tiny" style="margin:0 0 8px">الراحة الافتراضية للتمارين ذات 60–90 ثانية</p><div class="chips">';
  REST_FLEX.options.forEach(function(o){ h += '<button class="chip'+(state.settings.flexRest===o?" on":"")+'" data-act="set-flexrest" data-v="'+o+'">'+o+' ث</button>'; });
  h += '</div>';
  h += '<p class="tiny" style="margin:16px 0 8px">مدة الكارديو الافتراضية</p><div class="chips">';
  [15,20].forEach(function(o){ h += '<button class="chip'+(state.settings.cardioMinutes===o?" on":"")+'" data-act="set-cardiomin" data-v="'+o+'">'+o+' دقيقة</button>'; });
  h += '</div>';
  h += '<p class="tiny" style="margin:16px 0 8px">جهاز الكارديو المفضّل</p><div class="chips">';
  cardioMachines.forEach(function(m){ h += '<button class="chip'+(state.settings.cardioMachine===m.id?" on":"")+'" data-act="set-machine" data-v="'+m.id+'">'+esc(m.ar)+'</button>'; });
  h += '</div>';
  h += '</div></div>';

  /* backup */
  h += '<div class="sect"><div class="sect-h"><p class="eyebrow">النسخ الاحتياطي</p></div><div class="card">';
  h += '<p class="tiny" style="margin:0 0 8px">كل شيء محفوظ على جهازك فقط. لا يوجد اتصال بأي خادم.</p>';
  h += '<div class="kv"><span>حالة التخزين</span><b style="direction:rtl;font-size:13px">'+esc(storageLabel())+'</b></div>';
  if(state.savedAt) h += '<div class="kv"><span>آخر حفظ</span><b style="direction:rtl;font-size:13px">'+esc(new Date(state.savedAt).toLocaleString("ar"))+'</b></div>';
  if(storageMode()==="none"){
    h += '<div class="banner" style="margin:12px 0">المتصفح لا يسمح بالحفظ عند فتح الملف مباشرة من الملفات. الحل: افتحي التطبيق من رابط ويب وأضيفيه إلى الشاشة الرئيسية، أو صدّري ملف تدريبك بعد كل جلسة واستوردية عند الفتح.</div>';
  }
  h += '<div style="height:4px"></div>';
  h += '<button class="btn quiet sm" data-act="storage-test">اختبار الحفظ</button>';
  h += '<button class="btn quiet sm" data-act="export" style="margin-top:9px">تصدير تدريبي (JSON)</button>';
  h += '<button class="btn quiet sm" data-act="import" style="margin-top:9px">استيراد تدريبي</button>';
  h += '<button class="btn quiet sm" data-act="reset" style="margin-top:9px;color:var(--burgundy)">إعادة ضبط الرحلة</button>';
  h += '</div></div>';

  h += '<p class="tiny" style="margin-top:24px;text-align:center;opacity:.7">'+nm(saraProfile.age)+' سنة · '+nm(saraProfile.heightCm)+' سم · '+nm(saraProfile.weightKg)+' كجم<br>القياسات هنا للسياق فقط. المقياس الحقيقي هو التحكّم والانتظام.</p>';
  h += '<p class="tiny" style="margin-top:18px;text-align:center">'+esc(PAIN_NOTE)+'</p>';
  $("#s-sara").innerHTML = h;
}

/* =========================================================
   9) OVERLAY SHELL
   ========================================================= */
let ovMode = null;
function openOv(mode, headHTML, bodyHTML){
  ovMode = mode;
  $("#ov-head").innerHTML = headHTML;
  $("#ov-body").innerHTML = bodyHTML;
  $("#ov").classList.add("on");
  $("#ov").scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function closeOv(){
  $("#ov").classList.remove("on");
  document.body.style.overflow = "";
  ovMode = null;
  render();
}
function ovHead(title, sub, prog){
  let h = '<button class="x" data-act="ov-close">✕</button><div style="flex:1"><div class="ov-title">'+title+'</div>'+(sub?'<div class="ov-sub">'+sub+'</div>':'')+
          (prog!=null?'<div class="prog-bar"><i style="width:'+Math.round(prog*100)+'%"></i></div>':'')+'</div>';
  return h;
}

/* -------- day detail (from week screen) -------- */
function openDayDetail(day){
  const d = workoutProgram[day];
  const w = state.currentWeek;
  const done = isDayDone(day,w);
  let b = '';
  b += '<p class="eyebrow">يوم '+esc(d.family)+'</p><h1 style="color:var(--burgundy)">'+en(d.type)+'</h1><p class="muted">'+esc(d.typeAr)+'</p>';
  if(isDayFull(day,w)) b += '<div class="banner olive" style="margin:14px 0">اليوم مكتمل: التأهيل والتمرين الأساسي.</div>';
  else if(isRehabDone(day,w)) b += '<div class="rehab-panel" style="margin:14px 0">التأهيل انتهى — التمرين الأساسي باقي.</div>';
  b += journeyCard(day, w);
  /* PHASE 1 — rehabilitation */
  (function(){
    const r = rehabOf(day);
    b += '<div class="sect"><div class="sect-h"><p class="eyebrow">المرحلة الأولى — التأهيل</p><span class="tiny">'+esc(rehabByDay[day]==="PT"? r.titleAr : r.title)+'</span></div>';
    b += '<div class="rehab-panel" style="margin-bottom:10px"><b>قاعدة التأهيل</b><br>'+esc(REHAB_RULE_T)+'<br><span class="tiny">'+esc(REHAB_RULE_S)+'</span></div>';
    r.items.forEach(function(it,i){
      b += '<button class="hrow" data-act="rehab-tech" data-day="'+day+'" data-i="'+i+'">';
      b += '<span><span style="font-weight:600" class="en">'+esc(it.en)+'</span><br><span class="tiny">'+(it.sets>1? esc(it.sets+" × "+it.reps)+' — '+esc(it.repsLabel) : esc(it.repsLabel))+'</span></span>';
      b += '<span class="arrow">‹</span></button>';
    });
    b += '<p class="tiny">التأهيل مقرّر كما هو، بدون أوزان أو زيادة تدريجية.</p></div>';
  })();
  if(d.kind==="strength"){
    if(d.lower) b += '<div class="banner" style="margin:14px 0">'+esc(LOWER_RULE)+'</div>';
    b += '<div class="sect"><div class="sect-h"><p class="eyebrow">المرحلة الثانية — الإحماء (جولة واحدة)</p></div><div class="card-flat">';
    d.warmup.forEach(function(x){ b += '<div class="kv"><span>'+esc(x.ar)+'</span><b class="en" style="font-weight:400;font-size:12px;color:var(--taupe-2)">'+esc(x.en)+'</b></div>'; });
    b += '</div></div>';
    b += '<div class="sect"><div class="sect-h"><p class="eyebrow">المرحلة الثانية — '+en(d.type)+'</p><span class="tiny">'+nm(totalSets(day,w))+' مجموعة</span></div>';
    d.exercises.forEach(function(e,i){
      b += '<button class="hrow" data-act="ex-detail" data-ex="'+e.id+'"><span style="min-width:22px;color:var(--taupe);font-size:13px" class="num">'+(i+1)+'</span>';
      b += '<span><span style="font-weight:600">'+esc(e.ar)+'</span><br><span class="tiny en">'+esc(e.en)+'</span><br><span class="tiny">'+nm(setsFor(e,w))+' مجموعات · '+nm(e.lo+"–"+e.hi)+' تكرار · راحة '+restLabel(e)+'</span></span><span class="arrow">‹</span></button>';
    });
    b += '</div>';
    b += '<div class="sect"><div class="sect-h"><p class="eyebrow">التهدئة</p></div><div class="card-flat">';
    cooldown.forEach(function(x){ b += '<div class="kv"><span>'+esc(x.ar)+'</span></div>'; });
    b += '<p class="tiny" style="margin-top:10px">'+esc(cooldownNote)+'</p></div></div>';
    b += '<button class="btn" data-act="start" data-day="'+day+'" style="margin-top:20px">'+(isRehabDone(day,w)? (done?"إعادة التمرين الأساسي":"ابدئي التمرين الأساسي") : "ابدئي جلسة اليوم")+'</button>';
  } else if(d.kind==="cardio"){
    b += '<div class="card-flat" style="margin-top:14px"><h3>المرحلة الثانية — كارديو منخفض التأثير</h3><p class="tiny">الدراجة الثابتة أو الأوربتراك. مدة 15–20 دقيقة بشدّة معتدلة يمكن الاستمرار عليها. بدون جري أو قفز أو فترات عالية الشدّة.</p></div>';
    b += '<button class="btn" data-act="start" data-day="'+day+'" style="margin-top:20px">'+(isRehabDone(day,w)? (done?"إعادة الكارديو":"ابدئي الكارديو") : "ابدئي جلسة اليوم")+'</button>';
  } else {
    b += '<div class="card-flat" style="margin-top:14px"><h3>راحة تامة</h3><p class="tiny">لا تمرين، ولا مشي مطوّل، ولا نشاط بديل. اليوم للاستشفاء والمراجعة.</p></div>';
    b += '<button class="btn ghost" data-act="open-sara-day" style="margin-top:20px">افتحي يوم سارة</button>';

/* -------- exercise detail -------- */

function progressChart(hist, e){
  const pts = hist.map(function(s){
    const r = s.sets.map(function(x){return x.r;}).filter(function(x){return typeof x==="number";});
    const wgt = Math.max.apply(null, s.sets.map(function(x){return x.w||0;}));
    return { week:s.week, reps: r.length? r.reduce(function(a,b){return a+b;},0)/r.length : 0, w:wgt };
  });
  if(pts.length<2) return '<p class="tiny" style="margin:0">يظهر منحنى التقدّم بعد جلستين.</p>';
  const W=300,H=120,pad=22;
  const maxR = Math.max(e.hi, Math.max.apply(null,pts.map(function(p){return p.reps;})));
  const minR = Math.min(e.lo, Math.min.apply(null,pts.map(function(p){return p.reps;})));
  const sx = function(i){ return pad + i*((W-pad*2)/(pts.length-1)); };
  const sy = function(v){ const t=(v-minR)/((maxR-minR)||1); return H-pad - t*(H-pad*2); };
  let path = pts.map(function(p,i){ return (i?"L":"M")+sx(i).toFixed(1)+" "+sy(p.reps).toFixed(1); }).join(" ");
  let s = '<p class="tiny" style="margin:0 0 6px">متوسط التكرارات لكل جلسة</p>';
  s += '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  s += '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="rgba(42,37,34,.12)"/>';
  s += '<path d="'+path+'" fill="none" stroke="#6E2233" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){
    s += '<circle cx="'+sx(i).toFixed(1)+'" cy="'+sy(p.reps).toFixed(1)+'" r="3.4" fill="#6E2233"/>';
    s += '<text x="'+sx(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="#8E7F70">'+p.week+'</text>';
  });
  s += '</svg>';
  return s;
}

/* =========================================================
   10) WORKOUT MODE
   ========================================================= */
let W = null;
function buildW(day, w, phase, hadRehab){
  const d = workoutProgram[day];
  const obj = {
    day: day, week: w, deload: isDeload(w),
    phase: phase, exIdx: 0, setIdx: 0,
    rehabIdx: 0, rehabLog: {}, hadRehabPhase: !!hadRehab,
    warmDone: [], coolDone: [],
    entries: [], startTs: Date.now(),
    draft: {}
  };
  if(d.exercises) d.exercises.forEach(function(e){
    const last = lastPerf(e.id);
    obj.draft[e.id] = {
      weight: last && last.sets.length ? (last.sets[last.sets.length-1].w || 0) : 0,
      reps: last && last.sets.length ? (last.sets[0].r || e.lo) : e.lo,
      rpe: null
    };
  });
  return obj;
}
function openWorkoutOverlay(){
  renderWorkout();
  $("#ov").classList.add("on");
  ovMode = "workout";
  document.body.style.overflow = "hidden";
}
function startSession(day){
  const d = workoutProgram[day];
  if(d.kind==="rest"){ openSaraDay(); return; }
  const w = state.currentWeek;
  /* PHASE 1 — rehabilitation, unless it is already done today */
  if(!isRehabDone(day,w)){
    W = buildW(day, w, "rehab", true);
    openWorkoutOverlay();
    return;
  }
  /* PHASE 2 — the existing main workout, unchanged */
  if(d.kind==="cardio"){ startCardio(day); return; }
  W = buildW(day, w, "warmup", false);
  openWorkoutOverlay();
}
/* rehabilitation finished → elegant handover to the main workout */
function continueToMain(){
  if(!W) return;
  const d = workoutProgram[W.day];
  if(d.kind==="cardio"){
    const day = W.day; W = null;
    startCardio(day);
    return;
  }
  W.phase = "warmup";
  W.startTs = Date.now();
  renderWorkout();
}
function rehabSetDone(){
  if(!W) return;
  const items = rehabOf(W.day).items;
  const it = items[W.rehabIdx];
  const n = (W.rehabLog[it.id]||0) + 1;
  W.rehabLog[it.id] = n;
  if(n >= it.sets){
    if(W.rehabIdx < items.length-1) W.rehabIdx++;
    else {
      recordRehab(W.day, W.week, rehabByDay[W.day]);
      W.phase = "rehab-done";
    }
  }
  renderWorkout();
}
function workoutProgress(){
  if(!W) return 0;
  const d = workoutProgram[W.day];
  const R0 = W.hadRehabPhase ? 0.35 : 0;
  if(W.phase==="rehab") return 0.02 + rehabFrac()*(R0-0.02);
  if(W.phase==="rehab-done") return R0;
  if(!d.exercises) return R0;
  if(W.phase==="warmup") return R0 + 0.02;
  if(W.phase==="cooldown"||W.phase==="done") return 1;
  const total = totalSets(W.day, W.week);
  let done = 0;
  d.exercises.forEach(function(e,i){
    if(i < W.exIdx) done += setsFor(e, W.week);
    else if(i === W.exIdx) done += W.setIdx;
  });
  return Math.min(.99, R0 + (total? done/total : 0)*(1-R0));
}

function bindInputs(){
  if(!W || W.phase!=="exercise") return;
  const d = workoutProgram[W.day];
  if(!d.exercises) return;
  const wI = $("#in-weight"), rI = $("#in-reps");
  if(!wI || !rI) return;
  const e = d.exercises[W.exIdx];
  wI.addEventListener("input", function(){ W.draft[e.id].weight = wI.value.replace(/[^\d.]/g,""); });
  rI.addEventListener("input", function(){ W.draft[e.id].reps = rI.value.replace(/[^\d]/g,""); });
}
function stepField(f, delta){
  if(!W) return;
  const e = workoutProgram[W.day].exercises[W.exIdx];
  const el = $(f==="weight"? "#in-weight":"#in-reps");
  let v = parseFloat(el.value); if(isNaN(v)) v = 0;
  v = Math.max(0, Math.round((v+delta)*100)/100);
  el.value = v;
  W.draft[e.id][f] = v;
}
function completeSet(){
  if(!W) return;
  const d = workoutProgram[W.day];
  const e = d.exercises[W.exIdx];
  const nSets = setsFor(e, W.week);
  const dr = W.draft[e.id];
  const weight = parseFloat(dr.weight)||0;
  const reps = parseInt(dr.reps,10)||0;
  if(reps<=0){ toast("سجّلي عدد التكرارات أولًا"); return; }
  W.entries.push({ ex:e.id, set:W.setIdx+1, weight:weight, reps:reps, rpe:null });
  const wasLast = (W.setIdx === nSets-1);
  const lastEx = (W.exIdx === d.exercises.length-1);
  if(wasLast){
    W.phase = "rpe";
    renderWorkout();
  } else {
    W.setIdx++;
    renderWorkout();
    startRest(restSeconds(e), e, "المجموعة "+(W.setIdx+1)+" من "+nSets+" — "+e.ar);
  }
  save();
}
function applyRPE(v){
  if(!W) return;
  const d = workoutProgram[W.day];
  const e = d.exercises[W.exIdx];
  const mine = W.entries.filter(function(x){ return x.ex===e.id; });
  if(mine.length) mine[mine.length-1].rpe = v;
  if(v>=9){ toast("سجّلناها. المرة القادمة نخفف قليلًا."); }
  const lastEx = (W.exIdx === d.exercises.length-1);
  if(lastEx){
    W.phase = "cooldown";
    renderWorkout();
  } else {

/* =========================================================
   11) REST TIMER
   ========================================================= */
let R = { t:null, left:0, total:0, paused:false, ex:null };
function startRest(sec, exercise, nextLabel){
  R.total = sec; R.left = sec; R.paused = false; R.ex = exercise;
  $("#rest-next").textContent = nextLabel || "";
  renderRestQuick();
  $("#rest").classList.add("on");
  $("#rest-toggle").textContent = "إيقاف مؤقت";
  tickRest();
  clearInterval(R.t);
  R.t = setInterval(function(){
    if(R.paused) return;
    R.left--;
    if(R.left<=0){ endRest(true); return; }
    tickRest();
  },1000);
}
function renderRestQuick(){
  const q = $("#rest-quick");
  if(R.ex && R.ex.rest==="flex"){
    q.innerHTML = REST_FLEX.options.map(function(o){
      return '<button data-act="rest-set" data-v="'+o+'" class="'+(R.total===o?"on":"")+'">'+o+' ث</button>';
    }).join("");
    q.style.display = "flex";
  } else { q.innerHTML=""; q.style.display="none"; }
}
function tickRest(){
  $("#rest-clock").textContent = mmss(R.left);
  const c = 2*Math.PI*104;
  const frac = R.total? (R.left/R.total) : 0;
  const ring = $("#ring");
  ring.setAttribute("stroke-dasharray", c);
  ring.setAttribute("stroke-dashoffset", (c*(1-frac)).toFixed(1));
}
function endRest(natural){
  clearInterval(R.t); R.t=null;
  $("#rest").classList.remove("on");
  if(R.ex && R.ex.rest==="flex"){
    if(!state.restPrefs[R.ex.id]) state.restPrefs[R.ex.id]=[];
    state.restPrefs[R.ex.id].push(R.total);
    if(state.restPrefs[R.ex.id].length>20) state.restPrefs[R.ex.id] = state.restPrefs[R.ex.id].slice(-20);
    save();
  }
  R.ex = null;
}
function setRest(sec){
  R.total = sec; R.left = sec; R.paused=false;
  state.settings.flexRest = sec; save();
  renderRestQuick(); tickRest();
}

function openSaraDay(){
  const w = state.currentWeek;
  const ss = sessionsOfWeek(w);
  const strength = ss.filter(function(s){return s.type==="strength";});
  const cardio = ss.filter(function(s){return s.type==="cardio";});
  const sets = strength.reduce(function(a,s){return a+(s.setsDone||0);},0);
  const mins = ss.reduce(function(a,s){return a+(s.minutes||0);},0);
  const rp = ss.map(function(s){return s.avgRpe;}).filter(function(x){return typeof x==="number";});
  const avg = rp.length? Math.round((rp.reduce(function(a,b){return a+b;},0)/rp.length)*10)/10 : null;
  const ref = state.reflections[w] || {};

  /* improved exercises: top set reps up vs previous week */
  let improved = 0;
  [1,2,4,5].forEach(function(di){
    workoutProgram[di].exercises.forEach(function(e){
      const h = historyOf(e.id);
      if(h.length>=2){
        const a = h[h.length-1], b2 = h[h.length-2];
        const ar = a.sets.reduce(function(x,y){return x+(y.r||0);},0);
        const br = b2.sets.reduce(function(x,y){return x+(y.r||0);},0);
        const aw = Math.max.apply(null,a.sets.map(function(x){return x.w||0;}));
        const bw = Math.max.apply(null,b2.sets.map(function(x){return x.w||0;}));

      }

  if(!breathDone) b += '<button class="btn sm" data-act="breath-done" style="margin-top:12px">✓ تم تمرين التنفس</button>';
  b += '</div></div>';
  b += '<div class="banner olive" style="margin-top:14px">بعد التنفس: راحة تامة. لا تمرين، ولا مشي مطوّل، ولا نشاط بديل. الراحة جزء من البرنامج، وليست توقفًا عنه.</div>';
  b += '<div style="margin-top:18px">'+constellationSVG(w)+'</div>';
  b += '<div class="sect"><div class="sect-h"><p class="eyebrow">أسبوع سارة — الأسبوع '+nm(w)+'</p></div><div class="stat-grid">';
  b += '<div class="stat"><b>'+strength.length+'</b><span>جلسات قوة</span></div>';
  b += '<div class="stat"><b>'+cardio.length+'</b><span>جلسات كارديو</span></div>';
  b += '<div class="stat"><b>'+sets+'</b><span>مجموعات عمل</span></div>';
  b += '<div class="stat"><b>'+mins+'</b><span>دقيقة تدريب</span></div>';
  b += '<div class="stat"><b>'+(avg||"—")+'</b><span>متوسط RPE</span></div>';

}
function cancelDeload(){
  const w = state.currentWeek;
  state.deload.weeks = state.deload.weeks.filter(function(x){ return x!==w; });
  if(state.deload.lastDeloadWeek===w) state.deload.lastDeloadWeek = 0;
  saveNow(); render(); toast("أُلغي وضع التخفيف");
}
function newWeek(){
  modal('<h3>الأسبوع '+(state.currentWeek+1)+'</h3><p class="tiny">تبدأ لوحة جديدة، وتُحفظ لوحة الأسبوع '+state.currentWeek+' في الأرشيف. كل السجل السابق يبقى كما هو.</p><div class="acts"><button class="btn sm" data-act="new-week-yes">ابدئي الأسبوع الجديد</button><button class="btn quiet sm" data-act="modal-close">ليس الآن</button></div>');
}

/* =========================================================
   15) BACKUP
   ========================================================= */
function exportData(){
  const data = JSON.stringify({ app:"sara-training", exportedAt:new Date().toISOString(), state:state }, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "sara-training-"+todayISO()+".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 300);
  toast("تم تجهيز ملف التصدير");
}
function importData(file){
  const r = new FileReader();
  r.onload = function(){
    try{
      const parsed = JSON.parse(r.result);
      const s = parsed.state || parsed;
      if(!s || typeof s!=="object" || !("sessions" in s)) throw new Error("bad");
      const merged = defaultState();
      for(const k in merged) if(k in s) merged[k] = s[k];
      merged.settings = Object.assign(defaultState().settings, s.settings||{});
      merged.deload = Object.assign(defaultState().deload, s.deload||{});
      if(!("rehabSessions" in s) || !Array.isArray(s.rehabSessions)){
        merged.rehabSessions = merged.sessions.map(function(x){
          return { week:x.week, day:x.day, kind:(rehabByDay[x.day]||"PT"), date:x.date, legacy:true };
        });
      }
      state = merged;
      saveNow().then(function(){ render(); toast("تم استيراد بياناتك"); });
    }catch(e){ toast("الملف غير صالح"); }
  };
  r.readAsText(file);
}
function resetJourney(){
  modal('<h3>إعادة ضبط الرحلة</h3><p class="tiny">سيُحذف كل شيء: الجلسات، الأوزان، الملاحظات، اللوحات، والتأملات. لا يمكن التراجع.</p><p class="tiny">يُنصح بتصدير نسخة أولًا.</p><div class="acts"><button class="btn quiet sm" data-act="export">تصدير أولًا</button><button class="btn sm" data-act="reset-confirm" style="background:var(--burgundy)">نعم، احذفي كل شيء</button><button class="btn quiet sm" data-act="modal-close">إلغاء</button></div>');
}
function doReset(){
  modal('<h3>تأكيد أخير</h3><p class="tiny">اكتبي كلمة <b>حذف</b> للتأكيد.</p><input class="note-in" id="reset-word" style="min-height:auto;text-align:center" ><div class="acts"><button class="btn sm" data-act="reset-final">تأكيد الحذف</button><button class="btn quiet sm" data-act="modal-close">إلغاء</button></div>');
}
function resetFinal(){
  const v = ($("#reset-word")||{value:""}).value.trim();
  if(v!=="حذف"){ toast("اكتبي كلمة: حذف"); return; }
  const ob = state.onboarded;
  state = defaultState();
  state.onboarded = ob;
  state.startedAt = todayISO();
  saveNow().then(function(){ closeModal(); go("today"); toast("بدأت رحلة جديدة"); });
}

/* =========================================================
   16) FIRST OPEN
   ========================================================= */
let onbIdx = 0;
function buildOnboarding(){
  const s = $$("#onb .onb-s");
  s[0].innerHTML =
    '<svg viewBox="0 0 300 150" style="width:100%;max-width:300px"><path class="draw" style="--len:420px" d="M30 118 C 70 40, 140 26, 190 62 C 232 92, 254 66, 272 44" fill="none" stroke="#6E2233" stroke-width="6" stroke-linecap="round"/></svg>'+
    '<h2 style="margin-top:18px;font-size:40px;color:var(--burgundy)">سارة</h2>'+
    '<button class="btn ghost sm" data-act="onb-next" style="margin-top:34px">التالي</button>';
  s[1].innerHTML =
    '<svg viewBox="0 0 260 260" style="width:100%;max-width:250px">'+
      '<circle cx="130" cy="130" r="92" fill="none" stroke="rgba(42,37,34,.14)" stroke-width="1" stroke-dasharray="3 5"/>'+
      [0,1,2,3,4,5].map(function(i){ const a=(-90+i*60)*Math.PI/180; return '<circle cx="'+(130+92*Math.cos(a)).toFixed(1)+'" cy="'+(130+92*Math.sin(a)).toFixed(1)+'" r="7" fill="#fff" stroke="#6E2233" stroke-width="1.6"/>'; }).join("")+
      '<circle cx="130" cy="130" r="20" fill="#F2EAE0" stroke="rgba(42,37,34,.18)"/>'+
    '</svg>'+
    '<button class="btn ghost sm" data-act="onb-next" style="margin-top:34px">التالي</button>';
  s[2].innerHTML =
    '<h2 style="font-size:30px;line-height:1.7">قوتك.<br>وقتك.<br>برنامجك.</h2>'+
    '<p class="tiny" style="margin-top:14px">البرنامج كما هو. التجربة حوله صارت لكِ.</p>'+
    '<button class="btn ghost sm" data-act="onb-next" style="margin-top:34px">التالي</button>';
  s[3].innerHTML =
    '<p class="eyebrow">أيام أسبوعك</p>'+
    '<h2 style="font-size:22px;line-height:2;color:var(--burgundy)">فاطمة • أفراح • تهاني<br>نايف • مالك • عبدالرحمن</h2>'+
    '<p style="margin-top:16px;font-size:17px">ستة أيام بأسمائهم. واليوم السابع لكِ.</p>'+
    '<button class="btn" data-act="onb-start" style="margin-top:30px">نبدأ</button>';
}
function onbGo(i){
  onbIdx = i;
  $$("#onb .onb-s").forEach(function(el,k){ el.classList.toggle("on", k===i); });
  $$("#onb .onb-dots i").forEach(function(el,k){ el.classList.toggle("on", k===i); });
}
function finishOnboarding(){
  state.onboarded = true;
  state.startedAt = todayISO();
  saveNow();
  $("#onb").classList.remove("on");
  $("#nav").classList.add("on");
  go("today");
}

/* =========================================================
   17) EVENTS
   ========================================================= */
document.addEventListener("click", function(ev){
  const navBtn = ev.target.closest("#nav button[data-nav]");
  if(navBtn){ go(navBtn.getAttribute("data-nav")); return; }
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const a = el.getAttribute("data-act");
  const v = el.getAttribute("data-v");
  const day = parseInt(el.getAttribute("data-day"),10);
  const exId = el.getAttribute("data-ex");

  switch(a){
    case "onb-next": onbGo(Math.min(3,onbIdx+1)); break;
    case "onb-start": finishOnboarding(); break;

    case "ov-close":
      if(ovMode==="workout") exitWorkout();
      else if(ovMode==="cardio" && C && C.phase==="run"){
        modal('<h3>إنهاء الكارديو؟</h3><div class="acts"><button class="btn sm" data-act="cardio-finish">إنهاء وتسجيل</button><button class="btn quiet sm" data-act="cardio-exit">خروج بدون حفظ</button><button class="btn quiet sm" data-act="modal-close">متابعة</button></div>');
      }
      else { if(C&&C.t) clearInterval(C.t); C=null; W=null; closeOv(); }
      break;

    case "start": startSession(day); break;
    case "day-detail": openDayDetail(day); break;
    case "ex-detail": openExDetail(exId); break;
    case "ex-info": {
      const e = exerciseById(exId);
      modal('<h3>'+esc(e.ar)+'</h3><p class="tiny en" style="direction:ltr">'+esc(e.en)+'</p><div class="card-flat" style="margin-top:10px"><h3>مفتاح التنفيذ</h3><p class="tiny" style="margin:0">'+esc(e.cue)+'</p><h3 style="margin-top:12px">خطأ يجب تجنّبه</h3><p class="tiny" style="margin:0">'+esc(e.mistake)+'</p></div><div class="acts"><button class="btn quiet sm" data-act="modal-close">إغلاق</button></div>');
      break; }
    case "rpe-info":
      modal('<h3>مقياس الجهد RPE</h3>'+rpeInfo.map(function(r){ return '<div class="kv"><span><b>RPE '+r.v+'</b> — '+esc(r.t)+'</span></div>'; }).join("")+
        '<p class="tiny" style="margin-top:10px">في تمارين الجزء السفلي لا نصل إلى الفشل العضلي. نتوقف ونحن قادرات على تكرار أو تكرارين إضافيين.</p>'+
        '<div class="acts"><button class="btn quiet sm" data-act="modal-close">فهمت</button></div>');
      break;

    case "rehab-set": rehabSetDone(); break;
    case "rehab-continue": continueToMain(); break;
    case "rehab-tech": {
      const day = el.hasAttribute("data-day") ? parseInt(el.getAttribute("data-day"),10) : (W? W.day : 1);
      const it = rehabOf(day).items[parseInt(el.getAttribute("data-i"),10)];
      modal('<h3 class="en" style="direction:ltr;text-align:start">'+esc(it.en)+'</h3>'+
        (it.sets>1? '<p class="tiny">'+esc(it.sets+" × "+it.reps)+' — '+esc(it.repsLabel)+'</p>' : '<p class="tiny">'+esc(it.repsLabel)+'</p>')+
        '<div class="rehab-panel" style="margin-top:10px">'+it.tech.map(function(t){ return '• '+esc(t); }).join("<br>")+'</div>'+
        '<p class="tiny" style="margin-top:10px">'+esc(REHAB_RULE_T)+' '+esc(REHAB_RULE_S)+'</p>'+
        '<div class="acts"><button class="btn quiet sm" data-act="modal-close">إغلاق</button></div>');
      break; }
    case "breath-tech":
      modal('<h3 class="en" style="direction:ltr;text-align:start">Diaphragmatic Breathing</h3>'+
        '<div class="rehab-panel" style="margin-top:10px">'+breathingTechnique.map(function(t){ return '• '+esc(t); }).join("<br>")+'</div>'+
        '<p class="tiny" style="margin-top:10px">'+breathingNotes.map(esc).join("<br>")+'</p>'+
        '<div class="acts"><button class="btn quiet sm" data-act="modal-close">إغلاق</button></div>');
      break;
    case "breath-done":
      recordRehab(7, state.currentWeek, "BREATH");
      toast("تم تسجيل تمرين التنفس");
      openSaraDay();
      break;
    case "warm-toggle": {
      const i = parseInt(el.getAttribute("data-i"),10);
      const k = W.warmDone.indexOf(i);
      if(k===-1) W.warmDone.push(i); else W.warmDone.splice(k,1);
      renderWorkout(); break; }
    case "warm-done": W.phase="exercise"; renderWorkout(); break;
    case "cool-toggle": {
      const i = parseInt(el.getAttribute("data-i"),10);
      const k = W.coolDone.indexOf(i);
      if(k===-1) W.coolDone.push(i); else W.coolDone.splice(k,1);
      renderWorkout(); break; }
    case "step": stepField(el.getAttribute("data-f"), parseFloat(el.getAttribute("data-d"))); break;
    case "set-done": completeSet(); break;
    case "rpe": applyRPE(parseInt(v,10)); break;
    case "finish": finishSession(); break;
    case "save-exit": closeModal(); finishSession(); break;
    case "discard-exit": closeModal(); W=null; closeOv(); break;

    case "rest-toggle": R.paused=!R.paused; $("#rest-toggle").textContent = R.paused? "متابعة":"إيقاف مؤقت"; break;
    case "rest-skip": endRest(false); break;
    case "rest-add": R.left+=15; R.total=Math.max(R.total,R.left); tickRest(); break;
    case "rest-set": setRest(parseInt(v,10)); break;

    case "cardio-machine": C.machine=v; renderCardio(); break;
    case "cardio-min": C.minutes=parseInt(v,10); renderCardio(); break;
    case "cardio-start": cardioStart(); break;
    case "cardio-toggle": C.paused=!C.paused; renderCardio(); break;
    case "cardio-talk": C.talk=v; renderCardio(); break;
    case "cardio-finish": closeModal(); cardioFinish(); break;
    case "cardio-exit": closeModal(); if(C&&C.t) clearInterval(C.t); C=null; closeOv(); break;
    case "cardio-rpe": cardioSave(parseInt(v,10)); break;

    case "open-sara-day": closeModal(); openSaraDay(); break;
    case "ref-save": saveReflection(); break;

    case "note-open": openNote(exId); break;
    case "note-save": saveNote(exId); break;
    case "modal-close": closeModal(); break;

    case "deload-open": openDeload(); break;
    case "deload-start": startDeload(); break;
    case "deload-later": state.deload.postponed=true; save(); closeModal(); toast("أجّلنا التخفيف. نذكّرك لاحقًا."); render(); break;
    case "deload-cancel": cancelDeload(); break;

    case "new-week": newWeek(); break;
    case "new-week-yes":
      state.currentWeek++; saveNow(); closeModal();
      if(ovMode) closeOv();
      go("today"); toast("بدأ الأسبوع "+state.currentWeek);
      break;

    case "set-flexrest": state.settings.flexRest=parseInt(v,10); save(); render(); break;
    case "set-cardiomin": state.settings.cardioMinutes=parseInt(v,10); save(); render(); break;
    case "set-machine": state.settings.cardioMachine=v; save(); render(); break;

    case "storage-test": storageTest(); break;
    case "export": exportData(); break;
    case "import": $("#file-in").click(); break;
    case "reset": resetJourney(); break;
    case "reset-confirm": doReset(); break;
    case "reset-final": resetFinal(); break;
  }
});
$("#file-in").addEventListener("change", function(e){
  const f = e.target.files && e.target.files[0];
  if(f) importData(f);
  e.target.value = "";
});
$("#modal").addEventListener("click", function(e){ if(e.target.id==="modal") closeModal(); });

/* =========================================================
   18) INIT
   ========================================================= */
(function init(){
  buildOnboarding();
  /* ask the browser to keep this data (supported browsers only) */
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  /* probe localStorage without touching saved data */
  try{ localStorage.setItem("__sara_probe__","1"); localStorage.removeItem("__sara_probe__"); _lsOK = true; }catch(e){ _lsOK = false; }

  openDB().then(dbGet).then(function(fromDB){
    const fromLS = lsGet();
    let saved = null;
    if(fromDB && fromLS) saved = ((fromDB.savedAt||0) >= (fromLS.savedAt||0)) ? fromDB : fromLS;
    else saved = fromDB || fromLS;

    if(saved && typeof saved==="object"){
      const merged = defaultState();
      for(const k in merged) if(k in saved) merged[k] = saved[k];
      merged.settings = Object.assign(defaultState().settings, saved.settings||{});
      merged.deload = Object.assign(defaultState().deload, saved.deload||{});
      state = merged;
      /* migration: days finished before the rehabilitation phase existed stay complete */
      if(!("rehabSessions" in saved) || !Array.isArray(saved.rehabSessions)){
        state.rehabSessions = state.sessions.map(function(x){
          return { week:x.week, day:x.day, kind:(rehabByDay[x.day]||"PT"), date:x.date, legacy:true };
        });
      }
      persistAll(); /* bring both stores back in sync */
    }
    if(!state.onboarded){
      $("#onb").classList.add("on");
      onbGo(0);
    } else {
      $("#nav").classList.add("on");
      go("today");
    }
    if(storageMode()==="none"){
      setTimeout(function(){ toast("المتصفح يمنع الحفظ هنا — راجعي «سارة ← النسخ الاحتياطي»"); }, 1200);
    }
  });

  /* write immediately when the page is hidden or closed */
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") flushSave(); });
  window.addEventListener("pagehide", flushSave);
  window.addEventListener("beforeunload", flushSave);
})();
</script>

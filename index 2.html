    const sess = PROG.ORDER.map(k => {
      const plan = PROG.buildStrength(k, S.levels, w);
      return `<article class="plan-sess"><h3 dir="ltr">${plan.title}</h3><p>${Math.round(PROG.planSeconds(plan) / 60)} دقيقة — ${PROG.SESSIONS[k].day}</p>
        <ul>${plan.items.map(it => { const e = LIB.byId[it.id]; return `<li><button class="linkish" data-act="exInfo" data-v="${e.id}" dir="ltr">${esc(e.en)}</button><small>${setsAr(it.sets, e.uni)}</small></li>`; }).join('')}</ul>
        <button class="btn btn-ghost" data-act="preview" data-v="${k}">معاينة وبدء</button></article>`;
    }).join('');
    const fams = PROG.TRAINABLE.map(f => {
      const cur = PROG.exerciseFor(f, S.levels, w);
      return `<details class="fam"><summary><span>${PROG.FAMS[f].ar}</span><span dir="ltr">${esc(cur.en)}</span></summary>
        <ol>${LIB.fam(f).map(e => `<li class="${e.id === cur.id ? 'is-cur' : ''}"><button class="linkish" data-act="exInfo" data-v="${e.id}"><span dir="ltr">L${e.lvl} ${esc(e.en)}</span> <small>${esc(e.ar)}</small></button>${e.minWeek && e.minWeek > 1 ? `<small class="gate">من الأسبوع ${e.minWeek}</small>` : ''}</li>`).join('')}</ol></details>`;
    }).join('');
    $('#tab-plan').innerHTML = `
      <header class="page-head"><p class="kicker">8 أسابيع</p><h1>الخطة</h1></header>
      <section class="block"><h2>المراحل</h2><ol class="phases">${phases}</ol></section>
      <section class="block"><h2>أسبوعك المعتاد</h2><ul class="week-tmpl">${tmpl}</ul>
        <p class="muted">فاتك يوم؟ الرئيسية تعرض الجلسة التالية اللي ما سويتها، وتنصحك بيوم راحة بين جلسات القوة.</p></section>
      <section class="block"><h2>جلسات هذا الأسبوع</h2><p class="muted">العمل ${P.work} ثانية للمجموعة. ${esc(P.rir)}.</p><div class="plan-grid">${sess}</div></section>
      <section class="block"><h2>مستويات التمارين</h2><p class="muted">التطبيق ينقلك للمستوى التالي لما تقييمك بعد الجلسات يدل على الجاهزية. المستويات الصعبة مقفلة حتى أسبوعها.</p>${fams}</section>
      <section class="block basics"><h2>أساسيات العضل</h2>
        <p>العضلة الظاهرة تعتمد على شيئين: <b>حجم العضلة</b> و<b>نسبة الدهون</b>. بطولك ووزنك ما تحتاج تنزيل كبير في الوزن؛ التركيز على البناء.</p>
        <ul class="plain">
          <li><b>البروتين:</b> الأبحاث تدعم حوالي 1.6 جم لكل كجم يوميًا (تقريبًا 130 جم لوزن 80 كجم)، موزعة على 3–4 وجبات.</li>
          <li><b>السعرات:</b> لا تسوي تنشيف قاسي. أكل كافي — أو فائض بسيط — يساعد البناء.</li>
          <li><b>النوم:</b> 7–9 ساعات. الاستشفاء جزء من التمرين.</li>
          <li><b>الماء:</b> اشرب بانتظام، خصوصًا مع الحر والمشي.</li>
          <li><b>الاستمرار:</b> 3 جلسات أسبوعيًا لمدة 8 أسابيع أهم من أي جلسة بطولية.</li></ul>
        <p class="muted">هذه أساسيات عامة وليست خطة غذائية طبية.</p></section>
      <section class="block note"><h2>عن السحب والظهر</h2><p>بدون أدوات، السحب هو أصعب شيء نطوره. استخدمنا أفضل البدائل الآمنة (رفعات الظهر وتمارين المنشفة الثابتة). على المدى الطويل، عقلة باب مثبتة جيدًا أو حبل مقاومة يوسّع خيارات الظهر والباي كثير — لكن ما تحتاجها لتبدأ.</p></section>`;
  },

  /* ================= JOZ ================= */
  r_joz() {
    const w = weekNum();
    const plan = PROG.buildJoz(w);
    const n = weekEntries(w).filter(e => e.type === 'joz').length;
    const done = S.log.some(e => e.type === 'joz' && e.dateKey === todayKey());
    $('#tab-joz').innerHTML = `
      <header class="page-head joz-head"><p class="kicker">قاع الحوض، التنفس، التحكم بالحوض</p><h1>تمارين الجوز</h1>
        <p class="joz-tag">جلسة هادئة، بدون مبالغات وبدون وعود.</p></header>
      <article class="session session-primary">
        <div class="session-head"><span class="session-letter">ج</span><div><h3>جلسة اليوم</h3><p>${Math.round(PROG.planSeconds(plan) / 60)} دقائق تقريبًا — هذا الأسبوع: ${n} / 3–4</p>${done ? '<p class="areas">تمت اليوم ✓</p>' : ''}</div></div>
        <ol class="ex-list">${plan.items.map(it => { const e = LIB.byId[it.id]; return `<li><span>${esc(e.ar)}</span><small dir="ltr">${esc(e.en)}</small></li>`; }).join('')}</ol>
        <button class="btn btn-primary btn-start" data-act="startJoz">ابدأ</button>
      </article>
      <section class="block"><h2>كيف تعرف العضلة؟</h2>
        <p>تخيل أنك تريد إيقاف خروج الغازات، وارفع عضلات قاع الحوض للداخل وللأعلى بلطف. الألوية والبطن والفخذ تبقى مرتخية، والتنفس طبيعي.</p>
        <p class="note">لا تستخدم إيقاف البول في منتصفه كتمرين. ممكن تجربها مرة واحدة للتعرف على الإحساس فقط؛ تكرارها قد يخرّب عادة التفريغ الطبيعي.</p>
        <p>الارتخاء الكامل بعد كل شدة مهم بنفس درجة الشد. الكمية المعقولة كافية — لا تسوي مئات الشدات يوميًا.</p></section>
      <section class="block evidence"><h2>وش يقول العلم؟</h2>
        <dl>
          <div><dt>دليل مباشر أقوى</dt><dd>التمارين الهوائية المنتظمة (المشي السريع مثلًا) ارتبطت بتحسن الانتصاب، خصوصًا عند الرجال اللي عندهم صعوبات. لهذا المشي موجود في أسبوعك.</dd></div>
          <div><dt>دليل داعم، غير محسوم</dt><dd>تدريب عضلات قاع الحوض أظهر فائدة في بعض التجارب لضعف الانتصاب وسرعة القذف، لكن الدراسات صغيرة ونتائجها متفاوتة.</dd></div>
          <div><dt>تهيئة عامة</dt><dd>الجسر، الطائر والكلب، التنفس، ومرونة الحوض تدعم التحكم بالحوض واللياقة العامة. ما فيه دليل إنها بحد ذاتها تحسن الأداء الجنسي.</dd></div>
        </dl>
        <p class="muted">ما نعد بحجم، ولا انتصاب مضمون، ولا تحمّل مضمون. وإذا فيه مشكلة مستمرة، الطبيب هو الخطوة الصح — أحيانًا تكون إشارة مبكرة لصحة القلب والأوعية.</p></section>
      <section class="block"><h2>التوقيت</h2><p>3–4 مرات أسبوعيًا، والأنسب في أيام المشي (الأحد، الثلاثاء، الخميس). الوضعية تتقدم مع الأسابيع: استلقاء ← جلوس ← وقوف.</p></section>`;
  },

  /* ================= LOG ================= */
  r_log() {
    const w = weekNum();
    const total = S.log.length, str = S.log.filter(e => e.type === 'strength').length;
    const mins = Math.round(S.log.reduce((s, e) => s + (e.durSec || 0), 0) / 60);
    let streak = 0; for (let k = w - 1; k >= 1; k--) { if (doneKeys(k).size >= 3) streak++; else break; }
    if (doneKeys(w).size >= 3) streak++;
    const weeks = []; for (let k = w; k >= 1; k--) weeks.push(k);
    const lv = PROG.TRAINABLE.map(f => { const e = PROG.exerciseFor(f, S.levels, w); return `<li><span>${PROG.FAMS[f].ar}</span><span dir="ltr">L${e.lvl} ${esc(e.en)}</span></li>`; }).join('');
    $('#tab-log').innerHTML = `
      <header class="page-head"><p class="kicker">بيانات حقيقية من جلساتك فقط</p><h1>سجلي</h1></header>
      <dl class="stats"><div><dt>جلسات القوة</dt><dd>${str}</dd></div><div><dt>كل الجلسات</dt><dd>${total}</dd></div><div><dt>وقت التمرين</dt><dd>${mins}<small> د</small></dd></div><div><dt>أسابيع مكتملة متتالية</dt><dd>${streak}</dd></div></dl>
      <section class="block"><h2>المستوى الحالي</h2><ul class="lvl-list">${lv}</ul></section>
      <section class="block"><h2>الأسابيع</h2>${weeks.map(k => this.weekReport(k, false)).join('')}</section>`;
  },

    $('#tab-settings').innerHTML = `

        <label class="switch"><input type="checkbox" data-act="setVoice" ${S.settings.voice ? 'checked' : ''}><span>الصوت المنطوق ${Voice.supported() ? '' : '(غير مدعوم في هذا المتصفح)'}</span></label>
        <button class="btn btn-ghost" data-act="testSound">جرّب الصوت</button>
        <p class="muted">في الآيفون: إذا زر الصامت شغال، أصوات المتصفح ممكن ما تطلع. خلّ الجوال على الوضع العادي وقت التمرين.</p></section>
      <section class="block"><h2>الزواج</h2>

        <div class="row"><button class="btn btn-secondary" data-act="saveWedding">حفظ التاريخ</button>${S.settings.wedding ? '<button class="btn btn-ghost" data-act="clearWedding">إخفاء العداد</button>' : ''}</div></section>
      <section class="block"><h2>البرنامج</h2>
        <p>بدأ البرنامج: ${esc(S.profile.startDate || '—')} — الأسبوع الحالي: ${w}</p>
        <div class="row"><button class="btn btn-ghost" data-act="repeatWeek">كرّر هذا الأسبوع</button><button class="btn btn-ghost" data-act="recal">أعد فحص البداية</button></div>
        <p class="muted">"كرّر هذا الأسبوع" يؤخر البرنامج أسبوعًا — مفيد بعد سفر أو مرض.</p></section>
      <section class="block"><h2>ملفات الفيديو</h2>
        <p>كل تمرين له عرض متحرك مدمج. إذا أضفت فيديو حقيقي بالاسم المطلوب داخل <code dir="ltr">assets/videos/</code>، يظهر بدل العرض المتحرك تلقائيًا.</p>
        <button class="btn btn-ghost" data-act="checkVideos">افحص الملفات</button>
        <ul class="vid-list" id="vidList">${vids.map(e => `<li data-vid="${e.id}"><code dir="ltr">${esc(LIB.videoManifest[e.id])}</code><span class="vs">${VID.ok[e.id] === true ? 'موجود' : VID.ok[e.id] === false ? 'غير موجود — يظهر العرض المتحرك' : '—'}</span></li>`).join('')}</ul></section>
      <section class="block"><h2>النسخة الاحتياطية</h2>
        <div class="row"><button class="btn btn-secondary" data-act="export">تصدير نسخة احتياطية</button><label class="btn btn-ghost file-btn">استيراد نسخة<input type="file" accept="application/json,.json" id="importFile" data-act="importPick"></label></div>
        <p class="muted">التخزين: ${DB.mode === 'idb' ? 'IndexedDB' : DB.mode === 'ls' ? 'localStorage (احتياطي)' : 'مؤقت — لن يُحفظ'}</p></section>
      <section class="block"><h2>السلامة</h2><p>أوقف التمرين فورًا إذا حسيت بألم في الصدر، دوخة شديدة، ضيق نفس غير طبيعي، أو ألم حاد مفاجئ. إذا تكرر أي من ذلك، راجع طبيب قبل ما تكمل.</p></section>
      <section class="block"><h2>لماذا تنجح هذه الخطة</h2>
        <ul class="plain">
          <li><b>الحجم:</b> العلاقة بين عدد المجموعات الأسبوعية والتضخيم واضحة؛ نوصل تدريجيًا لحوالي 10 مجموعات أسبوعيًا للعضلة الكبيرة.</li>
          <li><b>التكرار:</b> تدريب العضلة مرتين أو أكثر أسبوعيًا يوزّع الحجم بشكل أفضل — لهذا 3 جلسات للجسم كامل.</li>
          <li><b>الوزن الخفيف يكفي:</b> التضخيم يحصل بأوزان خفيفة إذا المجموعة قريبة من الجهد؛ والضغط حقق تضخيمًا مقاربًا للبنش برس في دراسات مقارنة.</li>
          <li><b>بدون فشل كامل:</b> الاقتراب من الفشل (1–3 تكرار احتياط) يعطي نتائج مقاربة بتعب أقل.</li>
          <li><b>الراحة:</b> 60–120 ثانية تحافظ على جودة المجموعات.</li>
          <li><b>الثابت (Isometric):</b> الشد الثابت القوي يبني عضلًا، لكنه أضعف من الحركة الكاملة بالأوزان — لذلك وضعناه كبديل للسحب فقط.</li></ul>
        <details><summary>المراجع</summary><ol class="refs">
          <li>American College of Sports Medicine. Progression models in resistance training for healthy adults. Med Sci Sports Exerc. 2009;41(3):687–708.</li>
          <li>Schoenfeld BJ, Ogborn D, Krieger JW. Dose-response relationship between weekly resistance training volume and increases in muscle mass: a systematic review and meta-analysis. J Sports Sci. 2017;35(11):1073–1082.</li>
          <li>Schoenfeld BJ, Ogborn D, Krieger JW. Effects of resistance training frequency on measures of muscle hypertrophy: a systematic review and meta-analysis. Sports Med. 2016;46(11):1689–1697.</li>
          <li>Refalo MC, Helms ER, Trexler ET, Hamilton DL, Fyfe JJ. Influence of resistance training proximity-to-failure on skeletal muscle hypertrophy: a systematic review with meta-analysis. Sports Med. 2023;53(3):649–665.</li>

          <li>Calatayud J, Borreani S, Colado JC, et al. Bench press and push-up at comparable levels of muscle activity results in similar strength gains. J Strength Cond Res. 2015;29(1):246–253.</li>
          <li>Oranchuk DJ, Storey AG, Nelson AR, Cronin JB. Isometric training and long-term adaptations: effects of muscle length, intensity, and intent: a systematic review. Scand J Med Sci Sports. 2019;29(4):484–503.</li>
          <li>Morton RW, Murphy KT, McKellar SR, et al. A systematic review, meta-analysis and meta-regression of the effect of protein supplementation on resistance training-induced gains in muscle mass and strength in healthy adults. Br J Sports Med. 2018;52(6):376–384.</li>
          <li>Gerbild H, Larsen CM, Graugaard C, Areskoug Josefsson K. Physical activity to improve erectile function: a systematic review of intervention studies. Sex Med. 2018;6(2):75–89.</li>
          <li>Silva AB, Sousa N, Azevedo LF, Martins C. Physical activity and exercise for erectile dysfunction: systematic review and meta-analysis. Br J Sports Med. 2017;51(19):1419–1424.</li>
          <li>Dorey G, Speakman M, Feneley R, Swinkels A, Dunn C, Ewings P. Randomised controlled trial of pelvic floor muscle exercises and manometric biofeedback for erectile dysfunction. Br J Gen Pract. 2004;54(508):819–825.</li>
          <li>Myers C, Smith M. Pelvic floor muscle training improves erectile dysfunction and premature ejaculation: a systematic review. Physiotherapy. 2019;105(2):235–243.</li>
        </ol></details></section>
      <section class="block danger"><h2>إعادة الضبط</h2><p>يمسح كل البيانات من هذا الجهاز. صدّر نسخة احتياطية قبلها إذا تبغى.</p><button class="btn btn-danger" data-act="reset">امسح كل البيانات</button></section>
      <p class="muted center">صُمم لمالك.</p>`;
  },

  /* ================= PREVIEW ================= */
  openPreview(key) {
    const w = weekNum();
    const plan = key === 'J' ? PROG.buildJoz(w) : PROG.buildStrength(key, S.levels, w);
    VID.probeMany(plan.items.map(i => i.id));
    const P = PROG.weekParams(w);
    this.modal(`<h2 dir="auto">${esc(plan.title)}</h2>
      <p class="muted">${Math.round(PROG.planSeconds(plan) / 60)} دقيقة تقريبًا — الأسبوع ${w} — ${key === 'J' ? 'يشتغل لحاله' : esc(P.rir)}</p>
      <ol class="prev-list">${plan.items.map((it, i) => { const e = LIB.byId[it.id]; return `<li><div class="thumb" data-thumb="${e.id}"></div><div><p class="pl-en" dir="ltr">${esc(e.en)}</p><p class="pl-ar">${esc(e.ar)}</p><p class="pl-meta">${it.sets ? `${setsAr(it.sets, e.uni)} — ` : ''}${esc(e.target)}</p></div></li>`; }).join('')}</ol>
      <div class="sound-row"><button class="chip" data-act="toggleSound" aria-pressed="${S.settings.sound}">${S.settings.sound ? 'التنبيهات الصوتية: تعمل' : 'التنبيهات الصوتية: مطفأة'}</button>
      <button class="chip" data-act="toggleVoice" aria-pressed="${S.settings.voice}">${S.settings.voice ? 'الصوت المنطوق: يعمل' : 'الصوت المنطوق: مطفأ'}</button></div>
      <p class="muted">${Wake.supported() ? 'الشاشة تبقى مضاءة أثناء التمرين.' : 'متصفحك ما يدعم إبقاء الشاشة مضاءة — خلّ قفل الشاشة التلقائي على "أبدًا" وقت التمرين.'}</p>
      <p class="safety">أوقف فورًا إذا حسيت بألم صدر، دوخة شديدة، ضيق نفس غير طبيعي، أو ألم حاد.</p>
      <button class="btn btn-primary btn-start" data-act="${key === 'J' ? 'startJoz' : 'startStrength'}" data-v="${key}">${key === 'J' ? 'ابدأ' : 'ابدأ التمرين'}</button>
      <button class="btn btn-ghost" data-act="closeModal">رجوع</button>`, { kind: 'preview' });
    $$('#modal [data-thumb]').forEach(el => { const p = new FIG.Player(el); p.load(LIB.byId[el.dataset.thumb]); cancelAnimationFrame(p.raf); p.renderAt(0.9); });
  },

  exInfo(id) {
    const e = LIB.byId[id];
    this.modal(`<div class="demo-box" id="exDemo"></div>
      <h2 dir="ltr" class="ex-en">${esc(e.en)}</h2><p class="ex-ar">${esc(e.ar)}</p>
      ${e.setup ? `<p><b>التجهيز:</b> ${esc(e.setup)}</p>` : ''}
      <ul class="cues">${e.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      <p><b>الهدف:</b> ${esc(e.target)}</p>
      ${e.m.p.length ? `<p class="muted">يركز على: ${e.m.p.map(m => MUSCLE_AR[m]).join('، ')}</p>` : ''}
      <p class="muted">الفيديو: <code dir="ltr">${esc(LIB.videoManifest[id])}</code></p>
      <button class="btn btn-ghost" data-act="closeModal">إغلاق</button>`, { kind: 'ex' });

  },

  /* ================= WORKOUT SCREEN ================= */
  openWorkout(plan) {
    this.closeModal();
    const w = $('#workout'); w.hidden = false; w.dataset.paused = '0';
    document.body.classList.add('wo-open');
    $('#woTitle').textContent = plan.title;
    $('#woPausedLayer').hidden = true;
  },
  closeWorkout() {
    $('#workout').hidden = true; document.body.classList.remove('wo-open');
    if (!$('#shell').hidden || S.profile.onboarded) this.showShell();
  },

  woStep(st, E) {
    const w = $('#workout');
    w.dataset.phase = st.k === 'work' && st.warm ? 'warm' : st.k;
    const showId = st.k === 'rest' ? st.ex : st.ex;
    const ex = LIB.byId[showId];
    const nxt = st.k === 'rest' ? LIB.byId[st.nextEx] : null;
    const phaseAr = { prep: 'استعد', work: st.warm ? 'إحماء' : 'الآن', rest: 'راحة', switch: 'بدّل الجهة', trans: st.setup ? 'جهّز المكان' : 'التالي' }[st.k];
    $('#woPhase').textContent = phaseAr;
    let setTxt = '';
    if (st.k === 'work' && st.sets && !st.warm) setTxt = `المجموعة ${st.set} / ${st.sets}${st.side ? ` — الجهة ${st.side === 1 ? 'الأولى' : 'الثانية'}` : ''}`;
    else if (st.k === 'switch') setTxt = 'الجهة الثانية';
    else if (st.k === 'rest') setTxt = 'التالي: ' + nxt.en;
    $('#woSet').textContent = setTxt;
    if (st.k === 'rest') {
      $('#woName').textContent = 'REST';
      $('#woNameAr').textContent = '';
    } else { $('#woName').textContent = ex.en; $('#woNameAr').textContent = ex.ar; }
    let target = '';
    if (st.k === 'work' && !st.warm) {
      target = ex.mode === 'hold' ? 'ثبات بجودة — وقف قبل ما ينهار الشكل' : ex.target;
      if (st.rir && ex.mode === 'reps') target += `\n${st.rir}`;
    } else if (st.k === 'work' && st.warm) target = ex.target;
    else if (st.note) target = st.note;
    else if (st.k === 'prep') target = ex.setup || '';
    $('#woTarget').textContent = target;
    // next line
    let nextTxt = '';
    if (st.k === 'rest') nextTxt = `المجموعة ${st.nextSet} / ${st.nextSets}`;
    else { const n = E.nextWork(); if (n && n.ex !== st.ex) nextTxt = 'بعده: ' + LIB.byId[n.ex].en; else if (!n) nextTxt = 'آخر تمرين'; }
    $('#woNext').textContent = nextTxt;
    // cues
    $('#woCues').innerHTML = (st.k === 'rest' ? [] : ex.cues).map(c => `<li>${esc(c)}</li>`).join('');
    $('#woCycle').hidden = true;
    $('#woMediaTag').textContent = st.k === 'rest' ? '' : (st.k === 'work' ? '' : 'شاهد الحركة');
    // media
    const drive = st.k === 'work' && ex.mode === 'cycle' && ex.anim.drive ? () => (E.cycOn ? 1 : 0) : null;
    E.slot.show(showId, drive);
    $('#woMedia').classList.toggle('is-dim', st.k === 'rest');
    this.woTime(st, E);
  },
  woPreviewNext(st, E) {
    const nx = LIB.byId[st.nextEx];
    E.slot.show(st.nextEx, null);
    $('#woMedia').classList.remove('is-dim');
    $('#woMediaTag').textContent = 'جاي: ' + nx.en;
    $('#woCues').innerHTML = nx.cues.map(c => `<li>${esc(c)}</li>`).join('');
    window.__cues.push('preview:' + st.nextEx);
  },
  woTime(st, E) {
    $('#woTimer').textContent = fmt(E.rem / 1000);
    const before = E.plan.steps.slice(0, E.i).reduce((s, x) => s + x.dur, 0);
    const done = before + (st.dur - E.rem / 1000);
    $('#woBar').style.width = Math.min(100, (done / E.total) * 100).toFixed(2) + '%';
    $('#woLeft').textContent = 'المتبقي ' + fmt(E.total - done);
  },
  woCycle(ex, cs) {
    const el = $('#woCycle'); el.hidden = false;
    const lbl = cs.on ? ex.cycle.onAr : ex.cycle.offAr;
    el.dataset.on = cs.on ? '1' : '0';
    el.textContent = lbl ? `${lbl} ${Math.ceil(cs.left)}` : (cs.on ? '●' : '○');
  },
  woPaused(p, reason) {
    $('#woPausedLayer').hidden = !p; $('#workout').dataset.paused = p ? '1' : '0';
    $('#woPausedWhy').textContent = reason === 'hidden' ? 'توقف التمرين لأنك طلعت من الصفحة. كل شيء محفوظ.' : 'التمرين متوقف مؤقتًا.';
  },
  confirmStop() {
    if (!WO.paused) WO.pause('user');
    this.modal(`<h2>تنهي التمرين؟</h2><p>ينحفظ اللي سويته إذا تمرنت أكثر من دقيقتين.</p>
      <button class="btn btn-danger" data-act="stopYes">إنهاء التمرين</button><button class="btn btn-ghost" data-act="closeModal">رجوع</button>`, { kind: 'confirm' });
  },

  /* ================= POST ================= */
  post: null,
  openPost(result) {
    this.closeModal();
    $('#workout').hidden = true; document.body.classList.remove('wo-open');
    this.post = { result, difficulty: null, completion: null, easyFams: [], hardFams: [] };
    const plan = result.plan, isStr = plan.type === 'strength';
    const fams = isStr ? plan.items.map(i => i.fam) : [];
    const p = $('#post'); p.hidden = false;
    p.innerHTML = `<div class="post-inner">
      <p class="kicker">${result.completed ? 'انتهت الجلسة' : 'انتهت الجلسة مبكرًا'} — ${Math.round(result.elapsed / 60)} دقيقة</p>
      <h1>كيف كان التمرين؟</h1>
      <div class="opts opts-4">${[['easy', 'سهل'], ['ok', 'مناسب'], ['hard', 'صعب'], ['vhard', 'صعب جدًا']].map(([v, l]) => `<button class="btn btn-opt" data-act="fbDiff" data-v="${v}">${l}</button>`).join('')}</div>
      ${isStr ? `<h2>هل أكملت أغلب المجموعات بالشكل المطلوب؟</h2>
      <div class="opts">${[['yes', 'نعم'], ['mostly', 'غالبًا'], ['no', 'لا']].map(([v, l]) => `<button class="btn btn-opt" data-act="fbComp" data-v="${v}">${l}</button>`).join('')}</div>
      <details class="fb-more"><summary>تفصيل اختياري لكل تمرين</summary>
        <p class="muted">كان سهل بزيادة:</p><div class="chips">${fams.map(f => `<button class="chip" data-act="fbEasy" data-v="${f}" aria-pressed="false" dir="ltr">${esc(PROG.exerciseFor(f, S.levels, weekNum()).en)}</button>`).join('')}</div>
        <p class="muted">كان صعب جدًا أو أزعج مفصل:</p><div class="chips">${fams.map(f => `<button class="chip" data-act="fbHard" data-v="${f}" aria-pressed="false" dir="ltr">${esc(PROG.exerciseFor(f, S.levels, weekNum()).en)}</button>`).join('')}</div>
      </details>` : ''}
      <button class="btn btn-primary" data-act="fbSave" id="fbSave" disabled>حفظ</button></div>`;
  },

  savePost() {
    const { result, difficulty, completion, easyFams, hardFams } = this.post;
    const plan = result.plan, w = plan.week || weekNum();
    let changes = [];
    if (plan.type === 'strength') {
      changes = PROG.applyFeedback(S.levels, plan, { difficulty, completion: completion || 'yes', easyFams, hardFams }, w);
      save('levels');
    }
    const mus = musclesOf(plan);
    const entry = { id: Date.now(), type: plan.type, key: plan.key, title: plan.title, dateKey: todayKey(), ts: Date.now(), week: weekNum(),
      durSec: result.elapsed, ratio: Math.round(result.ratio * 100) / 100, difficulty, completion, changes, exercises: plan.items.map(i => i.id), muscles: mus };
    S.log.push(entry); save('log');
    this.openSummary(entry);
  },

  openSummary(entry) {
    const p = $('#post');
    const ch = entry.changes || [];
    const next = PROG.ORDER.find(k => !doneKeys(weekNum()).has(k));
    p.innerHTML = `<div class="post-inner">
      <p class="kicker">${esc(entry.title)}</p><h1>تم.</h1>
      <dl class="report-grid"><div><dt>المدة</dt><dd>${Math.round(entry.durSec / 60)} <small>دقيقة</small></dd></div><div><dt>المنجز</dt><dd>${Math.round((entry.ratio ?? 1) * 100)}%</dd></div></dl>
      <h2>العضلات المستهدفة</h2>${muscleMap(entry.muscles.p, entry.muscles.s)}
      ${ch.length ? `<h2>تغيير المستوى</h2><ul class="changes">${ch.map(c => { const a = LIB.fam(c.fam).find(x => x.lvl === c.from), b = LIB.fam(c.fam).find(x => x.lvl === c.to); return `<li>${esc(PROG.FAMS[c.fam].ar)}: <span dir="ltr">${esc(a.en)} → ${esc(b.en)}</span></li>`; }).join('')}</ul>` : ''}
      <p>${entry.type === 'strength' ? (next ? `الجلسة الجاية: Full Body ${next} — بعد يوم راحة.` : 'خلصت جلسات القوة لهالأسبوع.') : 'ممتاز. الاستمرار أهم من الكمية.'}</p>
      <button class="btn btn-primary" data-act="postDone">رجوع للرئيسية</button></div>`;
  },

  /* ================= CARDIO ================= */
  cardio: null,
  openCardio() {
    const ct = PROG.cardioTarget(weekNum());
    const c = $('#cardio'); c.hidden = false; document.body.classList.add('wo-open');
    c.innerHTML = `<div class="post-inner"><p class="kicker">مشي سريع</p><h1>كم دقيقة؟</h1>
      <p>هذه المرحلة: ${ct.min}–${ct.max} دقيقة. سرعة تقدر تتكلم فيها لكن ما تقدر تغني.</p>
      <div class="opts opts-4">${[20, 25, 30, 40].map(m => `<button class="btn btn-opt ${m >= ct.min && m <= ct.max ? 'is-rec' : ''}" data-act="cardioGo" data-v="${m}">${m} د</button>`).join('')}</div>
      <button class="btn btn-ghost" data-act="cardioClose">رجوع</button></div>`;
  },
  cardioStart(min) {
    Sound.init(); Voice.init(); Wake.on();
    this.cardio = { min, start: Date.now(), half: false, iv: null };
    const c = $('#cardio');
    c.innerHTML = `<div class="cardio-run"><p class="kicker">مشي سريع — ${min} دقيقة</p><p class="cardio-timer" id="cdT">${fmt(min * 60)}</p>
      <p class="muted">يكمل العد حتى لو قفلت الشاشة ورجعت.</p>
      <button class="btn btn-primary" data-act="cardioStop">إنهاء وحفظ</button></div>`;
    Voice.say('يلا نمشي', 'Let\'s walk');
    this.cardio.iv = setInterval(() => {
      const el = (Date.now() - this.cardio.start) / 1000 * SPEED, left = min * 60 - el;
      const t = $('#cdT'); if (t) t.textContent = fmt(left);
      if (!this.cardio.half && el >= min * 30) { this.cardio.half = true; Sound.cue('half'); Voice.say('نص الوقت', 'Halfway'); }
      if (left <= 0) this.cardioEnd(true);
    }, 250);
  },
  cardioEnd(full) {
    const c = this.cardio; if (!c) return;
    clearInterval(c.iv); Wake.off();
    const sec = Math.min(c.min * 60, Math.round((Date.now() - c.start) / 1000 * SPEED));
    this.cardio = null;
    if (full) { Sound.cue('done'); Voice.say('خلصت المشي', 'Walk complete'); }
    if (sec >= 300) this.logCardio(sec); else this.closeCardio();
  },
  logCardio(sec) {
    S.log.push({ id: Date.now(), type: 'cardio', key: null, title: 'مشي سريع', dateKey: todayKey(), ts: Date.now(), week: weekNum(), durSec: sec, ratio: 1, exercises: [], muscles: { p: [], s: [] } });
    save('log');
    const c = $('#cardio'); c.hidden = false;
    c.innerHTML = `<div class="post-inner"><h1>تم.</h1><p>${Math.round(sec / 60)} دقيقة مشي انحفظت.</p><button class="btn btn-primary" data-act="cardioClose">رجوع</button></div>`;
  },
  closeCardio() { $('#cardio').hidden = true; document.body.classList.remove('wo-open'); this.refresh(); },

  /* ================= actions ================= */
  acts: {
    go(v) { this.closeModal(); this.go(v); },
    ob(v) { this.openOnboard(Number(v)); },
    obWedding() { const v = $('#obWedding').value; S.settings.wedding = v || null; save('settings'); this.openOnboard(2); },
    calStart() { this.calib = {}; this.calIdx = 0; this.calNext(); },
    calSkip() { S.levels = PROG.defaultLevels(); save('levels'); this.acts.journey.call(this); },
    calAns(v) { this.calib[this.CALQ[this.calIdx].id] = v; this.calIdx++; this.calNext(); },
    journey() {
      S.profile.onboarded = true; if (!S.profile.startDate) S.profile.startDate = todayKey(); save('profile');
      this.calSlot && this.calSlot.clear(); this.tab = 'today'; this.showShell();
    },
    closeModal() { this.closeModal(); if (WO.plan && WO.paused) { /* stay paused */ } },
    preview(v) { this.openPreview(v); },
    exInfo(v) { this.exInfo(v); },
    startStrength(v) { const plan = PROG.buildStrength(v, S.levels, weekNum()); WO.begin(plan); },
    startJoz() { const plan = PROG.buildJoz(weekNum()); WO.begin(plan); },
    toggleSound(v, t) { S.settings.sound = !S.settings.sound; save('settings'); t.setAttribute('aria-pressed', S.settings.sound); t.textContent = S.settings.sound ? 'التنبيهات الصوتية: تعمل' : 'التنبيهات الصوتية: مطفأة'; },
    toggleVoice(v, t) { S.settings.voice = !S.settings.voice; save('settings'); t.setAttribute('aria-pressed', S.settings.voice); t.textContent = S.settings.voice ? 'الصوت المنطوق: يعمل' : 'الصوت المنطوق: مطفأ'; },
    setSound(v, t) { S.settings.sound = t.checked; save('settings'); },
    setVoice(v, t) { S.settings.voice = t.checked; save('settings'); },
    testSound() { Sound.init(); Voice.init(); Sound.cue('count'); setTimeout(() => Sound.cue('start'), 400); setTimeout(() => Voice.say('جاهز. ابدأ.', 'Ready. Go.'), 1000); },
    saveWedding() { S.settings.wedding = $('#setWedding').value || null; save('settings'); this.refresh(); this.toast('انحفظ التاريخ'); },
    clearWedding() { S.settings.wedding = null; save('settings'); this.refresh(); },
    repeatWeek() { S.profile.startDate = addDays(S.profile.startDate || todayKey(), 7); save('profile'); this.refresh(); this.toast('تأجل البرنامج أسبوعًا'); },
    recal() { this.calib = {}; this.calIdx = 0; $('#shell').hidden = true; $('#onboard').hidden = false; this.calNext(); },
    checkVideos() {
      const ids = LIB.all.filter((e, i, a) => a.findIndex(x => x.video === e.video) === i).map(e => e.id);
      ids.forEach(id => { delete VID.ok[id]; });
      $$('#vidList .vs').forEach(s => s.textContent = 'يفحص…');
      ids.forEach(id => VID.probe(id).then(ok => { const li = $(`#vidList [data-vid="${id}"] .vs`); if (li) li.textContent = ok ? 'موجود' : 'غير موجود — يظهر العرض المتحرك'; }));
    },
    export() {
      const data = { app: 'malik-coach', version: 1, exportedAt: new Date().toISOString(), data: { profile: S.profile, settings: S.settings, levels: S.levels, log: S.log } };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `malik-backup-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      window.__cues.push('export'); this.toast('تم تجهيز الملف');
    },
    importPick(v, t, e) {
      if (e.type !== 'click') return;
      t.onchange = async () => {
        const f = t.files && t.files[0]; if (!f) return;
        try {
          const j = JSON.parse(await f.text());
          if (j.app !== 'malik-coach' || !j.data || !Array.isArray(j.data.log)) throw new Error('bad');
          this.pendingImport = j.data;
          this.modal(`<h2>استيراد النسخة؟</h2><p>فيها ${j.data.log.length} جلسة. البيانات الحالية تُستبدل.</p>
            <button class="btn btn-primary" data-act="importYes">استيراد</button><button class="btn btn-ghost" data-act="closeModal">إلغاء</button>`);
        } catch (err) { this.toast('الملف غير صالح. اختر ملف نسخة احتياطية من هذا التطبيق.'); }
        t.value = '';
      };
    },
    async importYes() {
      const d = this.pendingImport; if (!d) return;
      S.profile = Object.assign(S.profile, d.profile || {}); S.settings = Object.assign(S.settings, d.settings || {});
      S.levels = Object.assign(PROG.defaultLevels(), d.levels || {}); S.log = d.log || [];
      await Promise.all(['profile', 'settings', 'levels', 'log'].map(save));
      this.pendingImport = null; this.closeModal(); window.__cues.push('import'); this.toast('تم الاستيراد'); this.refresh();
    },
    reset() {
      this.modal(`<h2>تمسح كل البيانات؟</h2><p>الجلسات، المستويات، الإعدادات، وتاريخ الزواج. ما فيه تراجع.</p>
        <button class="btn btn-danger" data-act="resetYes">امسح نهائيًا</button><button class="btn btn-ghost" data-act="closeModal">إلغاء</button>`);
    },
    async resetYes() { await DB.clear(); window.__cues.push('reset'); location.reload(); },
    resumeGo() { const a = S.active; this.closeModal(); WO.begin(a.plan, a); },
    resumeRestart() { const a = S.active; this.closeModal(); const plan = a.plan.type === 'joz' ? PROG.buildJoz(weekNum()) : PROG.buildStrength(a.plan.key, S.levels, weekNum()); WO.begin(plan); },
    resumeDrop() { S.active = null; save('active'); this.closeModal(); },
    stopYes() { this.closeModal(); WO.stop(); },
    fbDiff(v, t) { this.post.difficulty = v; $$('#post [data-act="fbDiff"]').forEach(b => b.setAttribute('aria-pressed', b === t)); this.fbCheck(); },
    fbComp(v, t) { this.post.completion = v; $$('#post [data-act="fbComp"]').forEach(b => b.setAttribute('aria-pressed', b === t)); this.fbCheck(); },
    fbEasy(v, t) { const a = this.post.easyFams; const i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); t.setAttribute('aria-pressed', i < 0); },
    fbHard(v, t) { const a = this.post.hardFams; const i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); t.setAttribute('aria-pressed', i < 0); },
    fbSave() { this.savePost(); },
    postDone() { $('#post').hidden = true; this.tab = 'today'; this.showShell(); },
    seenReport(v) { S.settings.seenReports.push(Number(v)); save('settings'); this.refresh(); },
    cardio() { this.openCardio(); },
    cardioGo(v) { this.cardioStart(Number(v)); },
    cardioStop() { this.cardioEnd(false); },
    cardioClose() { this.closeCardio(); },
    cardioLog() {
      this.modal(`<h2>سجّل مشي سويته</h2><div class="opts opts-4">${[15, 20, 30, 40].map(m => `<button class="btn btn-opt" data-act="cardioLogYes" data-v="${m}">${m} د</button>`).join('')}</div><button class="btn btn-ghost" data-act="closeModal">إلغاء</button>`);
    },
    cardioLogYes(v) { this.closeModal(); this.logCardio(Number(v) * 60); },
  },
  fbCheck() {
    const isStr = this.post.result.plan.type === 'strength';
    $('#fbSave').disabled = !(this.post.difficulty && (!isStr || this.post.completion));
  },
  toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(this.tt);
    this.tt = setTimeout(() => { t.hidden = true; }, 2600);
  },
};

document.addEventListener('DOMContentLoaded', () => UI.boot());

</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26282B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مالك">
<title>مالك — المدرب التلقائي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#EEEDE7; --paper-2:#E3E0D7; --stone:#CFC7B8; --ink:#26282B; --ink-2:#55585C; --ink-3:#7C7E7F;
  --olive:#3F4A2E; --olive-2:#5E6A45; --olive-3:#DDE0CF; --bronze:#94703F; --bronze-2:#C29A62; --navy:#1E2835; --danger:#8A3B2E;
  --ui:"SF Arabic","Geeza Pro","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --cond:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --r-s:6px; --r-m:12px; --r-l:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6;overflow-x:hidden}
body.wo-open{overflow:hidden}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 .7em}
code{font-family:ui-monospace,Menlo,monospace;font-size:.82em;background:var(--paper-2);padding:1px 5px;border-radius:4px;word-break:break-all}
.muted{color:var(--ink-3);font-size:.9rem}
.center{text-align:center}
.plain{padding-inline-start:1.1em;margin:0 0 .8em}
.plain li{margin-bottom:.3em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--bronze-2);outline-offset:2px}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:var(--r-m);padding:15px 18px;font-weight:700;font-size:1.02rem;cursor:pointer;text-align:center;margin-top:10px;min-height:52px}
.row .btn{width:auto;flex:1 1 150px}
.btn-primary{background:var(--olive);color:#F4F2EA}
.btn-primary:active{background:#323b24}
.btn-start{font-size:1.25rem;min-height:64px;background:var(--ink);color:#F4F2EA}
.btn-secondary{background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--stone)}
.btn-ghost{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--stone)}
.btn-link{background:none;color:var(--olive);text-decoration:underline;min-height:0;padding:8px}
.btn-danger{background:var(--danger);color:#fff}
.btn-opt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--stone);margin-top:0}
.btn-opt[aria-pressed="true"]{background:var(--olive);color:#fff;box-shadow:none}
.btn-opt.is-rec{box-shadow:inset 0 0 0 2px var(--bronze)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opts{display:grid;gap:10px;margin:12px 0 18px}
.opts-4{grid-template-columns:repeat(2,1fr)}
.chip{border:0;background:var(--paper-2);border-radius:999px;padding:8px 14px;font-size:.88rem;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--stone)}
.chip[aria-pressed="true"]{background:var(--olive-3);box-shadow:inset 0 0 0 1.5px var(--olive-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.linkish{background:none;border:0;padding:0;cursor:pointer;text-align:start;text-decoration:underline;text-decoration-color:var(--stone);text-underline-offset:3px}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:.9rem;color:var(--ink-2);margin-bottom:4px}
.field input{width:100%;padding:12px;border-radius:var(--r-s);border:1.5px solid var(--stone);background:#fff;min-height:48px}
.switch{display:flex;gap:10px;align-items:center;padding:8px 0}
.switch input{width:22px;height:22px;accent-color:var(--olive)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* shell */
#shell{padding:calc(var(--safe-t) + 10px) 18px calc(var(--safe-b) + 92px);max-width:620px;margin:0 auto}
.page-head{padding:14px 0 8px}
.kicker{font-size:.86rem;color:var(--ink-3);margin-bottom:2px}
.page-head h1{font-size:2.2rem}
.block{padding:18px 0;border-top:1.5px solid var(--paper-2)}
.block h2{margin-bottom:.55em}
.note{background:var(--olive-3);border-radius:var(--r-m);padding:12px 14px}
.block.note{border:0;margin:12px 0}
.nav{position:fixed;inset:auto 0 0 0;background:rgba(238,237,231,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1.5px solid var(--paper-2);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(var(--safe-b) + 6px);z-index:20}
.nav button{background:none;border:0;padding:10px 2px;font-size:.84rem;font-weight:600;color:var(--ink-3);border-radius:var(--r-s);cursor:pointer;min-height:48px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--paper-2)}

/* session card */
.session{background:#fff;border-radius:var(--r-l);padding:18px;margin:10px 0 16px;box-shadow:0 1px 0 var(--stone)}
.session-primary{background:#F8F7F2;box-shadow:inset 0 0 0 1.5px var(--stone)}
.session-head{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.session-letter{font-family:var(--cond);font-weight:800;font-size:5.4rem;line-height:.8;color:var(--bronze);min-width:.7em;text-align:center}
.session-head h3{font-family:var(--cond);font-size:1.6rem;font-weight:700;margin:0}
.session-head p{margin:0;color:var(--ink-2)}
.session-head .areas{font-size:.86rem;color:var(--ink-3)}
.ex-list{margin:6px 0 4px;padding-inline-start:1.4em}
.ex-list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--paper-2)}
.ex-list li small{color:var(--ink-3);white-space:nowrap}
.sound-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.session-done{background:var(--olive-3)}
.session-recovery{background:var(--olive-3)}

.wedding{margin:6px 0 10px;padding:14px 18px;border-radius:var(--r-m);background:var(--ink);color:#EDEBE3}
.wed-label{margin:0;font-size:.85rem;color:var(--bronze-2)}
.wed-main{margin:0;font-size:1.5rem;font-weight:800}
.wed-sub{margin:0;font-size:.9rem;color:#BEBAB0}
.week-dots{display:flex;gap:10px;list-style:none;padding:0;margin:0 0 10px}
.week-dots li{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-size:1.5rem;font-weight:700;box-shadow:inset 0 0 0 2px var(--stone);color:var(--ink-3)}
.week-dots li.is-done{background:var(--olive);color:#fff;box-shadow:none}
.mini,.stats,.report-grid,.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 10px}
.mini div,.stats div,.report-grid div,.kv div{background:#fff;border-radius:var(--r-s);padding:10px 12px}
.mini dt,.stats dt,.report-grid dt,.kv dt{font-size:.8rem;color:var(--ink-3)}
.mini dd,.stats dd,.report-grid dd,.kv dd{margin:0;font-size:1.35rem;font-weight:800;font-family:var(--cond)}
.kv dd{font-size:1.1rem;font-family:var(--ui)}
.entries{list-style:none;padding:0;margin:0}
.entries li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper-2);font-size:.9rem}
.report{background:#fff;border-radius:var(--r-m);padding:14px;margin-bottom:12px}
.report-banner{margin:6px 0 14px}
.report-msg{font-weight:700;margin-top:6px}
.changes{padding-inline-start:1.1em;font-size:.92rem}
.lvl-list{list-style:none;padding:0;margin:0}
.lvl-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--paper-2)}
.lvl-list b{font-family:var(--cond);font-size:1.05rem}

/* plan */
.phases{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.phases li{background:#fff;border-radius:var(--r-m);padding:12px 14px;border-inline-start:4px solid var(--stone)}
.phases li.is-now{border-inline-start-color:var(--bronze);background:#F8F5EE}
.phases h3 span{font-family:var(--cond);color:var(--ink-3);font-weight:600}
.ph-weeks{margin:0;font-size:.8rem;color:var(--ink-3)}
.ph-rir{margin:0;font-size:.82rem;color:var(--olive-2);font-weight:700}
.week-tmpl{list-style:none;padding:0;margin:0 0 8px}
.week-tmpl li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--paper-2)}
.week-tmpl li.k-strength span:last-child{font-weight:800;font-family:var(--cond);font-size:1.1rem}
.week-tmpl li.k-rest{color:var(--ink-3)}
.plan-grid{display:grid;gap:12px}
.plan-sess{background:#fff;border-radius:var(--r-m);padding:14px}
.plan-sess h3{font-family:var(--cond);font-size:1.4rem}
.plan-sess ul{list-style:none;padding:0;margin:0}
.plan-sess li{display:flex;justify-content:space-between;padding:5px 0;font-size:.95rem}
.plan-sess small{color:var(--ink-3)}
.fam{background:#fff;border-radius:var(--r-s);margin-bottom:8px;padding:4px 12px}
.fam summary{display:flex;justify-content:space-between;gap:10px;padding:10px 0;cursor:pointer;font-weight:700}
.fam summary span:last-child{font-family:var(--cond);font-weight:600;color:var(--ink-2)}
.fam ol{padding-inline-start:0;list-style:none;margin:0 0 8px}
.fam li{padding:6px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fam li.is-cur .linkish{font-weight:800;color:var(--olive)}
.gate{color:var(--bronze);font-size:.78rem}
.evidence dl{margin:0}
.evidence dl div{padding:10px 0;border-bottom:1px solid var(--paper-2)}
.evidence dt{font-weight:800;color:var(--olive)}
.evidence dd{margin:0}
.joz-head h1{font-size:2.6rem;letter-spacing:-.01em}
.joz-tag{color:var(--bronze);font-weight:700;margin:0}
.refs{font-size:.8rem;direction:ltr;text-align:left;padding-left:1.4em;color:var(--ink-2)}
.refs li{margin-bottom:6px}
.vid-list{list-style:none;padding:0;margin:8px 0 0;max-height:320px;overflow:auto;font-size:.82rem}
.vid-list li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--paper-2)}
.vid-list .vs{color:var(--ink-3);white-space:nowrap}
.danger h2{color:var(--danger)}

/* onboarding */
#onboard{min-height:100vh;min-height:100dvh;padding:calc(var(--safe-t) + 24px) 22px calc(var(--safe-b) + 24px);max-width:560px;margin:0 auto;display:flex;flex-direction:column;justify-content:center}
.ob-intro{text-align:start}
.ob-name{font-family:var(--cond);font-size:clamp(4.2rem,24vw,8rem);font-weight:800;line-height:.85;letter-spacing:.01em;margin:0 0 10px;color:var(--ink);text-align:left}
.ob-stats{display:flex;gap:26px;margin:0 0 26px}
.ob-stats dt{font-size:.8rem;color:var(--ink-3)}
.ob-stats dd{margin:0;font-family:var(--cond);font-size:2.2rem;font-weight:700}
.ob-back{font-family:var(--cond);font-size:1.8rem;font-weight:800;color:var(--bronze);margin:0;text-align:left}
.ob-line{font-size:1.45rem;font-weight:800;margin-bottom:10px}
.ob-sub{color:var(--ink-2)}
.ob-count{color:var(--ink-3);font-size:.86rem}
.cal-q{font-size:1.15rem;margin-top:10px}
.demo-box{background:var(--ink);border-radius:var(--r-m);aspect-ratio:16/10;position:relative;overflow:hidden}
.demo-name{font-family:var(--cond);font-size:1.4rem;font-weight:700;margin:8px 0 0;text-align:left}
.cues{padding-inline-start:1.1em;margin:6px 0}
.cues li{font-weight:600}

/* modal */
#modal{position:fixed;inset:0;background:rgba(30,32,34,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal-body{background:var(--paper);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:22px 20px calc(var(--safe-b) + 20px)}
.prev-list{list-style:none;padding:0;margin:12px 0}
.prev-list li{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--paper-2)}
.thumb{background:var(--ink);border-radius:var(--r-s);aspect-ratio:16/10}
.pl-en{font-family:var(--cond);font-weight:700;font-size:1.15rem;margin:0;text-align:left}
.pl-ar{margin:0;color:var(--ink-2);font-size:.9rem}
.pl-meta{margin:0;color:var(--ink-3);font-size:.8rem}
.safety{font-size:.88rem;color:var(--danger)}
.ex-en{font-family:var(--cond);font-size:1.8rem;margin-top:12px;text-align:left}
.ex-ar{color:var(--ink-2);margin-top:-6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 90px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:90;font-size:.9rem;max-width:90vw;text-align:center}

/* figure */
.fig-svg{width:100%;height:100%;display:block}
.fp-floor{stroke:#5F6264;stroke-width:2}
.fp-wall{fill:#44474A}.fp-chair{fill:#8C7654}.fp-sofa{fill:#4E5540}.fp-mat{fill:#3C4632}
.f-limb{stroke:#F2EFE8;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.f-far{stroke:#9FA58F}
.f-torso{stroke-width:12}.f-wide{stroke-width:30}
.f-head{fill:#F2EFE8}
.f-towel{stroke:#C29A62;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.f-glow{fill:#C29A62;transition:none}
.f-belly{fill:#C29A62;opacity:.7}
.f-shadowline{stroke:#000;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.ms-video,.ms-fig{position:absolute;inset:0}
[data-kind="fig"] .ms-video,[data-kind="video"] .ms-fig{display:none}
.demo-video{width:100%;height:100%;object-fit:contain;background:#000;display:block}

/* ============ WORKOUT (hands-free) ============ */
#workout{position:fixed;inset:0;z-index:50;background:var(--ink);color:#F3F1EA;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 8px) 14px calc(var(--safe-b) + 10px);transition:background .4s}
#workout[data-phase="rest"]{background:#2C3622}
#workout[data-phase="prep"],#workout[data-phase="trans"],#workout[data-phase="switch"]{background:var(--navy)}
#workout[data-phase="warm"]{background:#30302C}
.wo-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.95rem;color:#C8C4B8}
.wo-title{font-family:var(--cond);font-weight:700;font-size:1.05rem}
.wo-bar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;margin:6px 0 8px;overflow:hidden}
.wo-bar i{display:block;height:100%;background:var(--bronze-2);width:0}
.wo-main{flex:1;display:flex;flex-direction:column;min-height:0;gap:6px}
.wo-media{position:relative;flex:1 1 44%;min-height:150px;background:rgba(0,0,0,.18);border-radius:var(--r-m);overflow:hidden;transition:opacity .4s}
.wo-media.is-dim{opacity:.28}
#woMedia{position:absolute;inset:0}
.wo-cues{position:absolute;top:8px;inset-inline-start:10px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.wo-cues li{background:rgba(20,22,24,.72);padding:3px 10px;border-radius:6px;font-weight:700;font-size:clamp(.9rem,3.6vw,1.25rem);width:fit-content}
.wo-tag{position:absolute;bottom:8px;inset-inline-end:10px;background:var(--bronze);color:#fff;font-weight:800;padding:3px 12px;border-radius:6px;font-family:var(--cond);font-size:1.2rem}
.wo-tag:empty{display:none}
.wo-cycle{position:absolute;bottom:10px;inset-inline-start:10px;font-size:clamp(1.8rem,9vw,3.4rem);font-weight:900;padding:2px 16px;border-radius:10px;background:rgba(20,22,24,.75)}
.wo-cycle[data-on="1"]{background:var(--bronze);color:#fff}
.wo-info{text-align:center;flex:0 0 auto}
.wo-phase{font-weight:800;color:var(--bronze-2);font-size:clamp(1.1rem,5vw,1.7rem);margin:0}
#workout[data-phase="rest"] .wo-phase{color:#C9D3AE}
.wo-name{font-family:var(--cond);font-weight:800;font-size:clamp(2.2rem,11vw,5rem);line-height:.95;text-transform:uppercase;margin:2px 0 0;letter-spacing:.01em;overflow-wrap:anywhere}
.wo-name-ar{font-size:clamp(1rem,4.6vw,1.5rem);color:#D8D4C9;margin:2px 0 0;font-weight:700}
.wo-timer{font-family:var(--cond);font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(4.4rem,27vw,11rem);line-height:.9;margin:4px 0 0;color:#fff}
#workout[data-phase="work"] .wo-timer{color:var(--bronze-2)}
.wo-set{font-weight:800;font-size:clamp(1.05rem,5vw,1.6rem);margin:2px 0 0}
.wo-target{white-space:pre-line;color:#D6D2C7;font-size:clamp(.9rem,3.8vw,1.15rem);margin:4px 0 0;line-height:1.4}
.wo-next{color:#A9A69C;font-size:clamp(.9rem,3.8vw,1.15rem);margin:4px 0 0;font-family:var(--cond);font-weight:600}
.wo-ctl{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:8px}
.btn-pause{background:rgba(255,255,255,.14);color:#fff;font-size:1.25rem;min-height:64px;margin:0}
.btn-stopsm{background:transparent;color:#C8C4B8;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);margin:0;width:auto;padding:0 18px}
.wo-paused{position:absolute;inset:0;background:rgba(24,26,28,.94);display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safe-t) + 20px) 24px calc(var(--safe-b) + 20px);z-index:5}
.wo-paused h2{font-size:2rem}
.wo-paused .btn-primary{min-height:72px;font-size:1.4rem;background:var(--bronze)}
.wo-paused .safety{color:#E7B9A9}
@media (orientation:landscape) and (max-height:560px){
  .wo-main{flex-direction:row}
  .wo-media{flex:1 1 55%}
  .wo-info{flex:1 1 45%;display:flex;flex-direction:column;justify-content:center}
  .wo-timer{font-size:clamp(3.6rem,18vh,8rem)}
  .wo-name{font-size:clamp(1.8rem,9vh,3.6rem)}
}

/* post / cardio */
#post,#cardio{position:fixed;inset:0;z-index:55;background:var(--paper);overflow:auto}
.post-inner{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 30px)}
.fb-more{margin:0 0 10px}
.fb-more summary{cursor:pointer;color:var(--olive);font-weight:700;padding:6px 0}
.cardio-run{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px;text-align:center;background:var(--olive);color:#fff}
.cardio-timer{font-family:var(--cond);font-size:clamp(5rem,30vw,12rem);font-weight:800;line-height:1;margin:10px 0;font-variant-numeric:tabular-nums}
.cardio-run .muted{color:#D8DCC9}
.cardio-run .btn-primary{background:var(--ink)}

/* muscle map */
.mmap svg{width:100%;max-width:340px;display:block;margin:0 auto}
.mm-base,.mm-n{fill:#D5CFC3}
.mm-p{fill:var(--bronze)}
.mm-s{fill:#A7AF8C}
.mm-lbl{font-size:9px;fill:var(--ink-3);text-anchor:middle;font-family:var(--ui)}
.mm-legend p{margin:4px 0;font-size:.9rem}
.mm-dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle}
.mm-dot.mm-p{background:var(--bronze)}.mm-dot.mm-s{background:#A7AF8C}

@media (min-width:700px){ .plan-grid{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){ #workout,.wo-media{transition:none} }

</style>
</head>
<body>
<div id="onboard" hidden></div>

<main id="shell" hidden>
  <section class="tab" id="tab-today"></section>
  <section class="tab" id="tab-plan" hidden></section>
  <section class="tab" id="tab-joz" hidden></section>
  <section class="tab" id="tab-log" hidden></section>
  <section class="tab" id="tab-settings" hidden></section>
  <nav class="nav" aria-label="التنقل">
    <button data-tab="today">اليوم</button>
    <button data-tab="plan">الخطة</button>
    <button data-tab="joz">الجوز</button>
    <button data-tab="log">سجلي</button>

<script>
/* ============================================================
   FIGURE ENGINE — locally generated exercise demonstrations
   Side-view skeleton with two-bone IK, plus a top-view skeleton
   for prone shoulder-blade work. No external assets.
   ============================================================ */
const FIG = (() => {
  const SEG = { torso: 72, neck: 11, head: 13, ua: 40, fa: 38, th: 50, sh: 48, foot: 13 };
  const FLOOR = 230;
  const NS = 'http://www.w3.org/2000/svg';

  const d2r = d => d * Math.PI / 180;
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const add = (a, v) => [a[0] + v[0], a[1] + v[1]];
  const dir = deg => [Math.cos(d2r(deg)), Math.sin(d2r(deg))];
  const scale = (v, s) => [v[0] * s, v[1] * s];

  // two-bone IK: returns [jointPoint, endPoint]
  function ik(a, c, l1, l2, s) {
    let d = dist(a, c);
    const th = Math.atan2(c[1] - a[1], c[0] - a[0]);
    const maxD = l1 + l2 - 0.01, minD = Math.abs(l1 - l2) + 0.01;
    let end = c;
    if (d > maxD) { d = maxD; end = [a[0] + Math.cos(th) * d, a[1] + Math.sin(th) * d]; }
    if (d < minD) d = minD;
    let cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    cosA = Math.max(-1, Math.min(1, cosA));
    const ang = th + s * Math.acos(cosA);
    const j = [a[0] + Math.cos(ang) * l1, a[1] + Math.sin(ang) * l1];
    if (d !== dist(a, c) && d === minD) end = add(j, scale(dir(Math.atan2(c[1] - j[1], c[0] - j[0]) * 180 / Math.PI), l2));
    return [j, end];
  }

  // straight body line from ankle at screen angle (0 = right, negative = up)
  function SB(ax, ay, deg, fromKnee) {
    const u = dir(deg);
    const legLen = fromKnee ? SEG.th : SEG.th + SEG.sh;
    const a = [ax, ay];
    return { hip: add(a, scale(u, legLen)), sh: add(a, scale(u, legLen + SEG.torso)) };
  }

  const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);

  function lerpVal(a, b, t) {
    if (Array.isArray(a) && Array.isArray(b)) return a.map((v, i) => v + (b[i] - v) * t);
    if (typeof a === 'number' && typeof b === 'number') return a + (b - a) * t;
    return t < 0.5 ? a : b;
  }
  function norm(p) {
    if (p._n) return p;
    const q = Object.assign({}, p);
    if (q.hf === undefined) { q.hf = q.hn; if (q.ef === undefined && q.en !== undefined) q.ef = q.en; }
    if (q.af === undefined) { q.af = q.an; if (q.kf === undefined && q.kn !== undefined) q.kf = q.kn; if (q.ff === undefined) q.ff = q.fn; }
    if (q.ff === undefined) q.ff = q.fn ?? 0;
    if (q.fn === undefined) q.fn = 0;
    if (q.es === undefined) q.es = 1;
    if (q.ks === undefined) q.ks = -1;
    if (q.esf === undefined) q.esf = q.es;
    if (q.ksf === undefined) q.ksf = q.ks;
    Object.defineProperty(q, '_n', { value: true, enumerable: false });
    return q;
  }
  function lerpPose(p1, p2, t) {
    p1 = norm(p1); p2 = norm(p2);
    const out = {};
    const keys = new Set([...Object.keys(p1), ...Object.keys(p2)]);
    keys.forEach(k => {
      if (p1[k] === undefined) out[k] = p2[k];
      else if (p2[k] === undefined) out[k] = p1[k];
      else out[k] = lerpVal(p1[k], p2[k], t);
    });
    return out;
  }

  // ---------- SIDE skeleton solve ----------
  function solveSide(p) {
    let sh = p.sh, hip = p.hip;
    if (p.sb) { const r = SB(p.sb[0], p.sb[1], p.sb[2], p.sbk); sh = r.sh; hip = r.hip; }
    if (p.ll) { const dx = hip[0] - p.an[0], dy = hip[1] - p.an[1], dl = Math.hypot(dx, dy) || 1; hip = [p.an[0] + dx / dl * 97.6, p.an[1] + dy / dl * 97.6]; }
    const es = p.es ?? 1, ks = p.ks ?? -1;
    const esf = p.esf ?? es, ksf = p.ksf ?? ks;
    const hn = p.hn, hf = p.hf ?? p.hn;
    const an = p.an, af = p.af ?? p.an;
    const armN = p.en ? [p.en, hn] : ik(sh, hn, SEG.ua, SEG.fa, es);
    const efx = p.ef ?? (p.hf === undefined ? p.en : undefined);
    const kfx = p.kf ?? (p.af === undefined ? p.kn : undefined);
    const armF = efx ? [efx, hf] : ik(sh, hf, SEG.ua, SEG.fa, esf);
    const legN = p.kn ? [p.kn, an] : ik(hip, an, SEG.th, SEG.sh, ks);
    const legF = kfx ? [kfx, af] : ik(hip, af, SEG.th, SEG.sh, ksf);
    const tu = [sh[0] - hip[0], sh[1] - hip[1]];
    const tl = Math.hypot(tu[0], tu[1]) || 1;
    let hdir = [tu[0] / tl, tu[1] / tl];
    if (typeof p.hd === 'number') hdir = dir(p.hd);
    const neck = add(sh, scale(hdir, SEG.neck));
    const head = add(neck, scale(hdir, SEG.head));
    const fn = p.fn ?? 0, ff = p.ff ?? fn;
    const toeN = add(legN[1], scale(dir(fn), SEG.foot));
    const toeF = add(legF[1], scale(dir(ff), SEG.foot));
    return { sh, hip, neck, head, elN: armN[0], hN: armN[1], elF: armF[0], hF: armF[1],
      knN: legN[0], anN: legN[1], toeN, knF: legF[0], anF: legF[1], toeF, glow: p.g || 0, belly: p.b || 0 };
  }

  // ---------- TOP skeleton (prone, seen from above, head to the right) ----------
  function solveTop(p) {
    const cx = 200, cy = 128;
    const lift = p.lift || 0;
    const shN = [cx + 55, cy + 30], shF = [cx + 55, cy - 30];
    const hipN = [cx - 30, cy + 18], hipF = [cx - 30, cy - 18];
    const head = [cx + 90 + lift * 4, cy];
    function arm(sh, sgn) {
      // angle: 0 = overhead (toward head, +x), 90 = straight out, 180 = by the hips
      const a = d2r(p.arm);
      const u = [Math.cos(a), sgn * Math.sin(a)];
      const el = add(sh, scale(u, 40));
      const fa = d2r(p.arm - (p.bend || 0));
      const u2 = [Math.cos(fa), sgn * Math.sin(fa)];
      const hand = add(el, scale(u2, 38));
      return [el, hand];
    }
    const [elN, hN] = arm(shN, 1), [elF, hF] = arm(shF, -1);
    return { top: true, head, shN, shF, hipN, hipF, elN, hN, elF, hF,
      anN: [cx - 128, cy + 14], anF: [cx - 128, cy - 14], lift, thumbs: p.thumbs || 0 };
  }

  // ---------- SVG building ----------
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function drawProps(g, props) {
    (props || []).forEach(pr => {
      if (pr.t === 'wall') {
        el('rect', { x: pr.x, y: 8, width: 14, height: FLOOR - 8, class: 'fp-wall' }, g);
      } else if (pr.t === 'chair') {
        // seat top at y, spanning x..x+w ; backrest on side 'back' (l / r)
        const { x, y, w } = pr;
        el('rect', { x, y, width: w, height: 7, rx: 2, class: 'fp-chair' }, g);
        el('rect', { x: x + 3, y: y + 7, width: 5, height: FLOOR - y - 7, class: 'fp-chair' }, g);
        el('rect', { x: x + w - 8, y: y + 7, width: 5, height: FLOOR - y - 7, class: 'fp-chair' }, g);
        const bx = pr.back === 'l' ? x : x + w - 6;
        if (pr.back) el('rect', { x: bx, y: y - 52, width: 6, height: 52, rx: 2, class: 'fp-chair' }, g);
      } else if (pr.t === 'sofa') {
        const { x, y, w } = pr;
        el('rect', { x, y, width: w, height: FLOOR - y, rx: 8, class: 'fp-sofa' }, g);
        const bx = pr.back === 'l' ? x - 2 : x + w - 18;
        el('rect', { x: bx, y: y - 44, width: 20, height: FLOOR - y + 44, rx: 8, class: 'fp-sofa' }, g);
      } else if (pr.t === 'mat') {
        el('rect', { x: pr.x, y: FLOOR - 4, width: pr.w, height: 5, rx: 2, class: 'fp-mat' }, g);
      }
    });
  }

  function build(container, ex) {
    container.innerHTML = '';
    const svg = el('svg', { viewBox: '0 0 400 250', class: 'fig-svg', role: 'img', 'aria-label': ex.en });
    el('line', { x1: 8, y1: FLOOR + 1, x2: 392, y2: FLOOR + 1, class: 'fp-floor' }, svg);
    const pg = el('g', {}, svg);
    drawProps(pg, ex.anim.props);
    const shadow = el('g', { class: 'f-shadow' }, svg);
    const fig = el('g', { class: 'f-body' }, svg);
    const mk = (cls, parent) => el('polyline', { class: cls, fill: 'none' }, parent || fig);
    const parts = {
      towel: el('polyline', { class: 'f-towel', fill: 'none' }, svg),
      girdle: el('polyline', { class: 'f-limb', fill: 'none' }, fig),
      sArmN: mk('f-shadowline', shadow), sArmF: mk('f-shadowline', shadow),
      armF: mk('f-limb f-far'), legF: mk('f-limb f-far'),
      torso: mk('f-limb f-torso'), legN: mk('f-limb'), armN: mk('f-limb'),
      head: el('circle', { r: SEG.head, class: 'f-head' }, fig),
      belly: el('ellipse', { class: 'f-belly', rx: 0, ry: 0 }, svg),
      glow: el('circle', { class: 'f-glow', r: 16 }, svg),
    };
    fig.insertBefore(parts.armF, fig.firstChild);
    container.appendChild(svg);
    return { svg, parts };
  }

  const pts = arr => arr.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  function render(built, pose, ex) {
    const P = built.parts;
    if (ex.anim.view === 'top') {
      const s = solveTop(pose);
      P.torso.setAttribute('points', pts([[(s.shN[0] + s.shF[0]) / 2 + 12, s.head[1]], [(s.hipN[0] + s.hipF[0]) / 2, s.head[1]]]));
      P.torso.setAttribute('class', 'f-limb f-torso f-wide');
      P.legN.setAttribute('points', pts([s.hipN, s.anN]));
      P.legF.setAttribute('points', pts([s.hipF, s.anF]));
      P.legF.setAttribute('class', 'f-limb');
      P.girdle.setAttribute('points', pts([s.shF, s.shN]));
      P.armN.setAttribute('points', pts([s.shN, s.elN, s.hN]));
      P.armF.setAttribute('points', pts([s.shF, s.elF, s.hF]));
      P.armF.setAttribute('class', 'f-limb');
      const off = s.lift * 9;
      P.sArmN.setAttribute('points', pts([[s.shN[0] + off, s.shN[1] + off], [s.elN[0] + off, s.elN[1] + off], [s.hN[0] + off, s.hN[1] + off]]));
      P.sArmF.setAttribute('points', pts([[s.shF[0] + off, s.shF[1] + off], [s.elF[0] + off, s.elF[1] + off], [s.hF[0] + off, s.hF[1] + off]]));
      P.sArmN.style.opacity = P.sArmF.style.opacity = (0.15 + s.lift * 0.35).toFixed(2);
      P.head.setAttribute('cx', s.head[0]); P.head.setAttribute('cy', s.head[1]);
      built.svg.classList.toggle('f-lifted', s.lift > 0.5);
      P.glow.style.opacity = 0; P.towel.setAttribute('points', '');
      return;
    }
    const s = solveSide(pose);
    P.torso.setAttribute('points', pts([s.neck, s.sh, s.hip]));
    P.legN.setAttribute('points', pts([s.hip, s.knN, s.anN, s.toeN]));
    P.legF.setAttribute('points', pts([s.hip, s.knF, s.anF, s.toeF]));
    P.armN.setAttribute('points', pts([s.sh, s.elN, s.hN]));
    P.armF.setAttribute('points', pts([s.sh, s.elF, s.hF]));
    P.head.setAttribute('cx', s.head[0].toFixed(1)); P.head.setAttribute('cy', s.head[1].toFixed(1));
    // pelvic-floor glow
    if (ex.anim.glow) {
      const gp = [s.hip[0] + (ex.anim.glowOff?.[0] ?? 0), s.hip[1] + (ex.anim.glowOff?.[1] ?? 4)];
      P.glow.setAttribute('cx', gp[0]); P.glow.setAttribute('cy', gp[1]);
      P.glow.style.opacity = (0.12 + s.glow * 0.8).toFixed(2);
      P.glow.setAttribute('r', (10 + s.glow * 9).toFixed(1));
    } else P.glow.style.opacity = 0;
    if (ex.anim.belly) {
      const m = [(s.sh[0] + s.hip[0]) / 2, (s.sh[1] + s.hip[1]) / 2];
      const ang = Math.atan2(s.sh[1] - s.hip[1], s.sh[0] - s.hip[0]) * 180 / Math.PI;
      const nrm = ex.anim.belly; // side of the belly: +1 / -1 perpendicular
      const off = dir(ang + 90 * nrm);
      const c = add(m, scale(off, 6 + s.belly * 6));
      P.belly.setAttribute('cx', c[0]); P.belly.setAttribute('cy', c[1]);
      P.belly.setAttribute('rx', (18 + s.belly * 4).toFixed(1)); P.belly.setAttribute('ry', (5 + s.belly * 9).toFixed(1));
      P.belly.setAttribute('transform', `rotate(${ang.toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)})`);
      P.belly.style.opacity = 1;
    } else P.belly.style.opacity = 0;
    // towel
    if (ex.anim.towel) {
      const map = { hN: s.hN, hF: s.hF, toeN: s.toeN, anN: s.anN, anF: s.anF, toeF: s.toeF };
      const tw = ex.anim.towel.map(k => Array.isArray(k) ? k : map[k]);
      P.towel.setAttribute('points', pts(tw));
    } else if (ex.anim.heelTowel) {
      P.towel.setAttribute('points', pts([[s.anN[0] - 16, FLOOR - 2], [s.anN[0] + 12, FLOOR - 2]]));
    } else P.towel.setAttribute('points', '');
  }

  // --------- animator -----------
  function poseAt(anim, time) {
    const keys = anim.keys;
    if (keys.length === 1) return keys[0].p;
    const total = keys.reduce((s, k) => s + (k.d || 0) + (k.h || 0), 0);
    let t = time % total;
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      const prev = keys[(i - 1 + keys.length) % keys.length];
      if (t < k.d) return lerpPose(prev.p, k.p, ease(t / k.d));
      t -= k.d;
      if (t < (k.h || 0)) return k.p;
      t -= (k.h || 0);
    }
    return keys[0].p;
  }

  // Figure player instance
  function Player(container) {
    this.c = container; this.ex = null; this.b = null; this.t0 = 0; this.paused = false; this.pauseAt = 0;
    this.drive = null; this.driveVal = 0; this.raf = 0;
  }
  Player.prototype.load = function (ex) {
    this.ex = ex; this.b = build(this.c, ex); this.t0 = performance.now(); this.driveVal = 0; this.drive = null;
    this.frame(performance.now());
    this.start();
  };
  Player.prototype.setDrive = function (fn) { this.drive = fn; };
  Player.prototype.frame = function (now) {
    if (!this.ex) return;
    const a = this.ex.anim;
    let pose;
    if (this.drive && a.drive) {
      const target = this.drive();
      this.driveVal += (target - this.driveVal) * 0.12;
      pose = lerpPose(a.drive[0], a.drive[1], this.driveVal);
    } else {
      pose = poseAt(a, (now - this.t0) / 1000);
    }
    render(this.b, pose, this.ex);
  };
  Player.prototype.start = function () {
    cancelAnimationFrame(this.raf);
    const loop = now => { if (!this.paused) this.frame(now); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  };
  Player.prototype.pause = function () { if (!this.paused) { this.paused = true; this.pauseAt = performance.now(); } };
  Player.prototype.resume = function () { if (this.paused) { this.t0 += performance.now() - this.pauseAt; this.paused = false; } };
  Player.prototype.stop = function () { cancelAnimationFrame(this.raf); this.ex = null; this.c.innerHTML = ''; };
  Player.prototype.renderAt = function (sec) { if (this.ex) render(this.b, poseAt(this.ex.anim, sec), this.ex); };

  return { SEG, FLOOR, SB, Player, poseAt, lerpPose, solveSide, norm };
})();

/* ============================================================
   EXERCISE LIBRARY
   Every exercise: names, cues, setup, muscles, mode, animation.
   Video file for each exercise: assets/videos/<video>.mp4
   ============================================================ */
const LIB = (() => {
  const SB = FIG.SB;
  const K = (p, d, h) => ({ p, d, h: h || 0 });
  const withA = (o, ex) => Object.assign({}, o, ex);

  // ---------- reusable poses ----------
  const STAND = { sh: [200, 54], hip: [200, 126], hn: [206, 129], an: [200, 224], fn: 0, hd: -90 };

  // push-up family geometry
  const pu = (ax, ay, deg, hand, fn) => ({ sb: [ax, ay, deg], hn: hand, an: [ax, ay], fn: fn ?? 80, es: 1 });
  const PU_UP = pu(88, 214, -22, [246, 224]);
  const PU_DN = pu(88, 214, -4.7, [246, 224]);
  const WALL_UP = pu(185, 224, -77, [297, 76], 0);
  const WALL_DN = pu(185, 224, -63, [297, 76], 0);
  const INC_UP = pu(140, 214, -45, [283, 166]);
  const INC_DN = pu(140, 214, -27, [283, 166]);
  const kneePU = deg => ({ sb: [140, 222, deg], sbk: true, hn: [240, 224], kn: [140, 222], an: [96, 200], fn: -150, es: 1 });
  const KN_UP = kneePU(-36.2), KN_DN = kneePU(-10.4);
  const DEC_UP = pu(86, 158, -2.7, [252, 224]);
  const DEC_DN = pu(86, 158, 13.6, [252, 224]);

  // pike
  const PIKE_UP = { hip: [168, 124], sh: [222, 171], hn: [282, 224], an: [140, 216], fn: 70, es: 1, ks: 1, ll: true };
  const PIKE_DN = { hip: [214, 153], sh: [276, 193], hn: [282, 224], an: [140, 216], fn: 70, es: 1, ks: 1, ll: true };
  const IPIKE_UP = { hip: [200, 122], sh: [268, 146], hn: [334, 166], an: [175, 216], fn: 70, es: 1, ks: 1, ll: true };
  const IPIKE_DN = { hip: [224, 138], sh: [296, 150], hn: [334, 166], an: [175, 216], fn: 70, es: 1, ks: 1, ll: true };
  const EPIKE_UP = { hip: [170, 85], sh: [199, 151], hn: [232, 224], an: [110, 162], fn: 80, es: 1, ks: 1, ll: true };
  const EPIKE_DN = { hip: [190, 108], sh: [224, 172], hn: [232, 224], an: [110, 162], fn: 80, es: 1, ks: 1, ll: true };

  // squat
  const SQ_DN = { sh: [206, 121], hip: [160, 176], hn: [272, 114], an: [200, 224], fn: 0, hd: -62, ks: -1, es: 1 };
  const SQ_HALF = FIG.lerpPose(STAND, SQ_DN, 0.5);
  const SQ_STAND_ARMS = withA(STAND, { hn: [262, 70] });
  const STS_SIT = { sh: [187, 104], hip: [150, 166], hn: [206, 112], an: [206, 224], fn: 0, hd: -75, ks: -1, es: 1 };
  const STS_UP = { sh: [206, 54], hip: [206, 126], hn: [226, 70], an: [206, 224], fn: 0, hd: -90, es: 1 };

  // split squat
  const SPLIT_UP = { sh: [186, 66], hip: [186, 138], hn: [199, 132], an: [231, 224], af: [141, 212], fn: 0, ff: 60, ks: -1, es: -1, hd: -90 };

/* ============================================================
   PROGRAM — phases, sessions, timeline builder, progression
   ============================================================ */
const PROG = (() => {
  const PHASES = [
    { id: 'return', from: 1, to: 2, ar: 'العودة', en: 'Return', rir: '3',
      goal: 'نرجّع التكنيك ونجهّز المفاصل والأوتار بدون ألم عضلي مزعج. مجموعتين لأغلب التمارين.' },
    { id: 'build', from: 3, to: 4, ar: 'البناء', en: 'Build', rir: '2–3',
      goal: 'نرفع الحجم تدريجيًا لـ 2–3 مجموعات، ونصعّد المستوى إذا الأداء يسمح.' },
    { id: 'grow', from: 5, to: 6, ar: 'النمو', en: 'Grow', rir: '1–2',
      goal: 'حجم تدريب فعّال للتضخيم: 3–4 مجموعات. آخر مجموعة في التمارين الآمنة تقترب أكثر من الجهد.' },
    { id: 'sharpen', from: 7, to: 8, ar: 'الصقل', en: 'Sharpen', rir: '1–2',
      goal: 'نكمل التضخيم ونضبط التعب. الأسبوع 8 أخف بمجموعة في التمارين الكبيرة — بدون تحديات متهورة.' },
  ];

  const phaseOf = w => PHASES.find(p => w >= p.from && w <= p.to) || PHASES[3];

  function weekParams(week) {
    const w = Math.max(1, week > 8 ? 7 : week);
    const P = {
      1: { main: 2, acc: 2, small: 2, iso: 2, core: 2, work: 40, hold: 25, sideHold: 20, cyc: 40, rir: 'توقف وعندك تقريبًا 3 تكرارات نظيفة', lastRir: null, reps: 'low' },
      3: { main: 3, acc: 2, small: 2, iso: 2, core: 2, work: 45, hold: 30, sideHold: 25, cyc: 45, rir: 'توقف وعندك 2–3 تكرارات نظيفة', lastRir: null, reps: 'mid' },
      4: { main: 3, acc: 3, small: 3, iso: 3, core: 2, work: 45, hold: 30, sideHold: 25, cyc: 45, rir: 'توقف وعندك 2–3 تكرارات نظيفة', lastRir: null, reps: 'mid' },
      5: { main: 4, acc: 3, small: 3, iso: 3, core: 3, work: 45, hold: 40, sideHold: 30, cyc: 50, rir: 'توقف وعندك تكرارين نظيفة', lastRir: 'آخر مجموعة: 1–2 تكرار احتياط', reps: 'high' },
      7: { main: 4, acc: 3, small: 3, iso: 3, core: 3, work: 45, hold: 40, sideHold: 30, cyc: 50, rir: 'توقف وعندك تكرارين نظيفة', lastRir: 'آخر مجموعة: 1–2 تكرار احتياط', reps: 'high' },
      8: { main: 3, acc: 3, small: 3, iso: 3, core: 2, work: 45, hold: 40, sideHold: 30, cyc: 50, rir: 'توقف وعندك 1–2 تكرار نظيف', lastRir: null, reps: 'high' },
    };
    const k = w <= 2 ? 1 : w === 3 ? 3 : w === 4 ? 4 : w <= 6 ? 5 : w === 7 ? 7 : 8;
    return Object.assign({ week: w, realWeek: week }, P[k]);
  }

  const REST = { main: 90, acc: 75, small: 60, iso: 60, core: 60 };
  // exercises where the last set may approach 1–2 RIR (never squats / lunges / complex)
  const SAFE_CLOSE = new Set(['push', 'armpush', 'pike', 'glute', 'calf', 'back', 'core', 'ham']);

  const SESSIONS = {
    A: { key: 'A', en: 'Full Body A', day: 'السبت', slots: [
      { fam: 'push', role: 'main' }, { fam: 'squat', role: 'main' }, { fam: 'pike', role: 'acc' },
      { fam: 'glute', role: 'acc' }, { fam: 'back', role: 'small' }, { fam: 'core', role: 'core' }] },
    B: { key: 'B', en: 'Full Body B', day: 'الاثنين', slots: [
      { fam: 'lunge', role: 'main', rest: 75 }, { fam: 'armpush', role: 'main' }, { fam: 'rowiso', role: 'iso' },
      { fam: 'ham', role: 'acc' }, { fam: 'calf', role: 'small' }, { fam: 'side', role: 'core' }] },
    C: { key: 'C', en: 'Full Body C', day: 'الأربعاء', slots: [
      { fam: 'glute', role: 'main' }, { fam: 'push', role: 'main' }, { fam: 'squat', role: 'acc' },
      { fam: 'pike', role: 'acc' }, { fam: 'back', role: 'small' }, { fam: 'curliso', role: 'iso' }] },
  };
  const ORDER = ['A', 'B', 'C'];

  const WEEK_TEMPLATE = [
    { day: 'السبت', what: 'Full Body A', kind: 'strength' },
    { day: 'الأحد', what: 'مشي + تمارين الجوز', kind: 'recovery' },
    { day: 'الاثنين', what: 'Full Body B', kind: 'strength' },
    { day: 'الثلاثاء', what: 'مشي + تمارين الجوز', kind: 'recovery' },
    { day: 'الأربعاء', what: 'Full Body C', kind: 'strength' },
    { day: 'الخميس', what: 'مشي أطول + تمارين الجوز', kind: 'recovery' },
    { day: 'الجمعة', what: 'راحة', kind: 'rest' },
  ];

  const FAMS = {
    push: { ar: 'الضغط', en: 'Push' }, armpush: { ar: 'الترايسبس', en: 'Close-Grip' }, pike: { ar: 'الأكتاف', en: 'Pike' },
    squat: { ar: 'السكوات', en: 'Squat' }, lunge: { ar: 'الطعن', en: 'Split / Lunge' }, glute: { ar: 'الألوية', en: 'Glutes' },
    ham: { ar: 'الفخذ الخلفي', en: 'Hamstrings' }, calf: { ar: 'السمانة', en: 'Calves' }, back: { ar: 'أعلى الظهر', en: 'Upper Back' },
    rowiso: { ar: 'السحب الثابت', en: 'Row Isometric' }, curliso: { ar: 'الباي الثابت', en: 'Curl Isometric' },
    core: { ar: 'البطن', en: 'Core' }, side: { ar: 'الجوانب', en: 'Side Core' },
  };
  const TRAINABLE = Object.keys(FAMS);

  function cardioTarget(week) {
    const w = week > 8 ? 7 : week;
    if (w <= 2) return { min: 20, max: 25, times: 3 };
    if (w <= 4) return { min: 25, max: 30, times: 3 };
    return { min: 30, max: 40, times: 3 };
  }

  function defaultLevels() {
    const o = {};
    TRAINABLE.forEach(f => { o[f] = { lvl: 1, score: 0 }; });
    return o;
  }

  function maxLevelAllowed(fam, week) {
    const list = LIB.fam(fam);
    let best = 1;
    list.forEach(e => { if ((e.minWeek || 1) <= week) best = Math.max(best, e.lvl); });
    return best;
  }
  function exerciseFor(fam, levels, week) {
    const list = LIB.fam(fam);
    const stored = (levels[fam] && levels[fam].lvl) || 1;
    const eff = Math.min(stored, maxLevelAllowed(fam, week), list.length);
    return list.find(e => e.lvl === eff) || list[0];
  }

  function repTarget(ex, P) {
    if (ex.mode !== 'reps') return ex.target;
    return ex.target;
  }

  function workSeconds(ex, P, role) {
    if (ex.mode === 'hold') return ex.uni ? P.sideHold : P.hold;
    if (ex.mode === 'cycle') return P.cyc;
    let w = P.work + (ex.workAdd || 0);
    if (ex.uni) w = Math.max(35, w - 5);
    return w;
  }

  // ----------- timeline -------------
  // step: {k, dur, ex, set, sets, side, note}
  const WARM = [['march', 45], ['arm_circles', 30], ['hip_hinge', 30], ['warm_squat', 30]];

  function buildStrength(key, levels, week) {
    const S = SESSIONS[key];
    const P = weekParams(week);
    const steps = [];
    const items = S.slots.map(sl => {
      const ex = exerciseFor(sl.fam, levels, P.week);
      const sets = P[sl.role];
      const rest = sl.rest || REST[sl.role];
      return { fam: sl.fam, role: sl.role, ex, sets, rest, work: workSeconds(ex, P, sl.role) };
    });
    steps.push({ k: 'prep', dur: 10, ex: WARM[0][0], note: 'إحماء خفيف أولًا' });
    WARM.forEach(([id, d], i) => {
      steps.push({ k: 'work', dur: d, ex: id, set: 1, sets: 1, warm: true });
      if (i < WARM.length - 1) steps.push({ k: 'trans', dur: 6, ex: WARM[i + 1][0], warm: true });
    });
    steps.push({ k: 'trans', dur: 25, ex: items[0].ex.id, note: items[0].ex.setup, setup: true });
    items.forEach((it, idx) => {
      for (let s = 1; s <= it.sets; s++) {
        const last = s === it.sets;
        const closeRir = last && P.lastRir && SAFE_CLOSE.has(it.fam) && it.ex.mode === 'reps';
        const base = { k: 'work', dur: it.work, ex: it.ex.id, set: s, sets: it.sets, fam: it.fam, role: it.role, rir: closeRir ? P.lastRir : P.rir };
        if (it.ex.uni) {
          steps.push(Object.assign({}, base, { side: 1 }));
          steps.push({ k: 'switch', dur: 8, ex: it.ex.id, set: s, sets: it.sets, side: 2 });
          steps.push(Object.assign({}, base, { side: 2 }));
        } else steps.push(base);
        const nextIt = last ? items[idx + 1] : it;
        if (!nextIt) continue;
        const nextSet = last ? 1 : s + 1;
        steps.push({ k: 'rest', dur: last ? Math.max(it.rest, 75) : it.rest, ex: it.ex.id, nextEx: nextIt.ex.id, nextSet, nextSets: nextIt.sets, note: last ? nextIt.ex.setup : '' });
      }
    });
    steps.push({ k: 'done', dur: 0 });
    return { type: 'strength', key, week, title: S.en, steps, items: items.map(i => ({ id: i.ex.id, fam: i.fam, sets: i.sets, role: i.role })) };
  }

  function jozLevelFor(week) { return week <= 3 ? 'pf_lying' : week <= 6 ? 'pf_seated' : 'pf_standing'; }

  function buildJoz(week) {
    const pf = jozLevelFor(week);
    const steps = [];
    const seq = [];
    seq.push(['breathing', 90]);
    seq.push([pf, 60, 'r1']);
    seq.push(['REST', 20]);
    seq.push([pf, 60, 'r2']);
    if (week >= 3) seq.push(['pf_quick', 30]);
    seq.push(['pf_bridge', 60]);
    seq.push(['bird_dog', 60]);
    seq.push(['hip_flexor', 30]);
    seq.push(['relax_breath', 60]);
    steps.push({ k: 'prep', dur: 10, ex: 'breathing', note: 'استلقِ على ظهرك، الركب مثنية.' });
    seq.forEach((s, i) => {
      const [id, d] = s;
      if (id === 'REST') { steps.push({ k: 'rest', dur: d, ex: pf, nextEx: pf, nextSet: 2, nextSets: 2, note: 'ارتخاء كامل — تنفّس طبيعي' }); return; }
      const ex = LIB.byId[id];
      const setInfo = s[2] === 'r1' ? { set: 1, sets: 2 } : s[2] === 'r2' ? { set: 2, sets: 2 } : { set: 1, sets: 1 };
      if (ex.uni) {
        steps.push(Object.assign({ k: 'work', dur: d, ex: id, side: 1, joz: true }, setInfo));
        steps.push(Object.assign({ k: 'switch', dur: 8, ex: id, side: 2 }, setInfo));
        steps.push(Object.assign({ k: 'work', dur: d, ex: id, side: 2, joz: true }, setInfo));
      } else steps.push(Object.assign({ k: 'work', dur: d, ex: id, joz: true }, setInfo));
      const nxt = seq[i + 1];
      if (nxt && nxt[0] !== 'REST' && s[2] !== 'r1') steps.push({ k: 'trans', dur: 12, ex: nxt[0], note: LIB.byId[nxt[0]].setup });
    });
    steps.push({ k: 'done', dur: 0 });
    return { type: 'joz', key: 'J', week, title: 'تمارين الجوز', steps, items: seq.filter(s => s[0] !== 'REST').map(s => ({ id: s[0] })) };
  }

  const planSeconds = plan => plan.steps.reduce((s, st) => s + (st.dur || 0), 0);

  // cycle state for cycle-mode exercises: returns {on:boolean, idx, remainInPhase}
  function cycleState(ex, elapsed) {
    const c = ex.cycle; const per = c.on + c.off;
    const t = elapsed % per; const idx = Math.floor(elapsed / per);
    return t < c.on ? { on: true, idx, left: c.on - t } : { on: false, idx, left: per - t };
  }

  // ----------- progression -------------
  const DIFF = { easy: 2, ok: 1, hard: 0, vhard: -1 };
  function applyFeedback(levels, plan, fb, week) {
    const changes = [];
    const fams = [...new Set(plan.items.map(i => i.fam).filter(Boolean))];
    fams.forEach(f => {
      const L = levels[f] || (levels[f] = { lvl: 1, score: 0 });
      let d = DIFF[fb.difficulty] ?? 1;
      if (fb.completion === 'mostly') d = d - 1;
      if (fb.completion === 'no') d = Math.min(d, 0) - 1;
      if (fb.easyFams && fb.easyFams.includes(f)) d += 2;
      if (fb.hardFams && fb.hardFams.includes(f)) d = -2;
      L.score = Math.max(-3, Math.min(4, (L.score || 0) + d));
      const list = LIB.fam(f);
      const maxAllowed = maxLevelAllowed(f, week);
      const from = Math.min(L.lvl, maxAllowed);
      if (L.score >= 4 && from < list.length) {
        if (from + 1 <= maxAllowed) { L.lvl = from + 1; L.score = 0; changes.push({ fam: f, from, to: L.lvl, dir: 'up' }); }
        else { L.score = 4; }
      } else if (L.score <= -3 && from > 1) {
        L.lvl = from - 1; L.score = 0; changes.push({ fam: f, from, to: L.lvl, dir: 'down' });
      }
    });
    return changes;
  }

  return { PHASES, phaseOf, weekParams, SESSIONS, ORDER, WEEK_TEMPLATE, FAMS, TRAINABLE, cardioTarget, defaultLevels,
    exerciseFor, maxLevelAllowed, buildStrength, buildJoz, planSeconds, cycleState, applyFeedback, jozLevelFor, WARM };
})();

const SPEED = (() => { const s = Number(new URLSearchParams(location.search).get('speed')); return s > 0 && s <= 200 ? s : 1; })();
window.__cues = [];

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = sec => { sec = Math.max(0, Math.ceil(sec)); return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); };
const fmtMin = sec => Math.round(sec / 60);
const dateKey = d => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const todayKey = () => dateKey(new Date());

/* ---------------- storage ---------------- */
const DB = {
  db: null, mode: 'idb', mem: {},
  open() {
    return new Promise(resolve => {
      let settled = false;
      const fallback = () => { if (settled) return; settled = true; this.mode = this.lsOk() ? 'ls' : 'mem'; resolve(); };
      try {
        if (!('indexedDB' in window)) return fallback();
        const r = indexedDB.open('malik-coach', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { if (settled) return; settled = true; this.db = r.result; resolve(); };
        r.onerror = fallback; r.onblocked = fallback;
        setTimeout(fallback, 3000);
      } catch (e) { fallback(); }
    });
  },
  lsOk() { try { localStorage.setItem('mc:t', '1'); localStorage.removeItem('mc:t'); return true; } catch (e) { return false; } },
  get(k) {
    if (this.mode === 'idb') return new Promise(res => {
      try { const q = this.db.transaction('kv', 'readonly').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); }
    });
    if (this.mode === 'ls') { try { const v = localStorage.getItem('mc:' + k); return Promise.resolve(v ? JSON.parse(v) : undefined); } catch (e) { return Promise.resolve(undefined); } }
    return Promise.resolve(this.mem[k]);
  },
  set(k, v) {
    const val = v === undefined ? null : JSON.parse(JSON.stringify(v));
    if (this.mode === 'idb') return new Promise(res => {
      try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); }
    });
    if (this.mode === 'ls') { try { localStorage.setItem('mc:' + k, JSON.stringify(val)); } catch (e) { } return Promise.resolve(true); }
    this.mem[k] = val; return Promise.resolve(true);
  },
  clear() {
    if (this.mode === 'idb') return new Promise(res => { try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });

};

/* ---------------- program calendar ---------------- */
function weekNum() {
  if (!S.profile.startDate) return 1;
  return Math.max(1, Math.floor(daysBetween(S.profile.startDate, todayKey()) / 7) + 1);
}
const weekEntries = w => S.log.filter(e => e.week === w);

/* ---------------- audio (Web Audio API) ---------------- */
const Sound = {
  ctx: null,
  get on() { return S.settings ? S.settings.sound : true; },
  init() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this.ctx) this.ctx = new AC();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource();
      s.buffer = b; s.connect(this.ctx.destination); s.start(0);
    } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, when, type, vol) {
    if (!this.on || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + (when || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.28, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) { }
  },
  cue(name) {
    window.__cues.push(name);
    if (name === 'count') this.tone(880, 0.12);
    else if (name === 'start') { this.tone(1320, 0.5, 0, 'sine', 0.34); }
    else if (name === 'end') { this.tone(660, 0.18, 0, 'triangle'); this.tone(440, 0.32, 0.2, 'triangle'); }
    else if (name === 'on') { this.tone(740, 0.12, 0, 'sine', 0.22); this.tone(988, 0.18, 0.13, 'sine', 0.22); }
    else if (name === 'off') { this.tone(494, 0.3, 0, 'triangle', 0.2); }
    else if (name === 'done') [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.32, i * 0.17));
    else if (name === 'half') { this.tone(988, 0.15); this.tone(988, 0.15, 0.25); }
  },
};

/* ---------------- speech (SpeechSynthesis, optional) ---------------- */
const Voice = {
  ar: null, en: null, inited: false,
  get on() { return S.settings ? S.settings.voice : true; },
  supported() { return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window; },
  init() {
    if (!this.supported()) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices() || [];
      this.ar = vs.find(v => /^ar/i.test(v.lang)) || null;
      this.en = vs.find(v => /^en/i.test(v.lang)) || null;
    };
    try {
      pick(); speechSynthesis.onvoiceschanged = pick;
      if (!this.inited) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); this.inited = true; }
    } catch (e) { }
  },
  say(ar, en) {
    window.__cues.push('say:' + (ar || en));
    if (!this.on || !this.supported()) return;
    try {
      const useAr = !!this.ar, text = useAr ? ar : en;
      if (!text) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (useAr) { u.voice = this.ar; u.lang = this.ar.lang; } else { u.lang = 'en-US'; if (this.en) u.voice = this.en; }
      u.rate = 1; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) { }
  },
  stop() { try { if (this.supported()) speechSynthesis.cancel(); } catch (e) { } },
};

/* ---------------- wake lock ---------------- */
const Wake = {
  sentinel: null, want: false,
  supported() { return 'wakeLock' in navigator; },
  async on() {
    this.want = true; window.__cues.push('wakelock:request');
    if (!this.supported()) return false;
    try {
      this.sentinel = await navigator.wakeLock.request('screen');
      this.sentinel.addEventListener('release', () => { this.sentinel = null; });
      return true;
    } catch (e) { this.sentinel = null; return false; }
  },
  off() { this.want = false; try { this.sentinel && this.sentinel.release(); } catch (e) { } this.sentinel = null; },
};

/* ---------------- video manager ----------------
   Every exercise maps to a local file in LIB.videoManifest.
   A file is used only after it has proven it can load; otherwise
   the animated demonstration is shown. No broken video element
   is ever displayed. */
const VID = {
  ok: {}, pending: {}, pool: {},
  url(id) { return LIB.videoManifest[id]; },
  probe(id) {
    if (id in this.ok) return Promise.resolve(this.ok[id]);
    if (this.pending[id]) return this.pending[id];
    this.pending[id] = new Promise(res => {
      let done = false;
      const v = document.createElement('video');
      const fin = ok => {
        if (done) return; done = true; this.ok[id] = ok; delete this.pending[id];
        if (ok) this.pool[id] = v; else { try { v.removeAttribute('src'); v.load(); } catch (e) { } }
        res(ok);
      };
      v.muted = true; v.playsInline = true; v.preload = 'metadata';
      v.addEventListener('loadedmetadata', () => fin(true));
      v.addEventListener('error', () => fin(false));
      setTimeout(() => fin(false), 8000);
      try { v.src = this.url(id); v.load(); } catch (e) { fin(false); }
    });
    return this.pending[id];
  },
  probeMany(ids) { return Promise.all([...new Set(ids)].map(id => this.probe(id))); },
  el(id) {
    let v = this.pool[id];
    if (!v) { v = document.createElement('video'); v.src = this.url(id); this.pool[id] = v; }
    v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', ''); v.setAttribute('loop', '');
    v.preload = 'auto'; v.className = 'demo-video';
    return v;
  },
  preload(id) {
    if (!id) return;
    this.probe(id).then(ok => { if (ok) { const v = this.el(id); try { v.preload = 'auto'; v.load(); } catch (e) { } } });
  },
};

/* Media slot: shows a video when available, otherwise the animated figure */
function MediaSlot(root) {
  this.root = root;
  root.innerHTML = '<div class="ms-video"></div><div class="ms-fig"></div>';
  this.vbox = root.querySelector('.ms-video'); this.fbox = root.querySelector('.ms-fig');
  this.player = new FIG.Player(this.fbox);
  this.id = null; this.kind = null;
}
MediaSlot.prototype.show = function (id, drive) {
  const same = this.id === id;
  this.id = id;
  const ex = LIB.byId[id];
  if (VID.ok[id] === true) {
    if (!same || this.kind !== 'video') {
      this.player.stop();
      const v = VID.el(id);
      v.onerror = () => { VID.ok[id] = false; if (this.id === id) { this.kind = null; this.show(id, drive); } };
      this.vbox.replaceChildren(v); this.root.dataset.kind = 'video'; this.kind = 'video';
    }
    const v = this.vbox.firstChild; if (v && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => { }); }
  } else {
    if (!same || this.kind !== 'fig') {
      this.vbox.replaceChildren(); this.player.load(ex); this.root.dataset.kind = 'fig'; this.kind = 'fig';
    }
    this.player.setDrive(drive || null);
    if (VID.ok[id] === undefined) VID.probe(id).then(ok => { if (ok && this.id === id) this.show(id, drive); });
  }
};
MediaSlot.prototype.pause = function () { this.player.pause(); const v = this.vbox.firstChild; if (v) try { v.pause(); } catch (e) { } };
MediaSlot.prototype.resume = function () { this.player.resume(); const v = this.vbox.firstChild; if (v) { const p = v.play(); if (p && p.catch) p.catch(() => { }); } };
MediaSlot.prototype.clear = function () { this.player.stop(); this.vbox.replaceChildren(); this.id = null; this.kind = null; };

/* ---------------- hands-free engine ---------------- */
const WO = {
  plan: null, i: 0, endAt: 0, rem: 0, paused: false, iv: null, siv: null, lastSec: -1,
  elapsed: 0, lastNow: 0, cycOn: null, previewing: false, slot: null, total: 0, startedAt: 0, pauseReason: null,

  begin(plan, resume) {
    Sound.init(); Voice.init(); Wake.on();              // must run inside the tap
    this.plan = plan; this.paused = false; this.pauseReason = null;
    this.total = PROG.planSeconds(plan);
    this.elapsed = resume ? resume.elapsed || 0 : 0;
    this.startedAt = resume ? resume.startedAt : Date.now();
    this.doneWork = resume ? resume.doneWork || 0 : 0;
    UI.openWorkout(plan);
    if (!this.slot) this.slot = new MediaSlot($('#woMedia'));
    VID.probeMany(plan.steps.filter(s => s.ex).map(s => s.ex));
    this.lastNow = performance.now();
    this.enter(resume ? resume.i : 0, resume ? resume.remMs : null, !!resume);
    clearInterval(this.iv); clearInterval(this.siv);
    this.iv = setInterval(() => this.tick(), 100);
    this.siv = setInterval(() => this.save(), 3000);
  },

  step(i) { return this.plan.steps[i ?? this.i]; },

  enter(i, remMs, resumed) {
    this.i = i;
    const st = this.step();
    if (!st || st.k === 'done') return this.finish();
    this.rem = remMs != null ? remMs : st.dur * 1000;
    this.endAt = performance.now() + this.rem / SPEED;
    this.lastSec = Math.ceil(this.rem / 1000);
    this.cycOn = null; this.previewing = false;
    UI.woStep(st, this);
    if (!resumed) this.announce(st);
    const nx = this.nextWork(); if (nx) VID.preload(nx.ex);
    this.save();
  },

  nextWork(from) {
    for (let j = (from ?? this.i) + 1; j < this.plan.steps.length; j++) { const s = this.plan.steps[j]; if (s.k === 'work') return s; }
    return null;
  },

  announce(st) {
    const ex = st.ex ? LIB.byId[st.ex] : null;
    if (st.k === 'prep') Voice.say('استعد. ' + ex.ar, 'Get ready. ' + ex.en);
    else if (st.k === 'work') {
      Sound.cue('start');
      setTimeout(() => {
        if (this.paused) return;
        if (st.side === 2 || ex.mode === 'cycle') return;
        if (st.set > 1) Voice.say('المجموعة ' + st.set, 'Set ' + st.set);
        else Voice.say(ex.ar, ex.en);
      }, 420);
    } else if (st.k === 'rest') { Sound.cue('end'); Voice.say('راحة', 'Rest'); }
    else if (st.k === 'switch') { Sound.cue('end'); Voice.say('بدّل الجهة', 'Switch sides'); }
    else if (st.k === 'trans') {
      const prev = this.plan.steps[this.i - 1];
      if (prev && prev.k === 'work') Sound.cue('end');
      Voice.say('التالي: ' + ex.ar, 'Next: ' + ex.en);
    }
  },

  tick() {
    if (!this.plan) return;
    const now = performance.now();
    const dt = (now - this.lastNow) * SPEED; this.lastNow = now;
    if (this.paused) return;
    this.elapsed += dt / 1000;
    const st = this.step();
    this.rem = Math.max(0, (this.endAt - now) * SPEED);
    const sec = Math.ceil(this.rem / 1000);
    if (sec !== this.lastSec) {
      for (let s2 = Math.min(this.lastSec - 1, st.dur); s2 >= sec; s2--) this.onSecond(st, s2);
      this.lastSec = sec;
    }
    if (st.k === 'work' && st.ex && LIB.byId[st.ex].mode === 'cycle') this.cycle(st);
    if (st.k === 'rest' && !this.previewing && this.rem <= 12000) { this.previewing = true; UI.woPreviewNext(st, this); }
    UI.woTime(st, this);
    if (this.rem <= 0) {
      if (st.k === 'work') this.doneWork++;
      this.enter(this.i + 1);
    }
  },

  onSecond(st, sec) {
    const next = this.plan.steps[this.i + 1];
    if (st.k !== 'work' && next && next.k === 'work' && sec >= 1 && sec <= 3) Sound.cue('count');
    if (st.k === 'rest' && sec === 12) {
      const nx = LIB.byId[st.nextEx];
      if (st.nextEx !== st.ex) Voice.say('التالي: ' + nx.ar, 'Next: ' + nx.en);
      else Voice.say('استعد للمجموعة ' + st.nextSet, 'Get ready for set ' + st.nextSet);
    }
  },

  cycle(st) {
    const ex = LIB.byId[st.ex];
    const elapsed = st.dur - this.rem / 1000;
    const cs = PROG.cycleState(ex, Math.max(0, elapsed));
    if (cs.on !== this.cycOn) {
      this.cycOn = cs.on;
      Sound.cue(cs.on ? 'on' : 'off');
      if (ex.cycle.on >= 3 && (cs.idx < 3 || ex.fam === 'joz')) Voice.say(cs.on ? ex.cycle.onAr : ex.cycle.offAr, cs.on ? ex.cycle.onEn : ex.cycle.offEn);
    }
    UI.woCycle(ex, cs);
  },

  pause(reason) {
    if (!this.plan || this.paused) return;
    this.paused = true; this.pauseReason = reason || 'user';
    this.rem = Math.max(0, (this.endAt - performance.now()) * SPEED);
    this.slot && this.slot.pause(); Voice.stop();
    window.__cues.push('pause');
    UI.woPaused(true, this.pauseReason); this.save();
  },
  resume() {
    if (!this.plan || !this.paused) return;
    Sound.init(); Wake.on();
    this.paused = false; this.pauseReason = null; this.lastNow = performance.now();
    this.endAt = performance.now() + this.rem / SPEED;
    this.slot && this.slot.resume();
    window.__cues.push('resume');
    UI.woPaused(false);
  },

  snapshot() {
    return { plan: this.plan, i: this.i, remMs: Math.round(this.paused ? this.rem : Math.max(0, (this.endAt - performance.now()) * SPEED)),
      elapsed: Math.round(this.elapsed), startedAt: this.startedAt, savedAt: Date.now(), doneWork: this.doneWork };
  },
  save() { if (!this.plan) return; S.active = this.snapshot(); save('active'); },

  workCount() { return this.plan.steps.filter(s => s.k === 'work').length; },

  teardown() {
    clearInterval(this.iv); clearInterval(this.siv); this.iv = this.siv = null;
    this.slot && this.slot.clear(); Voice.stop(); Wake.off();
  },

  finish() {
    const plan = this.plan;
    const result = { plan, elapsed: Math.round(this.elapsed), ratio: 1, doneWork: this.workCount(), completed: true };
    this.teardown(); this.plan = null;
    S.active = null; save('active');
    Sound.cue('done'); Voice.say('انتهى التمرين', 'Workout complete');
    window.__cues.push('finished');
    UI.openPost(result);
  },

  stop() {
    const plan = this.plan;
    const total = this.workCount();
    const ratio = total ? Math.min(1, this.doneWork / total) : 0;
    const result = { plan, elapsed: Math.round(this.elapsed), ratio, doneWork: this.doneWork, completed: false };
    this.teardown(); this.plan = null;
    S.active = null; save('active');
    window.__cues.push('stopped');
    if (result.elapsed >= 120 && this.doneWork > 0) UI.openPost(result); else UI.closeWorkout();
  },
};

document.addEventListener('visibilitychange', () => {

    window.scrollTo(0, 0);
  },
  refresh() { if (!$('#shell').hidden) this['r_' + this.tab](); },

  /* ---------- modal ---------- */
  modal(html, opts) {
    const m = $('#modal');
    m.querySelector('.modal-body').innerHTML = html;
    m.hidden = false; m.dataset.kind = (opts && opts.kind) || '';

  },
  closeModal() {
    const m = $('#modal'); m.hidden = true;
    if (this.modalPlayer) { this.modalPlayer.clear(); this.modalPlayer = null; }
    m.querySelector('.modal-body').innerHTML = '';
  },

  /* ================= ONBOARDING ================= */
  obStep: 0, calib: {},
  openOnboard(step) {

    const w = S.settings.wedding || '';
    const screens = [
      `<div class="ob ob-intro">

        <p class="ob-back" dir="ltr">BACK TO WORK.</p>
        <p class="ob-line">رجعنا. لكن هالمرة بخطة.</p>
        <p class="ob-sub">8 أسابيع بوزن الجسم، 3 جلسات أسبوعيًا، والجوال يشغّل التمرين كامل وأنت تتمرن.</p>
        <button class="btn btn-primary" data-act="ob" data-v="1">التالي</button></div>`,
      `<div class="ob">
        <h2>كم باقي على الزواج؟</h2>
        <p class="ob-sub">اختياري. يظهر عدّاد هادئ في الرئيسية، ويبقى في جوالك فقط.</p>
        <label class="field"><span>تاريخ الزواج</span><input type="date" id="obWedding" value="${esc(w)}"></label>
        <div class="row"><button class="btn btn-primary" data-act="obWedding">التالي</button><button class="btn btn-ghost" data-act="ob" data-v="2">تخطَّ</button></div></div>`,
      `<div class="ob">
        <h2>فحص البداية</h2>
        <p class="ob-sub">خمس دقائق تقريبًا. ما فيه اختبار أقصى ولا تحدي — فقط نختار منه المستوى المناسب لكل حركة.</p>
        <ul class="plain"><li>ضغط مائل بهدوء</li><li>جودة السكوات</li><li>راحة البلانك</li><li>التوازن في الطعن</li></ul>
        <button class="btn btn-primary" data-act="calStart">ابدأ الفحص</button>
        <button class="btn btn-ghost" data-act="calSkip">تخطَّ وابدأ من المستويات الأسهل</button></div>`,
    ];

  },

  CALQ: [
    { id: 'pain', demo: null, q: 'هل عندك ألم حالي في الكتف أو الركبة أو أسفل الظهر؟', opts: [['no', 'لا'], ['yes', 'نعم']] },
    { id: 'push', demo: 'incline_pushup', q: 'سوِّ ضغط مائل على كرسي ثابت مسنود على الجدار، ببطء. وقف لما تحس إن باقي لك 2–3 تكرارات نظيفة. كم تكرار سويت؟', opts: [['lt8', 'أقل من 8'], ['8to15', '8 إلى 15'], ['gt15', 'أكثر من 15']] },
    { id: 'floor', demo: 'pushup', q: 'جرّب ضغط عادي على الأرض بنفس الطريقة. كم تكرار نظيف قبل ما تبقى 2–3؟', opts: [['lt6', 'أقل من 6'], ['6to12', '6 إلى 12'], ['gt12', 'أكثر من 12']], when: a => a.push === 'gt15' },
    { id: 'squat', demo: 'squat', q: 'سوِّ 10 سكوات ببطء. كيف كانت؟', opts: [['hard', 'صعبة أو فيها ألم أو عدم توازن'], ['ok', 'مريحة'], ['easy', 'سهلة جدًا والكعب ثابت']] },
    { id: 'plank', demo: 'plank', q: 'جرّب بلانك على الساعد 20 ثانية. كيف كان؟', opts: [['no', 'ما قدرت أو ألم أسفل الظهر'], ['hard', 'قدرت بصعوبة'], ['easy', 'سهل']] },
    { id: 'split', demo: 'split_squat', q: 'قف بوضعية الطعن (رجل قدّام ورجل ورا) وانزل شوي. هل توازنك مريح؟', opts: [['no', 'لا، أحتاج سند'], ['yes', 'نعم']] },
  ],
  calIdx: 0,
  calNext() {
    const Q = this.CALQ;
    while (this.calIdx < Q.length && Q[this.calIdx].when && !Q[this.calIdx].when(this.calib)) this.calIdx++;
    if (this.calIdx >= Q.length) return this.calFinish();
    const q = Q[this.calIdx];
    const o = $('#onboard');
    o.innerHTML = `<div class="ob">
      <p class="ob-count">فحص البداية — ${this.calIdx + 1} / ${Q.length}</p>
      ${q.demo ? `<div class="demo-box" id="calDemo"></div><p class="demo-name" dir="ltr">${esc(LIB.byId[q.demo].en)}</p><ul class="cues">${LIB.byId[q.demo].cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
      <h2 class="cal-q">${esc(q.q)}</h2>
      <div class="opts">${q.opts.map(([v, l]) => `<button class="btn btn-opt" data-act="calAns" data-v="${v}">${esc(l)}</button>`).join('')}</div></div>`;
    if (q.demo) { this.calSlot && this.calSlot.clear(); this.calSlot = new MediaSlot($('#calDemo')); this.calSlot.show(q.demo); }
  },
  calFinish() {
    const a = this.calib, L = PROG.defaultLevels();
    const set = (f, l, sc) => { L[f] = { lvl: l, score: sc || 0 }; };
    if (a.push === 'lt8') { set('push', 1); set('armpush', 1); }
    else if (a.push === '8to15') { set('push', 2); set('armpush', 1); }
    else if (a.push === 'gt15') {
      if (a.floor === 'gt12') { set('push', 4); set('armpush', 2); }
      else if (a.floor === '6to12') { set('push', 3, 1); set('armpush', 2); }
      else { set('push', 3); set('armpush', 1); }
    }
    set('pike', (L.push.lvl >= 4) ? 2 : 1);
    if (a.squat === 'hard') set('squat', 1); else if (a.squat === 'easy') set('squat', 2, 1); else set('squat', 2);
    set('lunge', a.split === 'yes' && a.squat !== 'hard' ? 2 : 1);
    if (a.plank === 'easy') { set('core', 2); set('side', 2); } else if (a.plank === 'hard') { set('core', 1, 1); set('side', 1); } else { set('core', 1); set('side', 1); }
    if (a.pain === 'yes') Object.keys(L).forEach(f => { L[f] = { lvl: 1, score: 0 }; });
    S.levels = L; save('levels');
    S.profile.calibrated = true; save('profile');
    this.calSlot && this.calSlot.clear();
    const rows = ['push', 'armpush', 'pike', 'squat', 'lunge', 'core', 'side'].map(f => {
      const e = LIB.fam(f).find(x => x.lvl === L[f].lvl);
      return `<li><span>${esc(PROG.FAMS[f].ar)}</span><b dir="ltr">${esc(e.en)}</b></li>`;
    }).join('');
    $('#onboard').innerHTML = `<div class="ob">
      <h2>نقطة البداية</h2>
      ${a.pain === 'yes' ? '<p class="note">بدأنا كل الحركات من المستوى الأسهل. أي تمرين يسبب ألم حاد: وقفه، وإذا استمر الألم راجع مختص.</p>' : ''}
      <ul class="lvl-list">${rows}</ul>
      <p class="ob-sub">التطبيق يرفع المستوى تلقائيًا لما تقييمك بعد التمارين يقول إنك جاهز.</p>
      <button class="btn btn-primary" data-act="journey">ابدأ الرحلة</button></div>`;
  },

  /* ================= RESUME ================= */
  checkResume() {
    const a = S.active;
    if (!a || !a.plan) return;
    if (Date.now() - a.savedAt > 24 * 3600 * 1000) { S.active = null; save('active'); return; }
    const st = a.plan.steps[a.i] || {};
    const exId = st.k === 'rest' ? st.nextEx : st.ex;
    const ex = exId ? LIB.byId[exId] : null;
    const remaining = a.plan.steps.slice(a.i + 1).reduce((s, x) => s + x.dur, 0) + a.remMs / 1000;
    this.modal(`<h2>تكمل من وين وقفت؟</h2>
      <dl class="kv"><div><dt>الجلسة</dt><dd dir="auto">${esc(a.plan.title)}</dd></div>
      ${ex ? `<div><dt>التمرين</dt><dd dir="ltr">${esc(ex.en)}</dd></div>` : ''}
      ${st.sets ? `<div><dt>المجموعة</dt><dd>${st.set} / ${st.sets}</dd></div>` : ''}
      <div><dt>المتبقي من الجلسة</dt><dd>${fmtMin(remaining)} دقيقة</dd></div></dl>
      <button class="btn btn-primary" data-act="resumeGo">كمل</button>
      <button class="btn btn-ghost" data-act="resumeRestart">ابدأ الجلسة من جديد</button>
      <button class="btn btn-ghost" data-act="resumeDrop">احذف الجلسة المحفوظة</button>`, { kind: 'resume' });
  },

  /* ================= TODAY ================= */
  todayState() {
    const w = weekNum(), dk = doneKeys(w), t = todayKey(), y = addDays(t, -1);
    const strengthToday = S.log.find(e => e.type === 'strength' && e.dateKey === t);
    const strengthYesterday = S.log.some(e => e.type === 'strength' && e.dateKey === y);
    const nextKey = PROG.ORDER.find(k => !dk.has(k)) || null;
    const jozWeek = weekEntries(w).filter(e => e.type === 'joz').length;
    const jozToday = S.log.some(e => e.type === 'joz' && e.dateKey === t);
    const cardioWeek = weekEntries(w).filter(e => e.type === 'cardio');
    const cardioToday = S.log.some(e => e.type === 'cardio' && e.dateKey === t);
    return { w, dk, strengthToday, strengthYesterday, nextKey, jozWeek, jozToday, cardioWeek, cardioToday };
  },

  sessionCard(key, primary) {
    const plan = PROG.buildStrength(key, S.levels, weekNum());
    const mins = Math.round(PROG.planSeconds(plan) / 60);
    const areas = ['الصدر', 'الظهر', 'الأرجل', 'الأكتاف', 'البطن'];
    return `<article class="session ${primary ? 'session-primary' : ''}">
      <div class="session-head"><span class="session-letter" dir="ltr">${key}</span>
        <div><h3 dir="ltr">${esc(plan.title)}</h3><p>${mins} دقيقة تقريبًا</p><p class="areas">${areas.join('، ')}</p></div></div>
      <ol class="ex-list">${plan.items.map(it => { const e = LIB.byId[it.id]; return `<li><span dir="ltr">${esc(e.en)}</span><small>${setsAr(it.sets, e.uni)}</small></li>`; }).join('')}</ol>
      ${primary ? `<div class="sound-row">
        <button class="chip" data-act="toggleSound" aria-pressed="${S.settings.sound}">${S.settings.sound ? 'التنبيهات الصوتية: تعمل' : 'التنبيهات الصوتية: مطفأة'}</button>
        <button class="chip" data-act="toggleVoice" aria-pressed="${S.settings.voice}">${S.settings.voice ? 'الصوت المنطوق: يعمل' : 'الصوت المنطوق: مطفأ'}</button></div>
        <button class="btn btn-primary btn-start" data-act="startStrength" data-v="${key}">ابدأ التمرين</button>
        <button class="btn btn-link" data-act="preview" data-v="${key}">عرض تفاصيل الجلسة</button>` :
        `<button class="btn btn-secondary" data-act="startStrength" data-v="${key}">ابدأ Full Body ${key}</button>`}
    </article>`;
  },

  weddingStrip() {
    const wd = S.settings.wedding; if (!wd) return '';
    const d = daysBetween(todayKey(), wd);
    if (d < 0) return `<section class="wedding"><p class="wed-main">ألف مبروك يا مالك.</p><p class="wed-sub">الاستمرار بعد الزواج أسهل من البداية من جديد.</p></section>`;
    if (d === 0) return `<section class="wedding"><p class="wed-main">اليوم يومك. ألف مبروك.</p></section>`;
    const wk = Math.floor(d / 7), dd = d % 7;
    const txt = wk ? `${wk} ${wk === 1 ? 'أسبوع' : wk === 2 ? 'أسبوعين' : wk <= 10 ? 'أسابيع' : 'أسبوعًا'}${dd ? ` و${dd} ${dd === 1 ? 'يوم' : dd === 2 ? 'يومين' : 'أيام'}` : ''}` : `${dd} ${dd === 1 ? 'يوم' : dd === 2 ? 'يومين' : 'أيام'}`;
    return `<section class="wedding"><p class="wed-label">الزواج بعد</p><p class="wed-main">${txt}</p><p class="wed-sub">كل أسبوع له قيمة.</p></section>`;
  },

  weekReport(w, compact) {
    const E = weekEntries(w);
    const str = E.filter(e => e.type === 'strength'), car = E.filter(e => e.type === 'cardio'), joz = E.filter(e => e.type === 'joz');
    const mins = Math.round(E.reduce((s, e) => s + (e.durSec || 0), 0) / 60);
    const ch = []; str.forEach(e => (e.changes || []).forEach(c => ch.push(c)));
    const done = new Set(str.filter(e => (e.ratio ?? 1) >= 0.6).map(e => e.key)).size;
    const msg = done >= 3 ? 'أسبوع جيد. كمل.' : done === 2 ? 'أسبوع مقبول. الأسبوع الجاي نكمّل الثلاث.' : E.length ? 'أسبوع خفيف. نرجع للإيقاع — جلسة وحدة تكفي للبداية.' : 'ما فيه تمارين مسجلة هذا الأسبوع.';
    const diffAr = { easy: 'سهل', ok: 'مناسب', hard: 'صعب', vhard: 'صعب جدًا' };
    return `<article class="report">
      <h3>أسبوع مالك — الأسبوع ${w}</h3>
      <dl class="report-grid"><div><dt>جلسات القوة</dt><dd>${done} / 3</dd></div><div><dt>مشي</dt><dd>${car.length} <small>(${Math.round(car.reduce((s, e) => s + e.durSec, 0) / 60)} د)</small></dd></div>
      <div><dt>تمارين الجوز</dt><dd>${joz.length}</dd></div><div><dt>وقت التمرين</dt><dd>${mins} <small>دقيقة</small></dd></div></dl>
      ${ch.length ? `<ul class="changes">${ch.map(c => { const a = LIB.fam(c.fam).find(x => x.lvl === c.from), b = LIB.fam(c.fam).find(x => x.lvl === c.to); return `<li>${esc(PROG.FAMS[c.fam].ar)}: <span dir="ltr">${esc(a.en)} → ${esc(b.en)}</span></li>`; }).join('')}</ul>` : ''}
      <p class="report-msg">${msg}</p>
      ${compact ? '' : `<details><summary>تفاصيل الجلسات</summary><ul class="entries">${E.slice().sort((x, y) => x.ts - y.ts).map(e => `<li><span>${esc(e.dateKey)}</span><span dir="auto">${esc(e.title)}</span><span>${Math.round(e.durSec / 60)} د</span><span>${e.difficulty ? diffAr[e.difficulty] : ''}${e.ratio != null && e.ratio < 1 ? ` — ${Math.round(e.ratio * 100)}%` : ''}</span></li>`).join('') || '<li>لا يوجد</li>'}</ul></details>`}
    </article>`;
  },

  r_today() {
    const T = this.todayState();
    const ph = PROG.phaseOf(Math.min(T.w, 8));
    const ct = PROG.cardioTarget(T.w);
    let hero = '';
    if (T.strengthToday) {
      hero = `<article class="session session-done"><h3>تمرين اليوم تم</h3><p dir="auto">${esc(T.strengthToday.title)} — ${Math.round(T.strengthToday.durSec / 60)} دقيقة</p>
        <p>الباقي لليوم: أكل كافي، نوم كويس. وإذا تبغى: تمارين الجوز ${T.jozToday ? '(تمت اليوم)' : 'بعد ساعات أو بكرة'}.</p></article>`;
    } else if (T.nextKey && !T.strengthYesterday) hero = this.sessionCard(T.nextKey, true);
    else if (T.nextKey && T.strengthYesterday) {
      hero = `<article class="session session-recovery"><h3>اليوم استشفاء</h3><p>تمرنت أمس. العضلة تكبر وقت الراحة: مشي خفيف + تمارين الجوز.</p>
        <button class="btn btn-primary" data-act="cardio">ابدأ المشي</button></article>` + this.sessionCard(T.nextKey, false);
    } else hero = `<article class="session session-done"><h3>خلصت جلسات القوة لهالأسبوع</h3><p>باقي المشي وتمارين الجوز، والراحة جزء من الخطة.</p></article>`;

    let report = '';
    if (T.w > 1 && !S.settings.seenReports.includes(T.w - 1) && weekEntries(T.w - 1).length) {
      report = `<section class="report-banner">${this.weekReport(T.w - 1, true)}<button class="btn btn-ghost" data-act="seenReport" data-v="${T.w - 1}">تم</button></section>`;
    }

    const weekDots = PROG.ORDER.map(k => `<li class="${T.dk.has(k) ? 'is-done' : ''}"><span dir="ltr">${k}</span></li>`).join('');
    const recent = S.log.slice(-3).reverse();
    $('#tab-today').innerHTML = `
      <header class="page-head"><p class="kicker">الأسبوع ${T.w > 8 ? `${T.w} — استمرار` : `${T.w} من 8`} — مرحلة ${ph.ar}</p><h1>وش علي اليوم؟</h1></header>
      ${report}
      ${hero}
      ${this.weddingStrip()}
      <section class="block"><h2>هذا الأسبوع</h2>
        <ul class="week-dots">${weekDots}</ul>
        <dl class="mini"><div><dt>مشي</dt><dd>${T.cardioWeek.length} / ${ct.times}</dd></div><div><dt>تمارين الجوز</dt><dd>${T.jozWeek} / 3–4</dd></div></dl></section>
      ${!T.jozToday ? `<section class="block joz-card"><h2>تمارين الجوز</h2><p>9 دقائق تقريبًا. تشتغل لحالها من أول ضغطة.</p><button class="btn btn-secondary" data-act="go" data-v="joz">افتح تمارين الجوز</button></section>` : ''}
      ${!T.cardioToday ? `<section class="block"><h2>المشي</h2><p>هذه المرحلة: ${ct.min}–${ct.max} دقيقة مشي سريع، ${ct.times} مرات أسبوعيًا. سرعة تقدر تتكلم فيها لكن ما تقدر تغني.</p>
        <div class="row"><button class="btn btn-secondary" data-act="cardio">ابدأ مؤقت المشي</button><button class="btn btn-ghost" data-act="cardioLog">سجّل مشي سويته</button></div></section>` : ''}
      <section class="block"><h2>آخر التقدم</h2>${recent.length ? `<ul class="entries">${recent.map(e => `<li><span>${esc(e.dateKey)}</span><span dir="auto">${esc(e.title)}</span><span>${Math.round(e.durSec / 60)} د</span></li>`).join('')}</ul>` : '<p class="muted">أول جلسة تسجّل هنا. ابدأ بها.</p>'}</section>`;
  },

  /* ================= PLAN ================= */
  r_plan() {

    const phases = PROG.PHASES.map(p => `<li class="${w >= p.from && w <= p.to ? 'is-now' : ''}"><p class="ph-weeks">الأسابيع ${p.from}–${p.to}</p><h3>${p.ar} <span dir="ltr">${p.en}</span></h3><p>${p.goal}</p><p class="ph-rir">RIR ${p.rir}</p></li>`).join('');
